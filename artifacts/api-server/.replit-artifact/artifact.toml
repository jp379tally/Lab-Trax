kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/downloads", "/uploads", "/cases"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Replit binds DATABASE_URL to the production database during this stage.
# Keep the read-only schema preflight before compilation and promotion.
args = ["pnpm", "run", "build:api-production"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# --max-old-space-size: declare a heap budget so GC runs aggressively before
# the platform OOM-kills the process. Source maps omitted in production to
# save ~9 MB of parsed memory; stack traces still have function names.
args = [".production-runtime/bin/node", "--max-old-space-size=512", ".production-api/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
