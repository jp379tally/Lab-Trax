      summary: List completed authorization PDFs for a practice
      parameters:
        - { in: path, name: practiceId, required: true, schema: { type: string } }
        - { in: query, name: labOrganizationId, schema: { type: string } }
      responses:
        "200":
          description: Completed authorization documents
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PracticeAuthorizationDocument" }
        "403": { description: Billing access required }
    post:
      operationId: uploadPracticeAuthorizationDocument
      tags: [lab-authorizations]
      summary: Upload a completed authorization PDF
      parameters:
        - { in: path, name: practiceId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [authorizationType, file]
              properties:
                authorizationType: { type: string, enum: [card_on_file, autopay] }
                labOrganizationId: { type: string }
                supersedesDocumentId: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded authorization document
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { $ref: "#/components/schemas/PracticeAuthorizationDocument" }
        "400": { description: Invalid upload }
        "403": { description: Billing access required }
        "404": { description: Authorization document to supersede was not found }
        "409": { description: Authorization document was already superseded }
        "413": { description: PDF exceeds the upload size limit }
        "415": { description: PDF required }
        "503": { description: Authorization storage is unavailable }

