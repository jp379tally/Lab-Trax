          description: Live settled amount across the statement's invoices.
        currentTotalPaid:
          type: string
          description: Explicit alias of the live settled amount.
        balanceDue:
          type: string
          description: Live outstanding amount across the statement's invoices.
        currentBalanceDue:
          type: string
          description: Explicit alias of the live outstanding amount.
        snapshotTotalPaid:
