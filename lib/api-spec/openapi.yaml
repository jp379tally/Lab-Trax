openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: locations
    description: Case location (station) operations (LabTrax)
  - name: vocabulary
    description: Lab vocabulary (material, shade, restoration type) operations (LabTrax)
  - name: ai
    description: AI assistant operations (LabTrax)
  - name: cases
    description: Case operations (LabTrax)
  - name: doctors
    description: Doctor / merge operations (LabTrax)
  - name: invoices
    description: Invoice + payment operations (LabTrax)
  - name: billing
    description: Subscription billing operations (LabTrax)
  - name: notifications
    description: In-app notification operations (LabTrax)
  - name: backup
    description: Backup and schedule operations (LabTrax)
  - name: users
    description: User profile and preference operations (LabTrax)
  - name: messenger
    description: Real-time direct-message operations (LabTrax)
  - name: auth
    description: Authentication, registration, sessions, and verification (LabTrax)
  - name: organizations
    description: Organization, membership, and invitation operations (LabTrax)
  - name: audit
    description: Audit-log read operations (LabTrax)
  - name: stats
    description: Read-only lab-scoped analytics aggregates (LabTrax)
  - name: analytics
    description: Privacy-preserving first-party aggregate analytics
  - name: lab-inbox
    description: Unassigned Documents inbox operations (LabTrax)
  - name: catalog
    description: Lab-scoped case-type/subtype/material catalog operations (LabTrax)
  - name: scans
    description: Resumable 3D scanner operations (LabTrax)
paths:
  /billing/checkout-session:
    post:
      operationId: createSubscriptionCheckout
      description: For new provider accounts uses the persisted fixed tier and immutable attempt; only server verification completes onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionCheckoutInput" }
      responses:
        "200":
          description: Hosted card collection link, not confirmed signup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionCheckoutResult" }
        "403": { description: Purchase route not permitted for this distribution }
        "409": { description: Existing or uncertain checkout must be reconciled }
        "503": { description: Paid configuration unavailable; Free remains available }
  /billing/provider-plans:
    get:
      operationId: getProviderSignupPlans
      responses:
        "200":
          description: Fixed provider choices independent of Stripe availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSignupCatalog"
  /billing/provider-plan:
    post:
      operationId: selectProviderSignupPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSignupSelection"
      responses:
        "200":
          description: Selection saved without completing paid onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSignupSelectionResult"
        "409": { description: Prior processor outcome must be reconciled first }
  /creator/access:
    get:
      operationId: getCreatorAccess
      summary: Safe creator capability, bound to the authenticated account and session
      responses:
        "200":
          description: Capability only, never identity or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorAccess" }
  /creator/unlock:
    post:
      operationId: unlockCreator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorPinInput" }
      responses:
        "200":
          description: Session unlocked for thirty minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorUnlockResult" }
        "403": { description: Noncreator or incorrect PIN }
        "429": { description: Durable account attempt limit exceeded }
  /creator/pin:
    post:
      operationId: rotateCreatorPin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorPinRotation" }
      responses:
        "200": { description: Rotated and all Creator unlocks revoked }
        "403": { description: Noncreator or incorrect current PIN }
        "429": { description: Durable account attempt limit exceeded }
  /creator/lock:
    post:
      operationId: lockCreator
      responses:
        "200": { description: Current session locked }
  /creator/revenue:
    get:
      operationId: getCreatorRevenue
      parameters:
        - { in: query, name: start, required: true, schema: { type: string, format: date } }
        - { in: query, name: end, required: true, schema: { type: string, format: date } }
        - { in: query, name: timezone, schema: { type: string, default: UTC } }
        - { in: query, name: group, schema: { type: string, enum: [daily, monthly, yearly], default: daily } }
      responses:
        "200":
          description: Inclusive local calendar dates and currency-separated collected fees
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorRevenue" }
  /creator/revenue/reconcile:
    post:
      operationId: reconcileCreatorRevenue
      responses:
        "200": { description: Bounded resumable read-only provider history ingestion }
  /creator/feedback:
    get:
      operationId: getCreatorFeedback
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [new, reviewed] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Private inbox, including unexpired support issues and feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorFeedbackList" }
  /creator/feedback/{id}:
    patch:
      operationId: reviewCreatorFeedback
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorFeedbackReview" }
      responses:
        "200": { description: Reviewed state saved }
  /creator/feedback/{reportId}/attachments/{attachmentId}:
    get:
      operationId: downloadCreatorFeedbackAttachment
      parameters:
        - { in: path, name: reportId, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private opaque download, never a public storage URL
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /invoices/reports/sales-invoices:
    get:
      operationId: getSalesInvoices
      tags: [invoices]
      summary: Paged persisted invoices behind billed sales
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string }
        - in: query
          name: dateFrom
          required: true
          schema: { type: string }
        - in: query
          name: dateTo
          required: true
          schema: { type: string }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Matching invoices and whole-range totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesInvoicePageResponse'
  /invoices/reports/sales-series:
    get:
      operationId: getInvoiceSalesSeries
      tags: [invoices]
      summary: Sales totals bucketed by day, week, or month
      description: |
        Uses finalized, non-void, non-deleted invoices dated by issuedAt,
        falling back to createdAt. Gross is the charge total before header
        and line-item discounts; credits and percentage pricing overrides
        are excluded from the gross/discount/net figures.
      parameters:
        - $ref: '#/components/parameters/StatsOrganizationId'
        - $ref: '#/components/parameters/StatsDateFrom'
        - $ref: '#/components/parameters/StatsDateTo'
        - $ref: '#/components/parameters/StatsTimeZone'
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [day, week, month]
            default: month
      responses:
        "200":
          description: Sales series and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSalesSeriesResult"
        "403": { description: Insufficient role }
  /invoices/reports/discounts:
    get:
      operationId: getInvoiceDiscountsReport
      tags: [invoices]
      summary: Invoice discounts by period, item, and practice
      description: |
        Sums positive invoice-level discounts and the absolute value of
        explicitly flagged discount line totals. Excludes credits, payment
        ledger credits, and percentage pricing overrides. Only finalized,
        non-void, non-deleted invoices are included, dated by issuedAt or
        createdAt. Counts in the period and practice series are invoices
        with at least one discount; item counts are discount rows.
      parameters:
        - $ref: '#/components/parameters/StatsOrganizationId'
        - $ref: '#/components/parameters/StatsDateFrom'
        - $ref: '#/components/parameters/StatsDateTo'
        - $ref: '#/components/parameters/StatsTimeZone'
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [day, week, month]
            default: month
      responses:
        "200":
          description: Discount totals and breakdowns (empty arrays when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDiscountReportResult"
        "403": { description: Insufficient role }
  /analytics/saved-card-setup:
    post:
      operationId: recordSavedCardSetupOutcome
      tags: [analytics]
      summary: Record a fixed saved-card setup outcome
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [started, succeeded, expired]
      responses:
        "204":
          description: Outcome accepted (or safely ignored)
        "400":
          description: Invalid outcome
  /labtrax/scans:
    post:
      operationId: createScanJob
      tags: [scans]
      summary: Create or resume an idempotent 3D scan job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanJobInput"
      responses:
        "201":
          description: Scan job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobResult"
        "200":
          description: Existing idempotent scan job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobResult"
        "400": { description: Invalid scan manifest or destination, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "403": { description: Active lab membership required, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "409": { description: Scan job could not be created, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}:
    get:
      operationId: getScanJob
      tags: [scans]
      summary: Get scan job status and completed outputs
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current scan job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobResult"
        "404": { description: Scan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}/inputs:
    post:
      operationId: createScanInput
      tags: [scans]
      summary: Register a resumable scan capture input
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInputRegistration"
      responses:
        "201":
          description: Capture input registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInputResult"
        "200":
          description: Existing matching capture input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInputResult"
        "400": { description: Invalid input metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "404": { description: Scan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "409": { description: Inputs closed or conflicting metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "413": { description: Capture input limit exceeded, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}/inputs/{inputId}:
    get:
      operationId: getScanInputStatus
      tags: [scans]
      summary: Get the current resumable upload offset
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: inputId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Capture upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInputStatusResult"
        "404": { description: Scan or input not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
    put:
      operationId: uploadScanInputChunk
      tags: [scans]
      summary: Upload one base64-encoded scan capture chunk
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: inputId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInputChunk"
      responses:
        "200":
          description: Chunk accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInputChunkResult"
        "400": { description: Invalid chunk encoding or size, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "404": { description: Scan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "409":
          description: Upload offset conflict, or inputs are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInputOffsetConflict"
        "503": { description: Private object storage unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}/start:
    post:
      operationId: startScanJob
      tags: [scans]
      summary: Queue a fully uploaded scan for reconstruction
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job was already started or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStartResult"
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStartResult"
        "400": { description: Capture input or manifest missing, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "404": { description: Scan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "409": { description: Capture uploads incomplete, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}/save:
    post:
      operationId: saveScanOutput
      tags: [scans]
      summary: Save completed scan outputs to a case or unassigned documents
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanSaveInput"
      responses:
        "200":
          description: Outputs saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSaveResult"
        "400": { description: Invalid or inaccessible destination, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "404": { description: Scan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
        "409": { description: Scan outputs not ready, content: { application/json: { schema: { $ref: "#/components/schemas/ScanError" } } } }
  /labtrax/scans/{id}/outputs/{format}:
    get:
      operationId: getScanOutput
      tags: [scans]
      summary: Download a completed scan output
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: format, required: true, schema: { $ref: "#/components/schemas/ScanOutputFormat" } }
      responses:
        "200":
          description: Generated 3D model
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Scan or output not found }
        "409": { description: Scan output not ready or unsupported format }
  /lab-inbox:
    get:
      operationId: listLabInboxFiles
      tags: [lab-inbox]
      summary: List unassigned inbox files for a lab (lab members only)
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unassigned inbox files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabInboxFileListResult"
        "400":
          description: Missing labOrganizationId
        "403":
          description: Not a lab member
    delete:
      operationId: bulkDeleteLabInboxFiles
      tags: [lab-inbox]
      summary: Bulk delete unassigned inbox files (lab members only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteLabInboxFilesInput"
      responses:
        "200":
          description: Number of files deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteLabInboxFilesResult"
        "400":
          description: Invalid request
        "403":
          description: Not a lab member
  /lab-inbox/upload:
    post:
      operationId: uploadLabInboxFile
      tags: [lab-inbox]
      summary: Upload a file to the lab inbox (lab members only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, labOrganizationId]
              properties:
                file:
                  type: string
                  format: binary
                labOrganizationId:
                  type: string
                note:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        "201":
          description: Uploaded file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabInboxFileResult"
        "400":
          description: Invalid request
        "403":
          description: Not a lab member
  /lab-inbox/finalize-session:
    post:
      operationId: finalizeLabInboxSession
      tags: [lab-inbox]
      summary: Register a chunked-upload session as a lab inbox file (lab members only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeLabInboxSessionInput"
      responses:
        "201":
          description: Registered inbox file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabInboxFileResult"
        "400":
          description: Invalid request
        "403":
          description: Not a lab member
  /lab-inbox/{fileId}:
    patch:
      operationId: updateLabInboxFileNote
      tags: [lab-inbox]
      summary: Update or clear the note on an unassigned inbox file (lab members only)
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabInboxFileNoteUpdate"
      responses:
        "200":
          description: Updated inbox file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabInboxFileResult"
        "400":
          description: Invalid note
        "403":
          description: Not a lab member
        "404":
          description: File not found
        "409":
          description: File has already been assigned
    delete:
      operationId: deleteLabInboxFile
      tags: [lab-inbox]
      summary: Delete a single unassigned inbox file (lab members only)
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "403":
          description: Not a lab member
        "404":
          description: File not found
        "409":
          description: File has already been assigned
  /lab-inbox/{fileId}/assign:
    post:
      operationId: assignLabInboxFile
      tags: [lab-inbox]
      summary: Assign an inbox file to a case (lab members only)
      parameters:
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLabInboxFileInput"
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignLabInboxFileResult"
        "400":
          description: Invalid request
        "403":
          description: Not a lab member
        "404":
          description: File or case not found
        "409":
          description: File already assigned
  /ai-chat/history:
    get:
      operationId: getAiChatHistory
      tags: [ai]
      summary: Fetch recent AI chat history for the authenticated user
      parameters:
        - in: query
          name: limit
          description: Max messages to return in this page (clamped server-side).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: before
          description: >-
            Cursor for "load earlier": the id of the oldest message the client
            already holds. Returns only messages older than this row.
          schema: { type: string }
      responses:
        "200":
          description: Chat history messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatHistoryResult"
        "401":
          description: Not authenticated
    delete:
      operationId: deleteAiChatHistory
      tags: [ai]
      summary: Clear all AI chat history for the authenticated user
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Not authenticated
  /locations:
    get:
      operationId: getLocations
      tags: [locations]
      summary: List lab locations for an org (seeds built-in stations on first call)
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string }
        - in: query
          name: activeOnly
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabLocationListResult"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a lab location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabLocationResult"
  /vocabulary:
    get:
      operationId: getVocabulary
      tags: [vocabulary]
      summary: List vocabulary items for a lab org (defaults + custom), or fetch the global case taxonomy
      description: |
        When `kind` is `case_taxonomy`, returns the static 3-level case taxonomy
        tree (caseType → subtype → materialSubtype). No `labOrganizationId` is
        required for this kind. Use the returned `key` as the `restorationSubtype`
        column value when creating or updating restorations.

        For all other kinds (`material`, `shade`, `restoration_type`),
        `labOrganizationId` is required and the response is a list of lab-scoped
        vocabulary items (defaults + custom).
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [material, shade, restoration_type, case_taxonomy]
        - in: query
          name: labOrganizationId
          required: false
          description: Required for material/shade/restoration_type kinds. Not used for case_taxonomy.
          schema: { type: string }
      responses:
        "200":
          description: |
            OK. When `kind=case_taxonomy` the `data` field is a `TaxonomyTree` object
            (3-level hierarchy). For all other kinds `data` is an array of `VocabularyItem`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VocabularyListResult"
                  - $ref: "#/components/schemas/VocabularyTaxonomyResult"
    post:
      operationId: createVocabularyItem
      tags: [vocabulary]
      summary: Add a custom vocabulary item (deduped case-insensitively)
