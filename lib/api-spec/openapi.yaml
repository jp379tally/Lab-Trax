    StatsCaseCategory:
      type: string
      enum: [implants, zirconia, crown_bridge, removable, other, uncategorized]
      description: Analytics case category (uncategorized = legacy/unclassifiable).
    StatsSalesForecastPreviousPeriod:
      type: object
      required:
        [
          periodStart,
          comparableSales,
          comparableBusinessDays,
          averagePerBusinessDay,
        ]
      description: |
        The prior comparable period used for the pace-trend indicator: the same
        number of elapsed business days into the immediately-preceding
        week/month/year as have elapsed in the current period.
      properties:
        periodStart:
          type: string
          format: date-time
          description: UTC instant of the prior period's local-midnight start.
        comparableSales:
          type: string
          description: |
            Sum of non-void, non-deleted invoices.total over the prior period's
            comparable elapsed business-day window (decimal string).
        comparableBusinessDays:
          type: integer
          description: |
            Mon–Fri days in the prior comparable window (equals the current
            elapsedBusinessDays, unless the prior period was shorter and the
            window was capped to its end).
        averagePerBusinessDay:
          type: string
          description: comparableSales / comparableBusinessDays (decimal string; 0 when none).
    StatsSalesForecastPeriod:
      type: object
      required:
        [
          periodStart,
          periodToDateSales,
          elapsedBusinessDays,
          totalBusinessDays,
          averagePerBusinessDay,
          forecast,
          insufficientData,
          paceChangePct,
          previousPeriod,
        ]
      properties:
        periodStart:
          type: string
          format: date-time
          description: UTC instant of the period's local-midnight start.
        periodToDateSales:
          type: string
          description: |
            Sum of non-void, non-deleted invoices.total from period start
            through now (decimal string). Legacy mobile blob invoices excluded.
        elapsedBusinessDays:
          type: integer
          description: Mon–Fri days from period start through today (inclusive).
        totalBusinessDays:
          type: integer
          description: Total Mon–Fri days in the whole period.
        averagePerBusinessDay:
          type: string
          description: periodToDateSales / elapsedBusinessDays (decimal string; 0 when no elapsed day).
        forecast:
          type: string
          description: Projected period total = averagePerBusinessDay * totalBusinessDays (decimal string).
        insufficientData:
          type: boolean
          description: |
            True when the forecast is not meaningful yet — no elapsed business
            day (e.g. a period starting on a weekend) or no sales recorded so
            far. Forecast is $0.00 in that case.
        paceChangePct:
          type: number
          nullable: true
          description: |
            Percent change of the current per-business-day pace vs the prior
            comparable period's pace (one decimal place; positive = accelerating).
            Null when there is nothing to compare — the current period has
            insufficient data, or the prior comparable window recorded no sales.
        previousPeriod:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StatsSalesForecastPreviousPeriod"
          description: |
            The prior comparable period the pace trend is measured against.
            Null when the current period has insufficient data.
    StatsSalesForecastResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [organizationId, timeZone, asOf, week, month, year]
          properties:
            organizationId: { type: string }
            timeZone: { type: string }
            asOf:
              type: string
              format: date-time
              description: The instant the forecast was computed.
            week:
              $ref: "#/components/schemas/StatsSalesForecastPeriod"
            month:
              $ref: "#/components/schemas/StatsSalesForecastPeriod"
            year:
              $ref: "#/components/schemas/StatsSalesForecastPeriod"
    StatsSummaryResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required:
            [
              from,
              to,
              timeZone,
              totalCases,
              legacyCases,
              totalRevenue,
              invoiceCount,
              averageCaseValue,
              previousPeriod,
            ]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            timeZone: { type: string }
            category:
              allOf: [{ $ref: "#/components/schemas/StatsCaseCategory" }]
              nullable: true
            material: { type: string, nullable: true }
            totalCases: { type: integer }
            legacyCases:
              type: integer
              description: How many of totalCases are legacy `lab_cases`.
            totalRevenue:
              type: string
              description: Sum of non-void invoices.total in the window (decimal string).
            invoiceCount: { type: integer }
            salesCutoffDate:
              type: string
              description: |
                The last completed Monday–Friday business day (YYYY-MM-DD,
                local timezone) that averageDailyRevenue is based on. Capped
                to the period end when querying a past window.
            elapsedBusinessDays:
              type: integer
              description: |
                Mon–Fri days from the period start through salesCutoffDate
                (inclusive). Used as the denominator for averageDailyRevenue.
                Always at least 1.
            totalBusinessDays:
              type: integer
              description: |
                Total Mon–Fri days in the full requested period (from → to).
                Useful for projecting the period total from averageDailyRevenue.
            averageDailyRevenue:
              type: string
              description: |
                Revenue from period start through salesCutoffDate, divided by
                elapsedBusinessDays (completed Mon–Fri business days only).
                Decimal string, "0.00" when no invoices.
            excludedDays:
              type: object
              description: |
                Days excluded from the averageDailyRevenue denominator — US
                federal holidays and lab-specific custom closed days that fall
                on Mon–Fri within the elapsed period (periodStart through
                salesCutoffDate inclusive).
              required: [holidayCount, customClosedCount, dates]
              properties:
                holidayCount:
                  type: integer
                  description: Number of US federal holidays excluded.
                customClosedCount:
                  type: integer
                  description: Number of lab-specific custom closed days excluded.
                dates:
                  type: array
                  description: Individual excluded Mon–Fri dates with their reason.
                  items:
                    type: object
                    required: [date, reason]
                    properties:
                      date:
                        type: string
                        description: "YYYY-MM-DD (local timezone)."
                      reason:
                        type: string
                        enum: [holiday, custom]
                        description: |
                          "holiday" = US federal holiday;
                          "custom" = lab-specific closed day set by an admin.
            averageCaseValue:
              type: string
              description: |
                totalRevenue / distinct cases billed in the window (each
                caseless manual invoice counts as one case). Decimal
                string, "0.00" when no invoices.
            topCategory:
              allOf: [{ $ref: "#/components/schemas/StatsCaseCategory" }]
              nullable: true
            topCategoryLabel: { type: string, nullable: true }
            topCategoryCount: { type: integer }
            busiestWeekday:
              type: integer
              nullable: true
              description: 0 = Monday … 6 = Sunday; null when no cases.
            busiestWeekdayLabel: { type: string, nullable: true }
            avgTurnaroundDays:
              type: number
              nullable: true
              description: |
                Average number of days from received_at (fallback created_at)
                to the earliest status_changed case event with toStatus
                shipped or delivered (fallback updated_at for migrated cases
                lacking full event history) for shipped/delivered cases in
                the window. Null when no eligible cases exist, or when the
                caller is not an admin or owner.
            eligibleTurnaroundCaseCount:
              type: integer
              nullable: true
              description: |
                Number of shipped/delivered canonical cases that contributed to
                avgTurnaroundDays. Null when avgTurnaroundDays is null.
                Useful as a weight when aggregating avgTurnaroundDays across
                multiple organizations.
            previousPeriod:
              type: object
              required: [from, to, totalCases, totalRevenue, invoiceCount]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                totalCases: { type: integer }
                totalRevenue: { type: string }
                invoiceCount: { type: integer }
                averageCaseValue: { type: string }
                casesChangePct:
                  type: number
                  nullable: true
                  description: Percent change vs previous period (null when previous is 0).
                revenueChangePct: { type: number, nullable: true }
    StatsCaseCategoriesResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
