      properties:
        id: { type: string }
        caseNumber: { type: string }
        labOrganizationId: { type: string, nullable: true }
        providerOrganizationId: { type: string, nullable: true }
        patientFirstName: { type: string, nullable: true }
        patientLastName: { type: string, nullable: true }
        doctorName: { type: string, nullable: true }
        doctorPreferences:
          type: string
          nullable: true
          description: Lab-authored free-text preferences from doctor_profiles.
        providerDoctorPreferences:
          allOf:
            - $ref: "#/components/schemas/DoctorPreferences"
          nullable: true
          description: Current structured preferences from an active provider user in providerOrganizationId.
        printProviderPreferencesOnLabSlips:
          type: boolean
          description: Lab setting controlling whether providerDoctorPreferences print on lab slips.
        status: { type: string }
        priority: { type: string, nullable: true }
        dueDate: { type: string, nullable: true }
        dueTime:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Optional literal wall-clock time of day for the due date, in HH:MM format.
        receivedAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: |
            Calendar date when the case was received by the lab. Canonical and
            projected legacy/mobile cases both expose YYYY-MM-DD.
        scanDate: { type: string, format: date, nullable: true }
        prescriptionDueDate: { type: string, format: date, nullable: true }
        providerContactSnapshot:
          type: object
          nullable: true
          additionalProperties: true
        externalPatientId: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
        restorationCount: { type: number, nullable: true }
        hasBarcodeConflict:
          type: boolean
          description: True when this active case shares its barcode with another active case.
        restorationTypes: { type: string, nullable: true }
        restorationMaterials: { type: string, nullable: true }
        firstRestorationSubtype:
          type: string
          nullable: true
          description: Encoded subtype of the first billable restoration, when available.
        teeth: { type: string, nullable: true }
        step:
          type: string
          nullable: true
          description: Current removable workflow step, when applicable.
        totalPrice: { type: string, nullable: true }
        casePanBarcode: { type: string, nullable: true }
        remakeOfCaseId: { type: string, nullable: true }
        remakeReason: { type: string, nullable: true }
        remakeCharged: { type: boolean, nullable: true }
        remakeReasonKey: { type: string, nullable: true }
        remakeShadeLightness: { type: string, nullable: true }
        remakeShadePrescribed: { type: string, nullable: true }
        remakeShadeProvided: { type: string, nullable: true }
        remakeMaterialPrescribed: { type: string, nullable: true }
        remakeMaterialProvided: { type: string, nullable: true }
        remakeReturnedToLab: { type: boolean, nullable: true }
        remakeCategory: { type: string, nullable: true }
        remakeNotes: { type: string, nullable: true }
        needsAiReview: { type: boolean, nullable: true }
        aiImportSource: { type: string, nullable: true }
        shade: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        patientDob: { type: string, nullable: true }
        trackingNumber: { type: string, nullable: true }
        expectedDeliveryDate: { type: string, nullable: true }
        createdByUserId: { type: string, nullable: true }
        suggestedProviderOrgId: { type: string, nullable: true }
        suggestedPracticeName: { type: string, nullable: true }
        suggestedDoctorName: { type: string, nullable: true }
        rxNoteEntries:
          type: array
          description: Prescription scan notes for this case and its authorized remake ancestors, oldest first.
          items:
            $ref: "#/components/schemas/RxNoteEntry"
        unrecognizedMaterials:
          type: array
          items: { type: string }
          nullable: true
          description: |
            Distinct restoration material names on this case that could not
            be mapped to a standard price key, so they silently resolve to a
            $0 line on the auto-draft invoice. The "needs AI review" banner
            surfaces these (desktop + mobile) so a lab admin can fix pricing
            before billing. Only populated on the case-detail response.
        photos:
          type: array
          items: { type: string }
          nullable: true
        videos:
          type: array
          items: { type: string }
          nullable: true
        activityLog:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalActivityEntry"
          nullable: true
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalAttachment"
          nullable: true
        restorations:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalRestoration"
          nullable: true
        remakeOriginal:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CanonicalRemakeRef"
        remakeChildren:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalRemakeRef"
          nullable: true
        _source: { type: string }
        viewerCanUploadAttachments:
          type: boolean
          nullable: true
          description: >
            Whether the requesting user is permitted to upload new attachments.
            True for any active member of the case's lab.
        viewerCanPostNotes:
          type: boolean
          nullable: true
          description: >
            Whether the requesting user may add a case note. This can be true
            for a linked provider even when attachment uploads are not allowed.
        viewerQuickReferenceOrganizationId:
          type: string
          nullable: true
          description: >
            Organization whose quick-reference note library applies to this
            viewer: the lab for lab members, or the provider organization for
            provider members.
        viewerCanManageAttachments:
          type: boolean
          nullable: true
          description: >
            Whether the requesting user can delete or toggle visibility of existing
            attachments on this case. Restricted to lab admins and owners.
      additionalProperties: true
    CaseListResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalCase"
    CasesWorklistPage:
      type: object
      required: [rows, total, page, pageSize, hasMore]
      properties:
        rows:
          type: array
