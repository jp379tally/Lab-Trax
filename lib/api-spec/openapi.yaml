  /admin/provider-subscriptions/{id}/waiver:
    put:
      operationId: upsertAdminProviderSubscriptionWaiver
      tags: [billing]
      summary: Grant, edit, or replace a provider subscription waiver; a reason is required
      parameters: [{ $ref: "#/components/parameters/ProviderSubscriptionId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProviderSubscriptionWaiverInput" } } }
      responses:
        "200":
          description: Waiver granted or replaced
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProviderSubscriptionResult" } } }
        "400": { description: Reason or dates invalid }
    delete:
      operationId: endAdminProviderSubscriptionWaiver
      tags: [billing]
      summary: End the current provider subscription waiver
      parameters: [{ $ref: "#/components/parameters/ProviderSubscriptionId" }]
      responses:
        "200":
          description: Waiver ended
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProviderSubscriptionResult" } } }
        "409": { description: No active waiver }
  /admin/provider-subscriptions/{id}/history:
    get:
      operationId: getAdminProviderSubscriptionHistory
      tags: [billing]
      summary: Return append-only subscription events and actor audit records
      parameters: [{ $ref: "#/components/parameters/ProviderSubscriptionId" }]
      responses:
        "200":
          description: Subscription history
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProviderSubscriptionHistoryResult" } } }
        "404": { description: Subscription not found }
  /provider/autopay-authorization/prepare:
    get:
      operationId: prepareProviderAutopayAuthorization
      tags: [billing]
      summary: Get the immutable provider auto-pay agreement terms
      parameters:
        - { in: query, name: providerOrganizationId, required: false, schema: { type: string } }
      responses:
        "200": { description: Agreement terms, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAutopayPrepareResponse" } } } }
  /provider/autopay-authorization:
    post:
      operationId: signProviderAutopayAuthorization
      tags: [billing]
      summary: Sign a provider auto-pay authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerOrganizationId, agreementVersion, agreementSha256, typedLegalName, consent, signatureData]
              properties:
                subscriptionFees: { type: boolean }
                labBills: { type: boolean }
                providerOrganizationId: { type: string }
                agreementVersion: { type: string }
                agreementSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                labOrganizationIds: { type: array, items: { type: string } }
                labChargeDay: { type: integer, minimum: 1, maximum: 10 }
                typedLegalName: { type: string }
                consent: { type: boolean, enum: [true] }
                signatureData: { type: string, description: Private drawn-signature data URL }
      responses:
        "201": { description: Signed authorization, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAutopayAuthorizationResponse" } } } }
        "400": { description: Invalid terms or consent }
        "403": { description: Relationship unavailable }
  /provider/autopay-authorization/requests:
    get:
      operationId: listProviderAutopayAuthorizationRequests
      tags: [billing]
      summary: List provider authorization requests
      parameters:
        - { in: query, name: providerOrganizationId, required: false, schema: { type: string } }
        - { in: query, name: labOrganizationId, required: false, schema: { type: string } }
      responses:
        "200": { description: Authorization request status records, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProviderAutopayAuthorizationRequestStatus" } } } } }
        "400": { description: A provider or lab organization is required }
    post:
      operationId: createProviderAutopayAuthorizationRequest
      tags: [billing]
      summary: Prepare and optionally email a provider authorization request from a lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerOrganizationId, labOrganizationId]
              properties:
                providerOrganizationId: { type: string }
                labOrganizationId: { type: string }
                subscriptionFees: { type: boolean }
                labBills: { type: boolean }
                labOrganizationIds: { type: array, items: { type: string } }
                labChargeDay: { type: integer, minimum: 1, maximum: 10 }
                recipientEmail: { type: string, format: email }
                deliveryMode: { type: string, enum: [email, in_person] }
                presentInPerson: { type: boolean, description: Legacy alias for deliveryMode=in_person }
      responses:
        "201": { description: Prepared request }
        "403": { description: Lab billing relationship unavailable }
  /provider/autopay-authorization/requests/{id}:
    get:
      operationId: getProviderAutopayAuthorizationRequest
      tags: [billing]
      summary: Read a provider authorization request
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Authorization request, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAutopayAuthorizationRequestDetail" } } } }
        "404": { description: Request not found }
  /provider/autopay-authorization/requests/{id}/cancel:
    post:
      operationId: cancelProviderAutopayAuthorizationRequest
      tags: [billing]
      summary: Cancel an uncompleted provider authorization request
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: Request cancelled }
  /provider/autopay-authorization/current:
    get:
      operationId: getCurrentProviderAutopayAuthorization
      tags: [billing]
      summary: Get the current provider auto-pay authorization
      parameters:
        - { in: query, name: providerOrganizationId, required: false, schema: { type: string } }
      responses:
        "200": { description: Current authorization, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAutopayAuthorizationResponse" } } } }
        "404": { description: No current authorization }
  /provider/autopay-authorization/history:
    get:
      operationId: listProviderAutopayAuthorizationHistory
      tags: [billing]
      summary: List immutable provider auto-pay authorizations
      parameters:
        - { in: query, name: providerOrganizationId, required: false, schema: { type: string } }
      responses:
        "200": { description: Authorization history, content: { application/json: { schema: { type: object, required: [ok, data], properties: { ok: { type: boolean }, data: { type: array, items: { $ref: "#/components/schemas/ProviderAutopayAuthorization" } } } } } } }
  /provider/autopay-authorization/{id}/download:
    get:
      operationId: downloadProviderAutopayAuthorization
      tags: [billing]
      summary: Download a private signed authorization document
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: PDF authorization document, content: { application/pdf: { schema: { type: string, format: binary } } } }
  /provider/autopay-authorization/{id}/signature:
    get:
      operationId: getProviderAutopaySignature
      tags: [billing]
      summary: Download a private drawn signature artifact
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Signature artifact, content: { image/png: { schema: { type: string, format: binary } } } }
  /provider/lab-autopay-authorization/history:
    get:
      operationId: listLabAutopayAuthorizationHistory
      tags: [billing]
      summary: List signed authorizations for one lab/provider relationship
      parameters:
        - { in: query, name: labOrganizationId, required: true, schema: { type: string } }
        - { in: query, name: providerOrganizationId, required: true, schema: { type: string } }
      responses:
        "200": { description: Authorization history }
  /provider/lab-autopay-authorization/{id}/download:
    get:
      operationId: downloadLabAutopayAuthorization
      tags: [billing]
      summary: Download a signed authorization visible to a related lab
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: labOrganizationId, required: true, schema: { type: string } }
      responses:
        "200": { description: PDF authorization document, content: { application/pdf: { schema: { type: string, format: binary } } } }

components:
  parameters:
    PagingLimit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
      description: Opt into paging and return at most this many rows (default 100).
    PagingOffset:
      in: query
      name: offset
      required: false
      schema: { type: integer, minimum: 0 }
      description: Opt into paging and skip this many rows (default 0).
    ProviderSubscriptionId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Subscription id.
    StatsOrganizationId:
      in: query
      name: organizationId
      required: true
      schema: { type: string }
      description: Lab organization id (caller must hold owner/admin/billing role).
    StatsDateFrom:
      in: query
      name: dateFrom
      required: true
      schema: { type: string }
      description: Window start (ISO date or datetime, inclusive).
    StatsDateTo:
      in: query
      name: dateTo
      required: true
      schema: { type: string }
      description: Window end (ISO date or datetime, inclusive).
    StatsTimeZone:
      in: query
      name: timeZone
      required: false
      schema: { type: string }
      description: IANA timezone for bucketing/weekday attribution (default UTC).
    StatsCategory:
      in: query
      name: category
      required: false
      schema:
        $ref: "#/components/schemas/StatsCaseCategory"
      description: Restrict results to one analytics category.
    StatsMaterial:
      in: query
      name: material
      required: false
      schema: { type: string }
      description: |
        Restrict results to cases with at least one restoration of this
        normalized material name (as returned by the case-categories
        materials breakdown; "Unspecified" matches restorations without a
        material). Legacy cases match on their blob material string.
  schemas:
    VerifyAdminPinInput:
      type: object
      required: [pin]
      properties:
        pin: { type: string, minLength: 4, maxLength: 4, pattern: "^\\d{4}$" }
    VerifyAdminPinResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    ToothChartCommitInput:
      type: object
      required: [creates, updates, deletes, bridgeConnectors]
      properties:
        creates:
          type: array
          maxItems: 52
          items:
            type: object
            required: [localId, toothNumber, restorationType]
            properties:
              localId: { type: string, format: uuid }
              toothNumber: { type: string }
              restorationType: { type: string }
              material: { type: [string, "null"] }
              restorationSubtype: { type: [string, "null"] }
              shade: { type: [string, "null"] }
              quantity: { type: integer, minimum: 1, maximum: 128 }
              arch: { type: [string, "null"] }
              unitPrice: { type: number, minimum: 0 }
              implantRetention: { type: [string, "null"] }
              implantManufacturer: { type: [string, "null"] }
              implantPlatformNotes: { type: [string, "null"], maxLength: 10000 }
        updates:
          type: array
          maxItems: 52
          items:
            type: object
            required: [restorationId, toothNumber]
            properties:
              restorationId: { type: string }
              toothNumber: { type: string }
              restorationType:
                type: string
                enum: [Crown, Coping, Overlay, Pontic, Diagnostic, Inlay/Onlay, Offset inlay, Veneer, Denture, Partial denture, Bite splint, Primary telescopic crown, Secondary telescopic crown, Attachment]
              arch: { type: [string, "null"], enum: [upper, lower, null] }
              material: { type: string }
              restorationSubtype: { type: string }
              shade: { type: string }
        deletes:
          type: array
          maxItems: 104
          items: { type: string }
        bridgeConnectors: { type: [string, "null"] }
        caseDetails:
          type: object
          description: Clinical form fields saved in the same transaction as chart and invoice. Doctor/practice reassignment uses its existing dedicated workflow.
          additionalProperties: true
        hierarchy:
          type: object
          description: Existing validated whole-case clinical reconciliation, applied before explicit staged row operations.
          additionalProperties: true
        implants:
          type: array
          items:
            type: object
            required: [restorationId, values]
            properties:
              restorationId: { type: string }
              values:
                type: object
                additionalProperties: { type: [string, "null"] }
    ToothChartCommitResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [invoiceId, invoiceAction]
          properties:
            invoiceId: { type: [string, "null"] }
            invoiceAction: { type: string, enum: [updated, created, skipped] }
    CreatorAccess:
      type: object
      required: [isCreator, pinConfigured, unlocked, expiresAt]
      properties:
        isCreator: { type: boolean }
        pinConfigured: { type: boolean }
        unlocked: { type: boolean }
        expiresAt: { type: [string, "null"] }
    CreatorPinInput:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: '^[0-9]{7}$' }
    CreatorPinRotation:
      type: object
      required: [currentPin, newPin, confirmPin]
      properties:
        currentPin: { type: string, pattern: '^[0-9]{7}$' }
        newPin: { type: string, pattern: '^[0-9]{7}$' }
        confirmPin: { type: string, pattern: '^[0-9]{7}$' }
    CreatorUnlockResult:
      type: object
      required: [ok, expiresAt]
      properties:
        ok: { type: boolean }
        expiresAt: { type: string }
    CreatorRevenueBucket:
      type: object
      required: [period, collectedMinor, refundsMinor, netMinor]
      properties:
        period: { type: string }
        collectedMinor: { type: integer }
        refundsMinor: { type: integer }
        netMinor: { type: integer }
    CreatorRevenueCurrency:
      type: object
      required: [currency, collectedMinor, refundsMinor, netMinor, buckets]
      properties:
        currency: { type: string }
        collectedMinor: { type: integer }
        refundsMinor: { type: integer }
        netMinor: { type: integer }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/CreatorRevenueBucket" }
    CreatorRevenueCoverage:
      type: object
      required: [provider, status, detail, updatedAt]
      properties:
        provider: { type: string }
        status: { type: string }
        detail: { type: string }
        updatedAt: { type: [string, "null"] }
    CreatorRevenue:
      type: object
      required: [start, end, timezone, group, currencies, coverage, unavailableAmounts]
      properties:
        start: { type: string }
        end: { type: string }
        timezone: { type: string }
        group: { type: string, enum: [daily, monthly, yearly] }
        currencies:
          type: array
          items: { $ref: "#/components/schemas/CreatorRevenueCurrency" }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/CreatorRevenueCoverage" }
        unavailableAmounts: { type: integer }
    CreatorFeedbackReview:
      type: object
      required: [reviewed]
      properties:
        reviewed: { type: boolean }
    CreatorFeedbackAttachment:
      type: object
      required: [id, filename, contentType, size]
      properties:
        id: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
    CreatorFeedbackItem:
      type: object
      required: [id, reporterUserId, organizationId, portal, description, createdAt, reviewedAt, attachments]
      properties:
        id: { type: string }
        reporterUserId: { type: string }
        organizationId: { type: string }
        portal: { type: string }
        kind: { type: string }
        description: { type: string }
        createdAt: { type: string }
        reviewedAt: { type: [string, "null"] }
        reporter:
          type: object
          properties:
            username: { type: [string, "null"] }
            email: { type: [string, "null"] }
            firstName: { type: [string, "null"] }
            lastName: { type: [string, "null"] }
        organization:
          type: object
          properties:
            name: { type: [string, "null"] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/CreatorFeedbackAttachment" }
    CreatorFeedbackList:
      type: object
      required: [items, total, newCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CreatorFeedbackItem" }
        total: { type: integer }
        newCount: { type: integer }
    CreatorSubscriptionSummary:
      type: object
      required: [totalAccounts, paidSubscribers, trial, free, waived, other, byStatus, byProvider]
      properties:
        totalAccounts: { type: integer }
        paidSubscribers: { type: integer }
        trial: { type: integer }
        free: { type: integer }
        waived: { type: integer }
        other: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        byProvider: { type: object, additionalProperties: { type: integer } }
    RegisterAnalytics:
      type: object
      required: [bankAccountId, dateFrom, dateTo, daily, payees, statuses, totalEntries]
      properties:
        bankAccountId: { type: string }
        dateFrom: { type: string }
        dateTo: { type: string }
        totalEntries: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, payments, deposits]
            properties:
              date: { type: string }
              payments: { type: string }
              deposits: { type: string }
        payees:
          type: array
          items:
            type: object
            required: [payee, payments, deposits, volume]
            properties:
              payee: { type: string }
              payments: { type: string }
              deposits: { type: string }
              volume: { type: string }
        statuses:
          type: object
          required: [postedCleared, postedUncleared, voided, pending]
          properties:
            postedCleared: { type: integer }
            postedUncleared: { type: integer }
            voided: { type: integer }
            pending: { type: integer }
    SalesInvoicePageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SalesInvoicePage'
    SalesInvoiceRow:
      type: object
      required: [id, invoiceNumber, issuedAt, total, status, practiceName, doctorName]
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        issuedAt: { type: string }
        total: { type: string }
        status: { type: string }
        practiceName: { type: string, nullable: true }
        doctorName: { type: string, nullable: true }
    SalesInvoicePage:
      type: object
      required: [rows, offset, total, billedTotal, hasMore]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SalesInvoiceRow'
        offset: { type: integer }
        total: { type: integer }
        billedTotal: { type: string }
        hasMore: { type: boolean }
    InvoiceSalesSeriesResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [from, to, groupBy, timeZone, series, totals]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            groupBy: { type: string, enum: [day, week, month] }
            timeZone: { type: string }
            series:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceSalesSeriesPoint"
            totals:
              $ref: "#/components/schemas/InvoiceSalesSeriesTotals"
    InvoiceSalesSeriesPoint:
      type: object
      required: [periodStart, gross, discounts, net, tax, billedTotal, count, avg]
      properties:
        periodStart: { type: string, format: date-time }
        gross: { type: string }
        discounts: { type: string }
        net: { type: string }
        tax: { type: string }
        billedTotal: { type: string }
        count: { type: integer }
        avg: { type: string }
    InvoiceSalesSeriesTotals:
      type: object
      required: [gross, discounts, net, tax, billedTotal, count, avg]
      properties:
        gross: { type: string }
        discounts: { type: string }
        net: { type: string }
        tax: { type: string }
        billedTotal: { type: string }
        count: { type: integer }
        avg: { type: string }
    InvoiceDiscountReportResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [from, to, groupBy, timeZone, series, items, practices, totals]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            groupBy: { type: string, enum: [day, week, month] }
            timeZone: { type: string }
            series:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceDiscountPeriod"
            items:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceDiscountItemBreakdown"
            practices:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceDiscountPracticeBreakdown"
            totals:
              $ref: "#/components/schemas/InvoiceDiscountTotals"
    InvoiceDiscountPeriod:
      type: object
      required: [periodStart, amount, count]
      properties:
        periodStart: { type: string, format: date-time }
        amount: { type: string }
        count: { type: integer }
    InvoiceDiscountItemBreakdown:
      type: object
      required: [item, amount, count]
      properties:
        item:
          type: string
          description: Invoice-level discount or the discount line description.
        amount: { type: string }
        count: { type: integer }
    InvoiceDiscountPracticeBreakdown:
      type: object
      required: [practiceId, practiceName, doctorName, amount, count]
      properties:
        practiceId: { type: ["string", "null"] }
        practiceName: { type: ["string", "null"] }
        doctorName: { type: ["string", "null"] }
        amount: { type: string }
        count: { type: integer }
    InvoiceDiscountTotals:
      type: object
      required: [amount, count]
      properties:
        amount: { type: string }
        count: { type: integer }
    ScanOutputFormat:
      type: string
      enum: [ply, stl]
    ScanManifest:
      type: object
      required: [version, captureMethod]
      additionalProperties: true
      properties:
        version: { type: integer, enum: [1] }
        captureMethod: { type: string, enum: [camera, depth] }
        device: { type: string }
        scaleMmPerUnit: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        calibration: { type: object, additionalProperties: true }
        objectCondition:
          type: string
          enum: [simple-matte, dental-complex, reflective-or-translucent]
          description: User-verified material condition used to select an exact measured accuracy profile.
        points:
          type: array
          maxItems: 500000
          items:
            $ref: "#/components/schemas/ScanPoint"
        frames:
          type: array
          minItems: 3
          maxItems: 128
          items:
            $ref: "#/components/schemas/ScanFrame"
    ScanPoint:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
    ScanFrame:
      type: object
      required: [angleDeg]
      additionalProperties: true
      properties:
        angleDeg: { type: number, minimum: -360, maximum: 360 }
        pose: { type: object, additionalProperties: true }
        width: { type: number }
        height: { type: number }
    ScanJobInput:
      type: object
      required: [labOrganizationId, manifest]
      properties:
        labOrganizationId: { type: string, minLength: 1 }
        manifest: { $ref: "#/components/schemas/ScanManifest" }
        captureMethod: { type: string, enum: [camera, depth] }
        device: { type: string }
        caseId: { type: ["string", "null"], minLength: 1 }
        legacyCaseId: { type: ["string", "null"], minLength: 1 }
        idempotencyKey: { type: string, maxLength: 128 }
    ScanOutput:
      type: object
      required: [id, format, mimeType, byteSize, metadata]
      properties:
        id: { type: string }
        format: { $ref: "#/components/schemas/ScanOutputFormat" }
        mimeType: { type: string }
        byteSize: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
    ScanJob:
      type: object
      required: [id, labOrganizationId, createdByUserId, status, captureMethod, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        createdByUserId: { type: string }
        idempotencyKey: { type: ["string", "null"] }
        status: { type: string, enum: [draft, queued, processing, retry, completed, failed] }
        captureMethod: { type: string, enum: [camera, depth] }
        device: { type: ["string", "null"] }
        manifestJson: { $ref: "#/components/schemas/ScanManifest" }
        qualityJson: { type: ["object", "null"], additionalProperties: true }
        errorCode:
          type: ["string", "null"]
          description: Internal classification for client state mapping. Do not display this value to users.
        errorMessage:
          type: ["string", "null"]
          description: Public-safe explanation of why reconstruction stopped. Does not contain worker, exception, or storage details.
        guidance:
          type: ["string", "null"]
          description: Public-safe actions the user can take to retry processing or improve a recapture.
        caseId: { type: ["string", "null"] }
        legacyCaseId: { type: ["string", "null"] }
