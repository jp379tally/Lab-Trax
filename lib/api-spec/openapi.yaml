        warnings: { type: string, nullable: true }
        ok: { type: boolean }
        size: { type: integer, description: "Backup archive size in bytes" }
        completedAt: { type: string, format: date-time }
        fileName: { type: string }
    BackupJobStatus:
      type: object
      required: [runId, state, phase]
