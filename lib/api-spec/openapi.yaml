    ProviderAutopayPrepareResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [providerOrganizationId, providerChoices, agreementVersion, agreementSha256, agreementText, labs, labChargeDay]
          properties:
            providerOrganizationId: { type: string, nullable: true }
            providerChoices:
              type: array
              items:
                type: object
                required: [providerOrganizationId, providerName]
                properties:
                  providerOrganizationId: { type: string }
                  providerName: { type: string }
            agreementVersion: { type: string }
            agreementSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            agreementText: { type: string }
            labs:
              type: array
              items:
                type: object
                required: [providerOrganizationId, labOrganizationId, labName, providerName]
                properties:
                  providerOrganizationId: { type: string }
                  labOrganizationId: { type: string }
                  labName: { type: string, nullable: true }
                  providerName: { type: string }
            labChargeDay:
              type: object
              required: [minimum, maximum]
              properties:
                minimum: { type: integer, minimum: 1, maximum: 1 }
                maximum: { type: integer, minimum: 10, maximum: 10 }
    ProviderAutopayAuthorization:
      type: object
      required: [id, providerOrganizationId, agreementVersion, agreementText, status, card]
      properties:
        id: { type: string }
        providerOrganizationId: { type: string }
        agreementVersion: { type: string }
        agreementText: { type: string }
        subscriptionFees: { type: boolean }
        labBills: { type: boolean }
        labChargeDay: { type: integer, nullable: true }
        labOrganizationIds: { type: array, items: { type: string } }
        typedLegalName: { type: string }
        consent: { type: boolean }
        signedAt: { type: string, format: date-time }
        status: { type: string, enum: [active, superseded] }
        card:
          type: object
          required: [brand, last4, expMonth, expYear, status]
          properties:
            brand: { type: string }
            last4: { type: string }
            expMonth: { type: integer }
            expYear: { type: integer }
            status: { type: string, enum: [active, expired] }
    ProviderAutopayAuthorizationRequestStatus:
      type: object
      required: [id, providerOrganizationId, labOrganizationId, status, agreementVersion]
      properties:
        id: { type: string }
        providerOrganizationId: { type: string }
        labOrganizationId: { type: string }
        status: { type: string, enum: [prepared, sent, completed, expired, cancelled] }
        agreementVersion: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        completedAuthorizationId: { type: string, nullable: true }
        labs:
          type: array
          items:
            $ref: "#/components/schemas/ProviderAutopayAuthorizationRequestLab"
    ProviderAutopayAuthorizationRequestLab:
      type: object
      required: [labOrganizationId]
      properties:
        labOrganizationId: { type: string }
        labName: { type: string, nullable: true }
    ProviderAutopayAuthorizationRequestDetail:
      allOf:
        - $ref: "#/components/schemas/ProviderAutopayAuthorizationRequestStatus"
        - type: object
          required: [agreementVersion, agreementText, agreementSha256, labOrganizationIds, labChargeDay, labs]
          properties:
            agreementText: { type: string }
            agreementSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            labOrganizationIds: { type: array, items: { type: string } }
            labChargeDay: { type: integer, nullable: true }
    ProviderAutopayAuthorizationResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { $ref: "#/components/schemas/ProviderAutopayAuthorization" }
    # ───────────────────────── Accounts payable ─────────────────────────
    BillStatus:
      type: string
      enum: [open, partially_paid, paid, void]
      description: Lifecycle of a vendor bill.
    BillStatusFilter:
      type: string
      enum: [open, paid, void, all]
      description: |
        Which bills a list request returns. `open` is anything unvoided with a
        balance; `all` includes paid and void.
    VendorPaymentMethod:
      type: string
      enum: [check, ach, card, cash, other]
      description: |
        How the lab paid the vendor. These record a payment made externally —
        LabTrax does not send money to vendors.
    VendorPaymentStatus:
      type: string
      enum: [posted, void]
    VendorCreditStatus:
      type: string
      enum: [open, applied, void]
    VendorBillLine:
      type: object
      required: [id, categoryId, description, amount, sortOrder]
      properties:
        id: { type: string }
        categoryId: { type: ["string", "null"] }
        description: { type: string }
        amount: { type: string, description: Fixed-2 decimal string. }
        sortOrder: { type: integer }
    VendorBill:
      type: object
      description: |
        A bill as the AP screens see it. `vendorName` and `vendorIsActive` are
        null on responses that do not join the vendor (a void, for example),
        and `lines` is empty on every list response.
      required:
        [
          id,
          labOrganizationId,
          vendorId,
          vendorName,
          vendorIsActive,
          billNumber,
          billDate,
          dueDate,
          termsDays,
          memo,
          total,
          amountPaid,
          amountCredited,
          balanceDue,
          status,
          voidedAt,
          voidReason,
          createdAt,
          updatedAt,
          lines,
        ]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        vendorId: { type: string }
        vendorName: { type: ["string", "null"] }
        vendorIsActive: { type: ["boolean", "null"] }
        billNumber: { type: ["string", "null"] }
        billDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        termsDays:
          type: ["integer", "null"]
          description: Net terms snapshotted from the vendor when the bill was entered.
        memo: { type: ["string", "null"] }
        total: { type: string, description: Fixed-2 decimal string. }
        amountPaid: { type: string, description: Settled by cash payments. }
        amountCredited: { type: string, description: Settled by vendor credits. }
        balanceDue: { type: string, description: Fixed-2 decimal string. }
        status:
          $ref: "#/components/schemas/BillStatus"
        voidedAt: { type: ["string", "null"], format: date-time }
        voidReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/VendorBillLine"
    BillAllocation:
      type: object
      description: One settlement applied to a bill, flattened with its payment.
      required:
        [
          allocationId,
          vendorPaymentId,
          amount,
          appliedAt,
          reversedAt,
          fundedByCredit,
          vendorCreditId,
          paymentDate,
          paymentMethod,
          referenceNumber,
          bankAccountId,
          bankTransactionId,
          status,
        ]
      properties:
        allocationId: { type: string }
        vendorPaymentId: { type: string }
        amount: { type: string, description: Fixed-2 decimal string. }
        appliedAt: { type: string, format: date-time }
        reversedAt: { type: ["string", "null"], format: date-time }
        fundedByCredit:
          type: boolean
          description: True when a vendor credit absorbed this allocation instead of cash.
        vendorCreditId: { type: ["string", "null"] }
        paymentDate: { type: string, format: date-time }
        paymentMethod:
          $ref: "#/components/schemas/VendorPaymentMethod"
        referenceNumber: { type: ["string", "null"] }
        bankAccountId: { type: ["string", "null"] }
        bankTransactionId: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/VendorPaymentStatus"
    BillEvent:
      type: object
      required: [id, eventType, occurredAt, actorUserId, metadata]
      properties:
        id: { type: string }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: ["string", "null"] }
        metadata:
          type: ["object", "null"]
          additionalProperties: true
          description: Event-specific detail; the keys depend on `eventType`.
    VendorBillDetail:
      allOf:
        - $ref: "#/components/schemas/VendorBill"
        - type: object
          required: [payments, events]
          properties:
            payments:
              type: array
              items:
                $ref: "#/components/schemas/BillAllocation"
            events:
              type: array
              description: Up to 100 events, newest first.
              items:
                $ref: "#/components/schemas/BillEvent"
    VendorBillListResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/VendorBill"
    VendorBillResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/VendorBill"
    VendorBillDetailResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/VendorBillDetail"
    BillLineInput:
      type: object
      required: [description, amount]
      properties:
        categoryId: { type: ["string", "null"], minLength: 1 }
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { type: number, minimum: -99999999.99, maximum: 99999999.99 }
    CreateBillInput:
      type: object
      required: [organizationId, vendorId, billDate, lines]
      properties:
        organizationId: { type: string, minLength: 1 }
        vendorId: { type: string, minLength: 1 }
        billNumber:
          type: ["string", "null"]
          maxLength: 100
          description: The vendor's own invoice reference.
        billDate: { type: string, minLength: 1 }
        dueDate:
          type: ["string", "null"]
          minLength: 1
          description: Derived from `termsDays` when omitted.
        termsDays: { type: ["integer", "null"], minimum: 0, maximum: 365 }
        memo: { type: ["string", "null"], maxLength: 2000 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/BillLineInput"
        acknowledgeDuplicateReference:
          type: boolean
          description: |
            Set after the user has seen the duplicate-reference warning and
            chose to save the bill anyway.
    UpdateBillInput:
      type: object
      description: |
        Every field is optional. Supplying `lines` replaces the whole set. The
        vendor and the owning lab cannot be changed.
      properties:
        billNumber: { type: ["string", "null"], maxLength: 100 }
        billDate: { type: string, minLength: 1 }
        dueDate: { type: ["string", "null"], minLength: 1 }
        termsDays: { type: ["integer", "null"], minimum: 0, maximum: 365 }
        memo: { type: ["string", "null"], maxLength: 2000 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/BillLineInput"
        acknowledgeDuplicateReference: { type: boolean }
    VoidReasonInput:
      type: object
      properties:
        reason: { type: ["string", "null"], maxLength: 500 }
    DuplicateBillReference:
      type: object
      required: [id, billNumber, billDate, total]
      properties:
        id: { type: string }
        billNumber: { type: ["string", "null"] }
        billDate: { type: string, format: date-time }
        total: { type: string, description: Fixed-2 decimal string. }
    DuplicateBillReferenceError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean }
        error:
          type: object
          required: [code, message, duplicates]
          properties:
            code: { type: string, enum: [duplicate_bill_reference] }
            message: { type: string }
            duplicates:
              type: array
              items:
                $ref: "#/components/schemas/DuplicateBillReference"
    VendorCredit:
      type: object
      description: |
        `vendorName` is only present on the vendor-credit list, which joins the
        vendor; the credits embedded in AP summaries and Pay Bills omit it.
      required:
        [
          id,
          labOrganizationId,
          vendorId,
          creditNumber,
          creditDate,
          categoryId,
          memo,
          amount,
          amountApplied,
          remainingAmount,
          status,
          voidedAt,
          voidReason,
          createdByUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        creditNumber: { type: ["string", "null"] }
        creditDate: { type: string, format: date-time }
        categoryId: { type: ["string", "null"] }
        memo: { type: ["string", "null"] }
        amount: { type: string, description: Fixed-2 decimal string. }
        amountApplied: { type: string, description: Fixed-2 decimal string. }
        remainingAmount: { type: string, description: Fixed-2 decimal string. }
        status:
          $ref: "#/components/schemas/VendorCreditStatus"
        voidedAt: { type: ["string", "null"], format: date-time }
        voidedByUserId: { type: ["string", "null"] }
        voidReason: { type: ["string", "null"] }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VendorCreditListResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/VendorCredit"
    VendorCreditResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/VendorCredit"
    CreateVendorCreditInput:
      type: object
      required: [organizationId, vendorId, creditDate, amount]
      properties:
        organizationId: { type: string, minLength: 1 }
        vendorId: { type: string, minLength: 1 }
        creditNumber: { type: ["string", "null"], maxLength: 100 }
        creditDate: { type: string, minLength: 1 }
        categoryId: { type: ["string", "null"], minLength: 1 }
        memo: { type: ["string", "null"], maxLength: 2000 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
    VendorPayment:
      type: object
      description: |
        One payment to one vendor. `cashAmount` and `creditAmount` split the
        `totalAmount` between money that left a bank account and vendor credit
        that absorbed the bill.
      required:
        [
          id,
          labOrganizationId,
          vendorId,
          paymentDate,
          paymentMethod,
          referenceNumber,
          memo,
          bankAccountId,
          bankTransactionId,
          cashAmount,
          creditAmount,
          totalAmount,
          status,
          voidedAt,
          voidReason,
          createdByUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        vendorId: { type: string }
        paymentDate: { type: string, format: date-time }
        paymentMethod:
          $ref: "#/components/schemas/VendorPaymentMethod"
        referenceNumber: { type: ["string", "null"] }
        memo: { type: ["string", "null"] }
        bankAccountId: { type: ["string", "null"] }
        bankTransactionId: { type: ["string", "null"] }
        cashAmount: { type: string, description: Fixed-2 decimal string. }
        creditAmount: { type: string, description: Fixed-2 decimal string. }
        totalAmount: { type: string, description: Fixed-2 decimal string. }
        idempotencyKey: { type: ["string", "null"] }
        requestKey: { type: ["string", "null"] }
        requestFingerprint: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/VendorPaymentStatus"
        voidedAt: { type: ["string", "null"], format: date-time }
        voidedByUserId: { type: ["string", "null"] }
        voidReason: { type: ["string", "null"] }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VendorPaymentAllocation:
      type: object
      required: [id, vendorPaymentId, billId, vendorCreditId, amount, appliedAt, reversedAt, createdAt]
      properties:
        id: { type: string }
        vendorPaymentId: { type: string }
        billId: { type: string }
        billNumber: { type: ["string", "null"] }
        vendorCreditId: { type: ["string", "null"] }
        amount: { type: string, description: Fixed-2 decimal string. }
        appliedAt: { type: string, format: date-time }
        reversedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    VendorPaymentWithAllocations:
      allOf:
        - $ref: "#/components/schemas/VendorPayment"
        - type: object
          required: [vendorName, allocations]
          properties:
            vendorName: { type: string }
            allocations:
              type: array
              items:
                $ref: "#/components/schemas/VendorPaymentAllocation"
    VendorPaymentListResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/VendorPaymentWithAllocations"
    VendorPaymentResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/VendorPayment"
    VendorApSummaryVendor:
      type: object
      required: [id, name, isActive, paymentTermsDays]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        paymentTermsDays: { type: ["integer", "null"] }
    VendorApSummary:
      type: object
      required:
        [
          vendor,
          asOf,
          amountDue,
          overdueAmount,
          unappliedCreditAmount,
          openBillCount,
          bills,
          credits,
          payments,
        ]
      properties:
        vendor:
          $ref: "#/components/schemas/VendorApSummaryVendor"
        asOf: { type: string, format: date-time }
        amountDue: { type: string, description: Fixed-2 decimal string. }
        overdueAmount: { type: string, description: Fixed-2 decimal string. }
        unappliedCreditAmount:
          type: string
          description: |
            Reported separately and never netted into the payable — a credit is
            an asset and the payable is a liability.
        openBillCount: { type: integer }
        bills:
          type: array
          description: Each bill carries the amount and balance it had on the as-of date.
          items:
            $ref: "#/components/schemas/VendorBill"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/VendorCredit"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/VendorPayment"
    VendorApSummaryResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/VendorApSummary"
    PayBillsVendor:
      type: object
      required: [vendorId, vendorName, vendorIsActive, bills, credits, totalDue, availableCredit]
      properties:
        vendorId: { type: string }
        vendorName: { type: string }
        vendorIsActive: { type: boolean }
        bills:
          type: array
          items:
            $ref: "#/components/schemas/VendorBill"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/VendorCredit"
        totalDue: { type: string, description: Fixed-2 decimal string. }
        availableCredit: { type: string, description: Fixed-2 decimal string. }
    PayBillsResultData:
      type: object
      required: [vendors]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/PayBillsVendor"
    PayBillsResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/PayBillsResultData"
    BillPaymentCreditApplicationInput:
      type: object
      required: [vendorCreditId, amount]
      properties:
        vendorCreditId: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
    BillPaymentAllocationInput:
      type: object
      required: [billId]
      properties:
        billId: { type: string, minLength: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: Cash applied to this bill. Defaults to 0.
        creditApplications:
          type: array
          maxItems: 50
          description: |
            Listed separately from `amount` so the API can post them without
            any cash movement.
          items:
            $ref: "#/components/schemas/BillPaymentCreditApplicationInput"
    BillPaymentVendorInput:
      type: object
      required: [vendorId, allocations]
      properties:
        vendorId: { type: string, minLength: 1 }
        allocations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/BillPaymentAllocationInput"
    BillPaymentInput:
      type: object
      required: [organizationId, paymentDate, paymentMethod, vendorPayments]
      properties:
        organizationId: { type: string, minLength: 1 }
        paymentDate: { type: string, minLength: 1 }
        paymentMethod:
          $ref: "#/components/schemas/VendorPaymentMethod"
        bankAccountId:
          type: ["string", "null"]
          minLength: 1
          description: Required whenever any allocation moves cash.
        referenceNumber: { type: ["string", "null"], maxLength: 100 }
        memo: { type: ["string", "null"], maxLength: 2000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        vendorPayments:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            One entry per vendor. Selecting several vendors produces several
            payment records, each with its own bank withdrawal, so a
            multi-vendor run is never one indistinguishable payment.
          items:
            $ref: "#/components/schemas/BillPaymentVendorInput"
    BillPaymentResultData:
      type: object
      required: [payments, replayed]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/VendorPayment"
        replayed:
          type: boolean
          description: True when the request matched an already-posted run and nothing new was written.
    BillPaymentResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/BillPaymentResultData"
    AgingBucketKey:
      type: string
      enum: [current, d1_30, d31_60, d61_90, d90_plus]
      description: Days past due. Anything not yet due, including due today, is `current`.
    AgingBuckets:
      type: object
      description: Fixed-2 decimal string per bucket.
      required: [current, d1_30, d31_60, d61_90, d90_plus]
      properties:
        current: { type: string }
        d1_30: { type: string }
        d31_60: { type: string }
        d61_90: { type: string }
        d90_plus: { type: string }
    AgingBucketLabel:
      type: object
      required: [key, label]
      properties:
        key:
          $ref: "#/components/schemas/AgingBucketKey"
        label: { type: string }
    ApAgingBillDetail:
      type: object
      required: [id, billNumber, billDate, dueDate, total, outstanding, bucket]
      properties:
        id: { type: string }
        billNumber: { type: ["string", "null"] }
        billDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        total: { type: string, description: Fixed-2 decimal string. }
        outstanding: { type: string, description: Fixed-2 decimal string. }
        bucket:
          $ref: "#/components/schemas/AgingBucketKey"
    ArAgingInvoiceDetail:
      type: object
      required: [id, invoiceNumber, issuedAt, dueAt, total, outstanding, bucket, approximate]
      properties:
        id: { type: string }
        invoiceNumber: { type: ["string", "null"] }
        issuedAt: { type: ["string", "null"], format: date-time }
        dueAt: { type: ["string", "null"], format: date-time }
        total: { type: string, description: Fixed-2 decimal string. }
        outstanding: { type: string, description: Fixed-2 decimal string. }
        bucket:
          $ref: "#/components/schemas/AgingBucketKey"
        approximate:
          type: boolean
          description: |
            True when the invoice records a settlement whose dated payment row
            no longer exists, so its historical balance is a reconstruction.
    ApAgingRow:
      type: object
      required: [vendorId, vendorName, vendorIsActive, buckets, total, unappliedCredit, bills]
      properties:
        vendorId: { type: string }
        vendorName: { type: string }
        vendorIsActive: { type: boolean }
        buckets:
          $ref: "#/components/schemas/AgingBuckets"
        total: { type: string, description: Fixed-2 decimal string. }
        unappliedCredit: { type: string, description: Fixed-2 decimal string. }
        bills:
          type: array
          description: Empty unless the request asked for `detail`.
          items:
            $ref: "#/components/schemas/ApAgingBillDetail"
    ArAgingRow:
      type: object
      required: [customerId, customerName, buckets, total, unappliedCredit, invoices]
      properties:
        customerId:
          type: string
          description: |
            `unassigned` for legacy invoices with no provider organization —
            they are still receivable, so they are aged under a placeholder
            rather than dropped.
        customerName: { type: string }
        buckets:
          $ref: "#/components/schemas/AgingBuckets"
        total: { type: string, description: Fixed-2 decimal string. }
        unappliedCredit: { type: string, description: Fixed-2 decimal string. }
        invoices:
          type: array
          description: Empty unless the request asked for `detail`.
          items:
            $ref: "#/components/schemas/ArAgingInvoiceDetail"
    AgingLimitation:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        affectedCustomerIds:
          type: array
          items: { type: string }
    CaseSavedViewFilters:
      type: object
      required: [search, statusFilters]
      properties:
        search: { type: string, maxLength: 200 }
        statusFilters:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
        desktop:
          oneOf:
            - $ref: "#/components/schemas/DesktopSavedCaseDateFilters"
            - type: "null"
        mobile:
          oneOf:
            - $ref: "#/components/schemas/MobileSavedCaseDateFilters"
            - type: "null"
    DesktopSavedCaseDateFilters:
      type: object
      required: [dateRangeFilter, customStartDate, customEndDate]
      properties:
        dateRangeFilter:
          type: string
          enum: [all, today, yesterday, "30", "60", "90", custom]
        customStartDate: { type: string, maxLength: 10 }
        customEndDate: { type: string, maxLength: 10 }
    MobileSavedCaseDateFilters:
      type: object
      required:
        - createdFilter
        - createdCustomFrom
        - createdCustomTo
        - dueFilter
        - dueCustomFrom
        - dueCustomTo
      properties:
        createdFilter:
          type: string
          enum: [all, today, yesterday, thisWeek, thisMonth, custom]
        createdCustomFrom: { type: string, maxLength: 10 }
        createdCustomTo: { type: string, maxLength: 10 }
        dueFilter:
          type: string
          enum: [all, today, yesterday, thisWeek, thisMonth, custom]
        dueCustomFrom: { type: string, maxLength: 10 }
        dueCustomTo: { type: string, maxLength: 10 }
    CaseSavedView:
      type: object
      required: [id, labOrganizationId, name, filters, createdAt, updatedAt]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        name: { type: string }
        filters:
          $ref: "#/components/schemas/CaseSavedViewFilters"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseSavedViewCreateInput:
      type: object
      required: [labOrganizationId, name, filters]
      properties:
        labOrganizationId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        filters:
          $ref: "#/components/schemas/CaseSavedViewFilters"
    CaseSavedViewRenameInput:
      type: object
      required: [labOrganizationId]
      properties:
        labOrganizationId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        filters:
          $ref: "#/components/schemas/CaseSavedViewFilters"
    CaseSavedViewListResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/CaseSavedView"
    CaseSavedViewResult:
