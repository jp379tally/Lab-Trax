    CasesWorklistResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CasesWorklistPage"
    CasesOverviewStats:
      type: object
      required: [totalCases, dueToday, conflicts, rushCases, processingCases, inTransitCases, completedCases, overdueCases, receivedCases, inDesignCases, modelRoomCases, shippedCases, scanCases, millingCases, postMillCases, sinteringFurnaceCases, porcelainCases, qualityCheckCases, onHoldCases, remakeCases]
      properties:
        totalCases: { type: integer, minimum: 0 }
        dueToday: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
        rushCases: { type: integer, minimum: 0 }
        processingCases: { type: integer, minimum: 0 }
        inTransitCases: { type: integer, minimum: 0 }
        completedCases: { type: integer, minimum: 0 }
        overdueCases: { type: integer, minimum: 0 }
        receivedCases: { type: integer, minimum: 0 }
        inDesignCases: { type: integer, minimum: 0 }
        modelRoomCases: { type: integer, minimum: 0 }
        shippedCases: { type: integer, minimum: 0 }
        scanCases: { type: integer, minimum: 0 }
        millingCases: { type: integer, minimum: 0 }
        postMillCases: { type: integer, minimum: 0 }
        sinteringFurnaceCases: { type: integer, minimum: 0 }
        porcelainCases: { type: integer, minimum: 0 }
        qualityCheckCases: { type: integer, minimum: 0 }
        onHoldCases: { type: integer, minimum: 0 }
        remakeCases: { type: integer, minimum: 0 }
    NonWorklistCaseListResult:
      type: object
      description: >
        Legacy case arrays remain the default. Supplying limit or offset
        changes data to the paged form.
      properties:
        ok: { type: boolean }
        data:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CanonicalCase"
            - $ref: "#/components/schemas/NonWorklistCasePage"
    NonWorklistCasePage:
      type: object
      required: [rows, total, limit, offset, hasMore]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalCase"
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    CreateCaseInput:
      type: object
      required: [caseNumber, labOrganizationId]
      properties:
        caseNumber:
          type: string
          description: Client-supplied case number (ignored for remakes).
        labOrganizationId:
          type: string
        providerOrganizationId:
          type: string
          nullable: true
        patientFirstName:
          type: string
          nullable: true
        patientLastName:
          type: string
          nullable: true
        doctorName:
          type: string
          nullable: true
        receivedAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date the case was received.
        scanDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Calendar date explicitly recorded for the scan.
        prescriptionDueDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Due date explicitly extracted from the prescription; separate from lab scheduling.
        providerContactSnapshot:
          type: object
          additionalProperties: true
          description: Contact details reviewed for this case, independent of shared practice edits.
        invoiceNotes:
          type: string
          maxLength: 10000
          description: Notes saved on the initial draft invoice.
        status:
          type: string
          nullable: true
        remakeOfCaseId:
          type: string
          nullable: true
          description: ID of the case being remade.
        remakeReasonKey:
          type: string
          nullable: true
          description: >
            Stable key for the structured remake reason (one of the 19 defined
            values). Sent alongside remakeReason (free-text label derived from
            the key). New questionnaire submissions always include this.
        remakeShadeLightness:
          type: string
          nullable: true
          description: '"light" or "dark" — filled when remakeReasonKey is "shade_wrong".'
        remakeShadePrescribed:
          type: string
          nullable: true
        remakeShadeProvided:
          type: string
          nullable: true
        remakeMaterialPrescribed:
          type: string
          nullable: true
        remakeMaterialProvided:
          type: string
          nullable: true
        remakeReturnedToLab:
          type: boolean
          nullable: true
          description: Whether the prosthetic items were returned to the lab.
        remakeCategory:
          type: string
          nullable: true
          description: '"crown_bridge" or "removable" — inferred from remakeReasonKey or selected by user.'
        remakeNotes:
          type: string
          nullable: true
          description: Free-text technician notes entered during the remake questionnaire. Admin/owner only.
        notes:
          type: string
          nullable: true
          description: Authored case note saved to the general case-notes timeline.
        rxNotes:
          type: string
          nullable: true
          description: Prescription notes saved as one dated Rx history entry.
        shade:
          type: string
          nullable: true
        gingivialShade:
          type: string
          nullable: true
          description: >
            Gingival / tissue shade, primarily used for Removable cases
            (e.g. "Light Pink", "Medium Pink"). Omit or send null for
            non-Removable cases.
        dueDate:
          type: string
          format: date-time
          nullable: true
        dueTime:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Optional literal wall-clock time of day for the due date, in HH:MM format.
        rushOrder:
          type: boolean
          nullable: true
        priority:
          type: string
          enum: [normal, rush]
          nullable: true
        restorations:
          type: array
          nullable: true
          description: Inline restoration line items created alongside the case.
          items:
            type: object
            required: [toothNumber, restorationType]
            properties:
              implantRetention: { type: ["string", "null"], enum: ["Screw retained", "Cementable", null] }
              implantManufacturer: { type: ["string", "null"], enum: ["Straumann", "BioHorizons", "Implant Direct", "Other", null] }
              implantPlatformNotes: { type: ["string", "null"], maxLength: 10000 }
              toothNumber:
                type: string
              restorationType:
                type: string
              restorationSubtype:
                type: string
                nullable: true
                description: >
                  Encoded taxonomy key from @workspace/case-taxonomy:
                  "<caseType>/<subtype>" or "<caseType>/<subtype>/<materialSubtype>".
                  Optional — omitted by old clients.
              arch:
                type: string
                nullable: true
                enum: [upper, lower, upper_lower]
              material:
                type: string
                nullable: true
              shade:
                type: string
                nullable: true
              notes:
                type: string
                nullable: true
              quantity:
                type: number
                nullable: true
              unitPrice:
                type: number
                nullable: true
              priceOverridden:
                type: boolean
                description: >
                  When true, `unitPrice` is treated as a user-supplied manual
                  price even when 0 (a deliberate no-charge line), so server
                  auto-pricing does not overwrite it. Omit for default
                  auto-pricing behaviour.
        needsAiReview:
          type: boolean
          nullable: true
        confirmNewDoctor:
          type: boolean
          nullable: true
          description: >
            Bypass the pre-create duplicate-doctor checkpoint. When the typed
            doctorName strongly resembles an existing doctor in the same
            practice, POST /cases returns a 409 (code
            DOCTOR_CONFIRMATION_REQUIRED) listing candidate matches. Re-submit
            with confirmNewDoctor=true once the user confirms they want to add a
            new doctor.
        invoiceOverrideLines:
          type: array
          nullable: true
          description: >
            Admin/owner only. When present and non-empty, these lines are used
            verbatim as the invoice's initial line items in place of the
            auto-pricing engine. Each line must have a non-empty description,
            a positive integer quantity, and a non-negative unit price. The
            server silently ignores this field for non-admin/owner callers.
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
              catalogItemKey:
                type: string
                nullable: true
                description: Stable pricing key for the selected catalog item.
    PreCreateInvoiceItem:
      type: object
      required: [id, name, unitPrice]
      properties:
        id:
          type: string
          description: Stable billable-item identifier.
        priceKey:
          type: string
          nullable: true
          description: Pricing key matched to this billable item, when configured.
        name:
          type: string
        unitPrice:
          type: number
        source:
          type: string
          nullable: true
          enum: [default, tier, override, discount, manual]
        sourceId:
          type: string
          nullable: true
        sourceName:
          type: string
          nullable: true
    PreCreateCatalogItem:
      type: object
      required: [key, label, unitPrice]
      properties:
        key:
          type: string
          description: Stable pricing key for the catalog item.
        label:
          type: string
          description: Lab-configured display label for the pricing key.
        unitPrice:
          type: number
        source:
          type: string
          nullable: true
          enum: [default, tier, override, discount, manual]
        sourceId:
          type: string
          nullable: true
        sourceName:
          type: string
          nullable: true
    PreCreateInvoiceItemsResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PreCreateInvoiceItem"
            catalogItems:
              type: array
              description: >
                Every priced catalog key for the lab, resolved for the same
                practice/doctor context. Lets a pre-create item picker offer
                material-style catalog entries alongside the lab's billable
                items.
              items:
                $ref: "#/components/schemas/PreCreateCatalogItem"
    DoctorMatchCandidate:
      type: object
      required: [doctorName, similarity, totalCases]
      properties:
        doctorName: { type: string }
        providerOrganizationId:
          type: string
          nullable: true
          description: >
            The practice this doctor is actually associated with (the provider
            org they have the most cases under), derived the same way
            GET /cases/doctor-directory derives associations. Null for legacy
            `lab_cases` blob names, which carry no practice.
        practiceName:
          type: string
          nullable: true
          description: >
            Display name of `providerOrganizationId`, so the AI intake can ask
            "Is this <doctor> at <practice>?" without a second lookup.
        practiceAddressLine1: { type: string, nullable: true }
        practiceCity: { type: string, nullable: true }
        practiceState: { type: string, nullable: true }
        similarity: { type: number }
        totalCases: { type: number }
    DoctorSimilarityResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            matches:
              type: array
              items:
                $ref: "#/components/schemas/DoctorMatchCandidate"
    DoctorResolveNameResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [exactMatch, similarMatches, canAddNew]
          properties:
            exactMatch:
              type: string
              nullable: true
              description: >
                Stored canonical doctor spelling when the scanned name strictly
                matches an existing doctor; null otherwise.
            similarMatches:
              type: array
              description: >
                Likely existing doctors to suggest when there is no strict match
                (fuzzy, human-facing suggestions only — never auto-assigned).
              items:
                $ref: "#/components/schemas/DoctorMatchCandidate"
            canAddNew:
              type: boolean
              description: Always true — the user may keep the scanned name as a new doctor.
    AppendCaseRxNoteScanInput:
      type: object
      required: [submissionId, notes]
      properties:
        submissionId: { type: string, minLength: 8, maxLength: 200 }
        notes: { type: string, minLength: 1, maxLength: 10000 }
    RxNoteEntry:
      type: object
      required: [id, caseId, noteText, scannedAt, provenance]
      properties:
        id: { type: string }
        caseId: { type: string }
        noteText: { type: string }
        scannedAt:
          type: string
          format: date-time
          nullable: true
          description: Null means no trustworthy prescription scan date was retained.
        provenance:
          type: string
          enum: [legacy, ai_reader, itero_import, case_intake]
    RxNoteEntryResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/RxNoteEntry"
    CaseDetailResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CanonicalCase"
    CaseNote:
      type: object
      required: [id]
      properties:
        id: { type: string }
        caseId: { type: string, nullable: true }
        authorUserId: { type: string, nullable: true }
        authorOrganizationId: { type: string, nullable: true }
        noteText: { type: string, nullable: true }
        visibility: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
      additionalProperties: true
    CaseLocation:
      type: object
      required: [id]
      properties:
        id: { type: string }
        caseId: { type: string, nullable: true }
        locationCode: { type: string, nullable: true }
        locationName: { type: string, nullable: true }
        movedByUserId: { type: string, nullable: true }
        movedAt: { type: string, nullable: true }
        notes: { type: string, nullable: true }
      additionalProperties: true
    CaseNoteResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CaseNote"
    CaseLocationResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CaseLocation"
    CaseRestorationResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CanonicalRestoration"
    CaseAttachmentResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CanonicalAttachment"
    DeletedResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            deleted: { type: boolean }
    AddCaseNoteInput:
      type: object
      required: [noteText]
      properties:
        noteText: { type: string, minLength: 1 }
        visibility:
          type: string
          enum: [internal_lab_only, shared_with_provider]
          default: internal_lab_only
    AddCaseRestorationInput:
      type: object
      required: [toothNumber, restorationType]
      properties:
        implantRetention: { type: ["string", "null"], enum: ["Screw retained", "Cementable", null] }
        implantManufacturer: { type: ["string", "null"], enum: ["Straumann", "BioHorizons", "Implant Direct", "Other", null] }
        implantPlatformNotes: { type: ["string", "null"], maxLength: 10000 }
        toothNumber:
          type: string
          description: |
            Tooth number (e.g. "14") or empty string for removable appliance
            types (denture, partial, flipper, flexible/Valplast) where tooth
            position is not clinically meaningful. Non-removable restorations
            should always include a non-empty value.
        restorationType: { type: string, minLength: 1 }
        restorationSubtype:
          type: string
          nullable: true
          description: >
            Encoded taxonomy key from @workspace/case-taxonomy:
            "<caseType>/<subtype>" or "<caseType>/<subtype>/<materialSubtype>".
            Optional — omitted by old clients.
        arch:
          type: string
          nullable: true
          enum: [upper, lower, upper_lower]
        material: { type: string }
        shade: { type: string }
        notes: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        unitPrice: { type: number, minimum: 0, default: 0 }
    UpdateCaseRestorationInput:
      type: object
      properties:
        implantRetention: { type: ["string", "null"], enum: ["Screw retained", "Cementable", null] }
        implantManufacturer: { type: ["string", "null"], enum: ["Straumann", "BioHorizons", "Implant Direct", "Other", null] }
        implantPlatformNotes: { type: ["string", "null"], maxLength: 10000 }
        toothNumber: { type: string, minLength: 1 }
        restorationType: { type: string }
        restorationSubtype:
          type: string
          nullable: true
          description: >
            Encoded taxonomy key. Pass null to clear, omit to leave unchanged.
        arch:
          type: string
          nullable: true
          enum: [upper, lower, upper_lower]
        material: { type: string }
        shade: { type: string }
        syncLinkedArch:
          type: boolean
          description: >
            Defaults to true. Set false for a row-scoped edit that must not
            mirror shared fields to a linked upper/lower restoration.
        notes: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    CaseRestorationHierarchyUpdateInput:
      type: object
      required: [restorationType, restorationSubtype, material]
      properties:
        restorationType: { type: string, minLength: 1 }
        restorationSubtype:
          type: ["string", "null"]
          description: Encoded taxonomy key. Pass null to clear.
        material:
          type: ["string", "null"]
          description: Pass null to clear.
        arch:
          type: ["string", "null"]
          enum: [upper, lower, upper_lower, null]
          description: Optional whole-case arch. Omit to preserve existing arches.
        shade:
          type: ["string", "null"]
          description: Optional whole-case shade. Omit to preserve per-row shades.
        toothNumbers:
          type: array
          items: { type: string, maxLength: 32 }
          description: >
            Optional replacement tooth set. Omit for a hierarchy-only update;
            an empty list creates one arch-level line when no rows exist.
        step:
          type: ["string", "null"]
          enum: [custom_tray, rims_and_plates, wax_setup, process, null]
          description: Optional removable workflow step. Null clears it.
        stepShade:
          type: ["string", "null"]
          description: Stored only while step is wax_setup.
    CaseRestorationHierarchyUpdateResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required:
            [updatedCount, createdCount, deletedCount, repricedCount, manualPriceCount, unpricedCount, invoiceAction]
          properties:
            updatedCount: { type: integer, minimum: 0 }
            createdCount: { type: integer, minimum: 0 }
            deletedCount: { type: integer, minimum: 0 }
            repricedCount: { type: integer, minimum: 0 }
            manualPriceCount: { type: integer, minimum: 0 }
            unpricedCount: { type: integer, minimum: 0 }
            invoiceAction:
              type: string
              enum: [updated, created, skipped, needs_review]
            invoiceId:
              type: ["string", "null"]
    CreateCaseAttachmentInput:
      type: object
      required: [storageKey, fileName]
      properties:
        storageKey: { type: string, minLength: 1 }
        fileName: { type: string, minLength: 1 }
        fileType: { type: string, default: application/octet-stream }
        visibility:
          type: string
          enum: [internal_lab_only, shared_with_provider]
          default: internal_lab_only
        note: { type: string, maxLength: 1000 }
        submissionId:
          type: string
          minLength: 8
          maxLength: 200
          description: Optional client identity for safely retrying a multi-page scan upload.
        category:
          type: string
          enum: [outgoing, prescription]
          description: >-
            Optional semantic category. "outgoing" marks a photo of the
            completed case as it left the lab (mobile scan-to-complete flow).
