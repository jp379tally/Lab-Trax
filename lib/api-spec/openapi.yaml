              schema:
                $ref: "#/components/schemas/StatementPaymentContextResult"
        "404": { description: Statement not found within the caller's lab }
  /billing/payment-sessions:
    post:
      operationId: createStatementPaymentSession
      tags: [billing]
      summary: Record one customer payment, statement-led or invoice-led
      description: |
        Atomically records the monetary amount received and/or consumes existing
        customer credit. Credit is applied to its originating open invoice first,
        then oldest eligible account invoices, and never posts to Undeposited
        Funds. An unapplied monetary remainder becomes customer account credit.
        Reusing an idempotencyKey returns the original matching session.

        Supplying statementId keeps the statement-led flow: monetary
        applications are limited to invoices on sent statements. Omitting it
        receives payment directly against the account's eligible outstanding
        invoices, with no statement required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - labOrganizationId
                - providerOrganizationId
                - paymentMethod
              properties:
                labOrganizationId: { type: string }
                providerOrganizationId: { type: string }
                doctorIdentity:
                  type: [string, "null"]
                  description: Stable doctor profile identity for new invoices; null preserves legacy name-scoped behavior.
                doctorName:
                  type: [string, "null"]
                  description: Optional canonical doctor scope; null means the entire practice.
                requestId: { type: string, description: Required together with requestToken for request-based signing }
                requestToken: { type: string, description: Required together with requestId for request-based signing }
                statementId:
                  type: [string, "null"]
                  description: Sent statement to pay against. Omit or null to receive payment directly against outstanding invoices.
                receivedAmount: { type: number, minimum: 0, default: 0 }
                existingCreditAmount: { type: number, minimum: 0, default: 0 }
                paymentDate: { type: string, format: date-time }
                paymentMethod:
                  type: string
                  enum: [card, ach, check, cash, other]
                checkNumber: { type: [string, "null"] }
                referenceNumber: { type: [string, "null"], description: Required for ACH and other monetary payments }
                cardLast4:
                  type: [string, "null"]
                  pattern: '^\d{4}$'
                memo: { type: [string, "null"] }
                customerEmail: { type: [string, "null"], format: email }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
                applications:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [invoiceId, amount]
                    properties:
                      invoiceId: { type: string }
                      amount: { type: number, exclusiveMinimum: 0 }
      responses:
        "201":
          description: Payment session recorded
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "200": { description: Existing idempotent payment session }
        "400": { description: "Invalid statement, invoice application, or amount" }
        "403": { description: Caller lacks owner or admin access on the lab }
        "409": { description: Idempotency key conflicts with another payment }
  /billing/payment-sessions/card:
    post:
      operationId: createStatementCardPaymentSession
      tags: [billing]
      summary: Charge a saved Stripe card and record one statement payment
      description: |
        Owner/admin-only saved-card Receive Payments path. The server reserves
        and definitively confirms the processor charge before creating the
        receipt and Undeposited Funds record. An idempotency key is required;
        pending, failed, or ambiguous processor outcomes do not create a
        statement-payment session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labOrganizationId, providerOrganizationId, receivedAmount, paymentMethod, cardLast4, idempotencyKey, applications]
              properties:
                labOrganizationId: { type: string }
                providerOrganizationId: { type: string }
                doctorIdentity:
                  type: [string, "null"]
                  description: Stable doctor profile identity for new invoices; null preserves legacy name-scoped behavior.
                doctorName:
                  type: [string, "null"]
                  description: Optional canonical doctor scope; null means the entire practice.
                statementId: { type: string }
                receivedAmount: { type: number, exclusiveMinimum: 0 }
                paymentDate: { type: string, format: date-time }
                paymentMethod: { type: string, enum: [card] }
                cardLast4: { type: string, pattern: '^\d{4}$' }
                memo: { type: [string, "null"] }
                customerEmail: { type: [string, "null"], format: email }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
                applications:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [invoiceId, amount]
                    properties:
                      invoiceId: { type: string }
                      amount: { type: number, exclusiveMinimum: 0 }
      responses:
        "201": { description: Card charge settled and receipt/Undeposited Funds payment session recorded }
        "200": { description: Existing idempotent payment session }
        "402": { description: Card payment was declined or failed }
        "403": { description: Caller lacks owner or admin access }
        "409": { description: Card charge outcome is pending or idempotency key conflicts }
  /billing/payment-sessions/{paymentSessionId}:
    get:
      operationId: getStatementPaymentSession
      tags: [billing]
      summary: Load a durable payment receipt record
      parameters:
        - { name: paymentSessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Saved payment, customer, method, balance, credit, and applications
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: cancelStatementPaymentSession
      tags: [billing]
      summary: Cancel an undeposited payment session
      description: Restores only this session's invoice applications and removes its account credit and Undeposited Funds entry.
      parameters:
        - { name: paymentSessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Payment session cancelled, or was already cancelled" }
        "409": { description: "Payment was deposited, reconciled, or cannot be reversed safely" }
  /billing/payment-sessions/{paymentSessionId}/receipt.pdf:
