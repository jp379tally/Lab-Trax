          required:
            [
              from,
              to,
              timeZone,
              totalRemakes,
              rechargedRemakes,
              nonRechargedRemakes,
              remakeReasons,
              timeSeries,
              records,
            ]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            timeZone: { type: string }
            totalRemakes:
              type: integer
              description: Canonical + legacy remakes in the window (after filters applied).
            rechargedRemakes:
              type: integer
              description: How many remakes were recharged to the provider.
            nonRechargedRemakes:
              type: integer
              description: totalRemakes - rechargedRemakes.
            remakeReasons:
              type: array
              description: Reason breakdown, sorted by count desc; blank reasons roll up to "Unspecified".
              items:
                type: object
                required: [reason, count]
                properties:
                  reason: { type: string }
                  count: { type: integer }
            timeSeries:
              type: array
              description: Remake count bucketed by groupBy period (week or month), sorted asc.
              items:
                type: object
                required: [period, periodStart, count]
                properties:
                  period: { type: string, description: "Label string (e.g. '2026-07' or '2026-07-13')." }
                  periodStart: { type: string, format: date-time, description: "UTC start of bucket." }
                  count: { type: integer }
            byDoctor:
              type: array
              description: Remake count per doctor, sorted by count desc.
              items:
                type: object
                required: [doctorName, count]
                properties:
                  doctorName: { type: string }
                  count: { type: integer }
            byReason:
              type: array
              description: Alias of remakeReasons — reason breakdown sorted by count desc.
              items:
                type: object
                required: [reason, count]
                properties:
                  reason: { type: string }
                  count: { type: integer }
            byType:
              type: array
              description: Remake count per type (Restorative / Removable / Implant / Other), sorted by count desc.
              items:
                type: object
                required: [typeName, count]
                properties:
                  typeName: { type: string }
                  count: { type: integer }
            records:
              type: array
              description: Individual remake records, newest first.
              items:
                type: object
                required: [id, caseNumber, receivedAt, reason, recharged, returnedToLab, source]
                properties:
                  id: { type: string }
                  caseNumber: { type: string }
                  originalCaseId: { type: string, nullable: true }
                  originalCaseNumber: { type: string, nullable: true }
                  receivedAt:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2}$'
                    description: Calendar date the remake was received.
                  reason: { type: string, description: "Display label; blank reasons show as 'Unspecified'." }
                  reasonKey: { type: string, nullable: true, description: "Structured key from the 18-key questionnaire." }
                  recharged: { type: boolean }
                  returnedToLab: { type: boolean }
                  category: { type: string, nullable: true, description: "'crown_bridge' | 'removable' | 'implant' | null." }
                  source: { type: string, enum: [canonical, legacy] }
                  doctorName: { type: string, nullable: true, description: "Doctor name for the case." }
    SttResult:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
    SafeUser:
      type: object
