  /billing/{labOrganizationId}/payment-receipt-template:
    get:
      operationId: getPaymentReceiptTemplate
      tags: [billing]
      summary: Get the lab's payment receipt email template
      parameters:
        - { name: labOrganizationId, in: path, required: true, schema: { type: string } }
