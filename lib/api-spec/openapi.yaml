          description: Updated shared view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSavedViewResult"
        "400": { description: "Invalid name or filters, or no update fields were provided" }
        "403": { description: Caller is not a member of the lab }
        "404": { description: View not found }
        "409": { description: A view with this name already exists }
    delete:
      operationId: deleteCaseSavedView
      tags: [cases]
      summary: Remove a shared Cases view
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: View removed }
        "403": { description: Caller is not a member of the lab }
        "404": { description: View not found }
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases visible to the authenticated user
      description: |
        Returns up to 500 most-recent canonical cases (plus projected legacy
        mobile cases) for all organizations the caller is a member of, or a
        single org when `organizationId` is provided. Provider users
        automatically include cross-lab linked-doctor cases.
      parameters:
        - name: organizationId
          in: query
          schema: { type: string }
          description: Filter to a single lab/provider org (optional).
        - name: include
          in: query
          schema: { type: string }
          description: Comma-separated extras to include (e.g. "restorations").
        - name: barcode
          in: query
          schema: { type: string }
          description: |
            Filter to cases whose pan barcode exactly matches this value
            (tenant-scoped). Useful for spotting duplicate-barcode conflicts
            before assigning a barcode to a new case.
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonWorklistCaseListResult"
        "401":
          description: Not authenticated
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a canonical case
      description: |
        Creates a new case row in the canonical `cases` table. The caller must
        be an active member of `labOrganizationId`. Auto-generates an invoice
        when the case has a `providerOrganizationId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseInput"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetailResult"
        "400":
          description: Validation error
        "403":
          description: Caller is not a member of the lab
        "503":
          description: Server busy — retry
  /cases/worklist:
    get:
      operationId: listCasesWorklist
      tags: [cases]
      summary: List a paged, filterable case worklist
      description: |
        Returns matching cases with filtering, complete-set counts, and
        server-side ordering applied before pagination. `createdAt` supports
        newest-first or oldest-first order; `dueDate` supports due-soonest
        order with undated cases last. Ties use case id for stable pages.
      parameters:
        - { name: organizationId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: barcode, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: taxonomyType, in: query, schema: { type: string } }
        - { name: conflictsOnly, in: query, schema: { type: boolean } }
        - { name: createdStart, in: query, schema: { type: string, format: date } }
        - { name: createdEnd, in: query, schema: { type: string, format: date } }
        - { name: dueStart, in: query, schema: { type: string, format: date } }
        - { name: dueEnd, in: query, schema: { type: string, format: date } }
        - { name: overdueOnly, in: query, schema: { type: boolean } }
        - { name: localDate, in: query, schema: { type: string, format: date } }
        - { name: sortKey, in: query, schema: { type: string, enum: [createdAt, dueDate] }, description: "Order matching cases before paging." }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc] }, description: "Order direction. Due-soonest uses dueDate ascending." }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Matching worklist page and complete-set total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasesWorklistResult"
        "400": { description: "Invalid filter, date range, or paging value" }
        "401": { description: Not authenticated }
        "403": { description: Caller is not a member of the requested organization }
  /cases/provider:
    get:
      operationId: listProviderCases
      tags: [cases]
      summary: List the authenticated provider's assigned cases
      description: |
        Provider-portal foundation. Returns up to 500 most-recent canonical
        cases whose `providerOrganizationId` belongs to the caller's own
        provider organization(s), expanded across cross-lab linked-doctor
        identities. Strictly provider-scoped: never returns lab-only cases or
        another provider's cases, and is not influenced by any client-supplied
        org id. A caller with no provider organization receives an empty list.
      responses:
        "200":
          description: Provider case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResult"
        "401":
          description: Not authenticated
  /cases/bulk-status:
    post:
      operationId: bulkChangeCaseStatus
      tags: [cases]
      summary: Change the status of multiple cases at once
      description: |
        Updates a list of cases to the same status in one operation. Every
        case ID must belong to a lab the caller is a member of. Returns the
        count of cases actually updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStatusCasesInput"
      responses:
        "200":
          description: Cases updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStatusCasesResult"
        "400":
          description: Validation error
        "403":
          description: Caller is not a member of the cases' lab
        "404":
          description: One or more case IDs not found
  /cases/bulk-reassign:
    post:
      operationId: bulkReassignCases
      tags: [cases]
      summary: Reassign multiple cases to a different practice
      description: |
        Reassigns a list of cases to a new provider organization in one
        operation. Every case ID must belong to a lab the caller is a member
        of. Returns the count of cases actually updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReassignCasesInput"
      responses:
        "200":
          description: Cases reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReassignCasesResult"
        "400":
          description: Validation error or target practice not found
        "403":
          description: Caller is not a member of the cases' lab
        "404":
          description: One or more case IDs not found
  /cases/import-from-itero-rx:
    post:
      operationId: importCaseFromIteroRx
      tags: [cases]
      summary: Import a case from an iTero Lab-Review Rx
      description: |
        Auto-create a LabTrax case from an iTero Lab-Review prescription. The
        Rx file (PDF or image) is uploaded as multipart/form-data with the
        field name `file`. The server uses OpenAI to extract patient, doctor,
        restoration, and notes fields from the Rx, creates an Active case
        with the Rx attached and `needsAiReview=true`, and records the iTero
        order id in `itero_imported_orders` so re-polls are idempotent.
      requestBody:
        required: true
        description: |
          multipart/form-data with the Rx PDF or image attached as the
          `file` field. The `file` field is a binary upload — represented
          here as `type: string` (rather than `format: binary`) so the
          generated TypeScript client does not depend on the DOM `File`
          global and can be called from non-DOM contexts (Electron main
          process, Node poller scripts, server-to-server calls).
          Pass a Blob/File at runtime; the generated client appends every
          field to a FormData and posts as multipart.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - iteroOrderId
                - labOrganizationId
                - providerOrganizationId
              properties:
                file:
                  type: string
                  description: Rx PDF or image (binary upload)
                iteroOrderId:
                  type: string
                labOrganizationId:
                  type: string
                providerOrganizationId:
                  type: string
                doctorNameHint:
                  type: string
                patientFirstNameHint:
                  type: string
                patientLastNameHint:
                  type: string
                receivedAt:
                  type: string
                  format: date
                scanDateHint:
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      enum: [""]
                rxDueDateHint:
                  type: string
                  description: Rx due date, not the lab's scheduled due date.
                labDueDateHint:
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      enum: [""]
                externalPatientIdHint:
                  type: string
                  description: Source-platform case/order identifier, separate from the Case Pan barcode.
                casePanBarcodeHint:
                  type: string
                providerContactSnapshot:
                  type: string
                  description: JSON-encoded contact details reviewed for this case.
                invoiceNotesHint:
                  type: string
                toothIndicesHint:
                  type: string
                shadeHint:
                  type: string
                materialHint:
                  type: string
                caseTypeHint:
                  type: string
                archHint:
                  type: string
                removableSubtypeHint:
                  type: string
                  enum: ["", partial, denture, flipper, repair_partial, repair_denture, repair]
                reviewedRestorationsHint:
                  type: string
                  description: JSON-encoded reviewed restoration rows; prices are resolved by the server.
                toothAssignments:
                  type: string
                  description: JSON-encoded explicit tooth-chart roles.
                bridgeConnectors:
                  type: string
                  description: Explicit bridge connector pairs from the reviewed tooth chart.
                notesHint:
                  type: string
                invoiceOverrideLines:
                  type: string
                  description: JSON-encoded role-authorized reviewed invoice lines.
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroImportResult"
        "200":
          description: Already imported (deduped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroImportResult"
  /cases/import-from-itero-zip:
    post:
      operationId: importCaseFromIteroZip
      tags: [cases]
      summary: Import a case from an iTero export ZIP
      description: |
        Accepts a full iTero export ZIP (e.g. OrthoCAD_Export_306682066.zip).
        The server locates the `iTero_Rx_*.pdf` inside, uses AI to create a
        case (same flow as `/cases/import-from-itero-rx`), attaches the Rx as
        the primary attachment, and attaches every other file in the ZIP to the
        new case. The iTero order ID is derived from the Rx filename; the ZIP
        filename is used as a fallback. Duplicate detection is the same as the
        single-file flow: an already-imported order returns `deduped: true`.
      requestBody:
        required: true
        description: |
          multipart/form-data with the full iTero export ZIP attached as the
          `file` field. The `file` field is a binary upload represented as
          `type: string` so the generated TypeScript client does not depend on
          the DOM `File` global.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - labOrganizationId
                - providerOrganizationId
              properties:
                file:
                  type: string
                  description: iTero export ZIP (binary upload, max 300 MB)
                labOrganizationId:
                  type: string
                providerOrganizationId:
                  type: string
                doctorNameHint:
                  type: string
                patientFirstNameHint:
                  type: string
                patientLastNameHint:
                  type: string
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroZipImportResult"
        "200":
          description: Already imported (deduped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroZipImportResult"
  /cases/import-from-itero-zip-batch:
    post:
      operationId: importCasesFromIteroZipBatch
      tags: [cases]
      summary: Batch-import cases from multiple iTero export ZIPs
      description: |
        Accepts up to 20 iTero export ZIP files in a single multipart request
        (`files[]` field). Each ZIP is processed independently: the server
        extracts the `iTero_Rx_*.pdf`, uses AI to create a case, and attaches
        every `.ply` scan found in the same ZIP to that case. Returns a
        per-file result array so the client can show granular status. Errors on
        individual ZIPs are captured per-entry and do not abort the batch.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files[]
                - labOrganizationId
              properties:
                files[]:
                  type: array
                  items:
                    type: string
                    description: iTero export ZIP (binary upload, max 300 MB each)
                  description: Up to 20 iTero export ZIPs
                labOrganizationId:
                  type: string
                providerOrganizationId:
                  type: string
                  description: Optional — if omitted the case is created without a linked practice.
                doctorNameHint:
                  type: string
                patientFirstNameHint:
                  type: string
                patientLastNameHint:
                  type: string
      responses:
        "207":
          description: Per-file results (success, deduped, or error for each ZIP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroZipBatchImportResult"
  /cases/barcode/{code}:
    get:
      operationId: getCaseByBarcode
      tags: [cases]
      summary: Find a case by its pan barcode
      description: |
        Returns the single case whose `casePanBarcode` exactly matches the
        given code within the specified lab, or 404 if none exists. The
        caller must be an active member of the lab. Designed for physical
        barcode scanner workflows that need a precise one-to-one lookup.
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
          description: The exact pan barcode value to look up.
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
          description: The lab the barcode belongs to.
      responses:
        "200":
          description: Matching case
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      case:
                        type: object
                        description: The matching case row (Drizzle shape)
        "400":
          description: Missing labOrganizationId or code
        "403":
          description: Caller is not a member of the lab
        "404":
          description: No case found with that barcode
  /cases/doctor-similarity:
    get:
      operationId: getDoctorSimilarity
      tags: [cases]
      summary: Find similar doctors for duplicate detection before case creation
      description: |
        Returns existing doctor names within the given
        `(labOrganizationId, providerOrganizationId)` practice that closely
        match the typed `doctorName`, using the shared bigram-similarity
        matcher (literal-exact names are never returned). Powers the
        pre-create duplicate-doctor confirmation prompt; the authoritative
        gate is the 409 `DOCTOR_CONFIRMATION_REQUIRED` returned by
        `POST /cases`. The caller must be an active member of
        `labOrganizationId`.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: providerOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: doctorName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Doctor-similarity matches (may be empty array)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorSimilarityResult"
        "400":
          description: Missing required query parameters
        "403":
          description: Caller is not a member of the lab
  /cases/patient-similarity:
    get:
      operationId: getPatientSimilarity
      tags: [cases]
      summary: Find similar patients for duplicate/remake detection
      description: |
        Returns patient-similarity hits for the given first+last name within a
        lab (and optional provider org or doctor name). Uses bigram similarity
        and nickname matching to surface potential duplicates. The caller must
        be an active member of `labOrganizationId`. Results are capped at
        `limit` (default 50, max 200); when truncated the response includes
        `truncated: true` and `totalFound`.
      parameters:
        - in: query
          name: patientFirstName
          required: true
          schema: { type: string }
        - in: query
          name: patientLastName
          required: true
          schema: { type: string }
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: providerOrganizationId
          required: false
          schema: { type: string }
          description: Scope results to a specific provider org when known.
        - in: query
          name: doctorName
          required: false
          schema: { type: string }
          description: Fallback doctor-name scope when providerOrganizationId is not known.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Maximum number of hits to return (default 50, max 200). When the full result set exceeds this value, the response includes truncated:true and totalFound.
      responses:
        "200":
          description: Similarity matches (may be empty array)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSimilarityResult"
        "400":
          description: Missing required query parameters
        "403":
          description: Caller is not a member of the lab
  /cases/itero-import-history:
    get:
      operationId: getIteroImportHistory
      tags: [cases]
      summary: Get iTero batch import history for a lab
      description: |
        Returns import sessions grouped by batchId (newest first). Each session
        shows when it ran, who ran it, how many orders were created vs
        deduplicated, and the resulting case IDs so the client can filter the
        cases list to that batch.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Import session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IteroImportHistoryResult"
  /cases/doctor-names:
    get:
      operationId: getCaseDoctorNames
      tags: [cases]
      summary: Get distinct doctor names across the caller's labs
      description: |
        Returns a sorted list of distinct non-empty doctor names from canonical
        cases and mobile lab_cases rows visible to the caller. Scoped to the
        caller's authorized organizations (direct memberships + cross-lab
        linked provider orgs for provider users). Intended for auto-populating
        the Doctor Name picker without fetching the full cases list.
      responses:
        "200":
          description: Sorted list of distinct doctor names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /cases/legacy-doctor-directory:
    get:
      operationId: getLegacyDoctorDirectory
      tags: [cases]
      summary: List legacy / providerless doctor names grouped per lab
      description: |
        Returns doctor names that exist only as legacy or providerless data —
        legacy `lab_cases` blobs (which carry no providerOrganizationId) and
        canonical `cases` whose providerOrganizationId is NULL — grouped per
        lab with a case count. Customer Center uses this to surface an
        "Unassigned / legacy doctor names" bucket so orphan/typo names can be
        merged into a real canonical doctor. Scoped to the caller's authorized
        organizations (mirrors /cases/doctor-names). Unlike /cases/doctor-directory
        this is specifically the providerless set and must never be used for the
        picker's practice auto-fill.
      responses:
        "200":
          description: Legacy / providerless doctor entries (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyDoctorDirectoryEntry"
  /doctors/resolve-name:
    get:
      operationId: resolveDoctorName
      tags: [doctors]
      summary: Resolve a scanned doctor name to an existing doctor (AI intake)
      description: |
        Powers the required "doctor not on file" step in the AI prescription
        intake (mobile AI reader + desktop drop zone). Given a scanned
        `doctorName` and the selected lab (+ optional practice), reports whether
        the name STRICTLY matches an existing doctor's stored spelling and, when
        it does not, lists likely existing doctors to suggest.

        `exactMatch` is the stored canonical spelling returned ONLY when the
        scanned name strictly matches (trim + collapse internal whitespace,
        case-insensitive, with no title/first/last-name stripping). When there
        is no strict match, `similarMatches` lists fuzzy suggestions via the
        shared doctor-similarity scorer at a deliberately low threshold so
        near-misses like `Dr. Cole` → `Dr. Kenisha Cole` surface. `canAddNew`
        is always true (the user may keep the scanned name as a new doctor).

        Doctor names are sourced from the same lab(+practice)-scoped directory
        the pickers use (canonical `cases.doctorName` unioned with legacy
        `lab_cases` blob names). The caller must be an active member of
        `labOrganizationId`. The authoritative backstop remains the 409
        `DOCTOR_CONFIRMATION_REQUIRED` gate on `POST /cases`.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: providerOrganizationId
          required: false
          schema: { type: string }
        - in: query
          name: doctorName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolution result (exact match and/or suggestions)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResolveNameResult"
        "400":
          description: Missing required query parameters
        "403":
          description: Caller is not a member of the lab
  /doctors/search:
    get:
      operationId: searchDoctors
      tags: [doctors]
      summary: Search doctor groups in a lab, ranked by similarity
      description: |
        Lists distinct (doctorName, providerOrganizationId) groups in the
        given lab, ranked by similarity to the optional `q` / `like`
        parameters using normalized name comparison (trim, lowercase,
        strip "Dr."/punctuation). Used by the desktop merge picker so it
        can search every doctor in the lab without a 50-row cap.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Free-text search across doctor + practice names.
        - in: query
          name: openOnly
          required: false
          schema: { type: boolean }
          description: Return only doctors with at least one open case.
        - in: query
          name: like
          required: false
          schema: { type: string }
          description: |
            Optional reference doctor name; when provided, results are
            ranked by similarity to this name so likely duplicates float
            to the top.
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
          description: |
            Page offset for cursoring through every doctor in a large lab.
      responses:
        "200":
          description: Doctor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorSearchResult"
  /doctors/duplicate-clusters:
    get:
      operationId: getDoctorDuplicateClusters
      tags: [doctors]
      summary: Possible-duplicate doctor clusters across the caller's admin labs
      description: |
        Returns likely-duplicate doctor clusters across every lab the caller
        owns/administers, grouped per lab and honoring each lab's
        `duplicateSuggestionThreshold` (clamped 0.5–0.95, default 0.7). Reuses
        the same normalized-name + bigram-similarity logic as the merge tooling
        so the count matches what the merge UI would flag. Powers the
        navigation duplicate-count badge on desktop and mobile. `totalGroups`
        is the badge count; it decreases as merges collapse clusters.
        Dismissed clusters are excluded from `clusters` and `totalGroups`, and
        are returned separately in `dismissedClusters`.
      responses:
        "200":
          description: Duplicate clusters (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorDuplicateClustersResult"
  /doctors/duplicate-clusters/dismiss:
    post:
      operationId: dismissDoctorDuplicateCluster
      tags: [doctors]
      summary: Permanently dismiss a suggested duplicate cluster for a lab
      description: |
        Records a server-side "Do not merge" dismissal for the given cluster key,
        scoped to the lab. Dismissed clusters are excluded from the active
        suggestions returned by `getDoctorDuplicateClusters` and from the
        navigation badge count. All admins of the lab see the effect
        immediately across all devices. Idempotent — dismissing an already-
        dismissed cluster just refreshes the snapshot. Lab-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorDuplicateClusterDismissInput"
      responses:
        "200":
          description: Cluster dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      dismissed: { type: boolean }
  /doctors/account-consolidations:
    post:
      operationId: consolidateDuplicateDoctorAccounts
      tags: [doctors]
      summary: Consolidate duplicate provider accounts onto the oldest account number
      description: |
        Consolidates the provider *user accounts* behind the given duplicate
        doctors into a single account per person. The account holding the
        oldest account number survives; every reference (practice memberships,
        unassigned-holding entries, linked accounts, doctor profiles with their
        phone/email entries, pricing overrides, saved doctor/practice memory,
        cases and invoices) is repointed at it in one transaction, and the
        extras are deactivated + soft-deleted with their account numbers kept
        reserved.

        Unambiguous duplicates are consolidated automatically by a background
        sweep; this endpoint exists so an admin can resolve a cluster whose
        identity signals conflict (two different emails or phone numbers) —
        those return 409 unless `force` is set. Reversible via
        `undoDuplicateDoctorAccountConsolidation` within the doctor-merge undo
        window. Lab-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorAccountConsolidationInput"
      responses:
        "200":
          description: Accounts consolidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorAccountConsolidationResult"
        "404":
          description: No duplicate provider accounts found for those doctors
        "409":
          description: The cluster's identity signals conflict and `force` was not set
  /doctors/account-consolidations/{auditLogId}/undo:
    post:
      operationId: undoDuplicateDoctorAccountConsolidation
      tags: [doctors]
      summary: Reverse a provider-account consolidation
      description: |
        Reverses a consolidation from its audit record, restoring the retired
        accounts and every reference that was moved. Only valid inside the
        doctor-merge undo window (default 10 minutes, configurable via
        `DOCTOR_MERGE_UNDO_WINDOW_MINUTES`) and only once per consolidation.
        Lab-admin only.
      parameters:
        - name: auditLogId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consolidation reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorAccountConsolidationUndoResult"
        "404":
          description: Consolidation audit entry not found
        "409":
          description: Past the undo window, or already undone
  /doctors/duplicate-clusters/restore:
    post:
      operationId: restoreDoctorDuplicateCluster
      tags: [doctors]
      summary: Restore (un-dismiss) a previously dismissed duplicate cluster
      description: |
        Removes the server-side dismissal for the given cluster key so the
        cluster can be suggested again. Lab-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorDuplicateClusterRestoreInput"
      responses:
        "200":
          description: Cluster restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      restored: { type: boolean }
  /doctors/merge/preview:
    post:
      operationId: previewDoctorMerge
      tags: [doctors]
      summary: Preview a doctor merge before committing
      description: |
        Returns aggregate counts for what a merge would move: per-source
        case count + date range + last few case numbers + count of
        pricing overrides that would follow. Includes soft-deleted cases
        when `includeSoftDeleted` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorMergeRequest"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorMergePreview"
  /doctors/merge:
    post:
      operationId: mergeDoctors
      tags: [doctors]
      summary: Merge one or more source doctors into a single target
      description: |
        Reassigns every (optionally including soft-deleted) case from each
        source `(doctorName, providerOrganizationId)` group to the target
        `(targetDoctorName, targetProviderOrganizationId)`. Per-doctor
        pricing overrides keyed on `(labOrganizationId, doctorName)` are
        also remapped, collapsing onto an existing target override
        (instead of violating its unique index). Source
        `providerOrganizationId` may be `null`. The target may be a
        brand-new doctor — it does not need any pre-existing cases. The
        caller must be a lab admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorMergeRequest"
      responses:
        "200":
          description: Merge complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorMergeResult"
  /doctors/merge/{auditLogId}/undo:
    post:
      operationId: undoDoctorMerge
      tags: [doctors]
      summary: Undo a recent doctor merge
      description: |
        Within a configurable time window (default 10 minutes), reverses
        the rename described by a `doctor_merged` audit-log row by
        re-applying the inverse rename to matching cases + pricing
        overrides. Refused if the window has passed, the row is not a
        `doctor_merged` action, or the inverse would clobber doctors
        that have since been edited. Admin-only, same lab as the
        original merge.
      parameters:
        - in: path
          name: auditLogId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Undo complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorMergeUndoResult"
  /cases/{caseId}/notes/{noteId}/notify:
    post:
      operationId: notifyCaseNote
      tags: [cases]
      summary: Notify the provider about a shared case note
      description: |
        Sends an email or SMS notification to the provider organization's primary
        contact, informing them that a new note has been shared on the case. The
        note must have `visibility = shared_with_provider`. Only lab members may
        call this endpoint. Returns 422 when the provider org has no contact
        info for the requested method.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
        - in: path
          name: noteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  type: string
                  enum: [email, sms]
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
        "422":
          description: Provider has no contact info for the requested method
        "403":
          description: Caller is not a lab member
  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get full case detail
      description: |
        Returns the full case detail including restorations, notes, attachments,
        events, and location history. Falls back to projecting a legacy mobile
        case when the ID is not found in the canonical `cases` table.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetailResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case not found
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update case fields
      description: |
        Partially update a case. All fields are optional. The caller must be
        an active member of the case's lab organization.
        `providerOrganizationId` is validated to be an active, non-deleted
        provider org belonging to the same lab before it is applied.
        `clearSuggestion: true` erases the AI-generated doctor suggestion
        without affecting any other fields.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseInput"
      responses:
        "200":
          description: Updated case row
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    description: Raw updated case row (Drizzle shape)
        "400":
          description: Validation error or invalid providerOrganizationId
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case not found or caller lacks access
  /cases/{caseId}/doctor-candidates:
    get:
      operationId: getCaseDoctorCandidates
      tags: [cases]
      summary: List eligible doctors at the persisted case's practice
      description: |
        Active admins and owners of the case's lab only. Includes registered
        doctors without cases and supported name-only roster entries. Lab and
        practice are resolved from the exact persisted case, never a typed name.
        Filtering and exclusions happen before pagination.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Case assignment and practice-scoped candidate page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDoctorCandidatesResult"
        "403":
          description: Not an active admin or owner of the case lab
        "404":
          description: Case not found
        "409":
          description: Case has no explicit eligible practice
  /cases/{caseId}/doctor-reassignment:
    post:
      operationId: reassignCaseDoctor
      tags: [cases]
      summary: Change doctor for this case only
      description: |
        Validates the saved assignment revision and revalidates the selected
        candidate at the unchanged practice. Updates only this case's doctor
        name and writes history and audit atomically. Never merges doctors,
        creates accounts, reprices, or changes saved invoices.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseDoctorReassignmentInput"
      responses:
        "200":
          description: Committed case-only assignment with short-lived Undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDoctorReassignmentResult"
        "400":
          description: Invalid request or unchanged doctor
        "403":
          description: Not an active admin or owner of the case lab
        "404":
          description: Case not found
        "409":
          description: Stale assignment or target no longer eligible
  /cases/{caseId}/doctor-reassignment/{auditLogId}/undo:
    post:
      operationId: undoCaseDoctorReassignment
      tags: [cases]
      summary: Undo one audited case-only doctor assignment
      description: |
        Active case-lab admins and owners only, within the existing doctor-change
        undo window. Refuses if the case has changed since the audited write.
        Directory merge audit records are never accepted.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string, minLength: 1 }
        - in: path
          name: auditLogId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Case-only assignment restored and reversal audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDoctorReassignmentResult"
        "403":
          description: Not an active admin or owner of the case lab
        "404":
          description: Case or matching reassignment audit not found
        "409":
          description: Undo expired, already reversed, or case subsequently changed
  /cases/bulk-restore:
    post:
      operationId: bulkRestoreCases
      tags: [cases]
      summary: Restore multiple soft-deleted cases and unfreeze linked invoices
      description: |
        Restores up to 200 soft-deleted cases in a single call. For each case,
        clears `deleted_at` / `deleted_by_user_id` and unfreezes any linked
        invoices frozen when the case was deleted. Cases that cannot be restored
        (not found, wrong lab, already active) are returned in `failed` rather
        than aborting the whole batch. The caller must be an admin of the
        specified lab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseIds, labOrganizationId]
              properties:
                caseIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 200
                labOrganizationId:
                  type: string
      responses:
        "200":
          description: Bulk restore result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      restored:
                        type: array
                        items: { type: string }
                        description: IDs of successfully restored cases
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            reason: { type: string }
                        description: Cases that could not be restored
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Caller is not an admin of the specified lab
  /cases/{caseId}/rx-note-scans:
    post:
      operationId: appendCaseRxNoteScan
      tags: [cases]
      summary: Save notes from one accepted prescription scan
      description: |
        Appends one server-dated prescription note entry to the case. Replaying
        the same submissionId with identical notes returns the original entry;
        reusing it with changed notes is rejected. Only lab members may submit.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendCaseRxNoteScanInput"
      responses:
        "200":
          description: Prescription notes recorded or the original entry returned for a retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RxNoteEntryResult"
        "400":
          description: Invalid submission or blank notes
        "401":
          description: Not authenticated
        "403":
          description: Caller lacks access to the case
        "404":
          description: Case not found
        "409":
          description: Submission ID was already used with different notes
  /cases/{caseId}/restore:
    post:
      operationId: restoreCase
      tags: [cases]
      summary: Restore a soft-deleted case and unfreeze linked invoices
      description: |
        Restores a soft-deleted case by clearing its `deleted_at` /
        `deleted_by_user_id` columns and unfreezes every linked non-deleted
        invoice that was frozen when the case was deleted (clears `frozen`,
        `caseDeletedAt`, `caseDeletedByUserId`, `caseDeletedNote`, and
        restores `balanceDue` to the invoice `total`). An audit log entry is
        written for each unfrozen invoice. The caller must be an admin of the
        case's lab.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      restored: { type: boolean }
                      unfrozenInvoices:
                        type: integer
                        description: Number of invoices that were unfrozen
        "401":
          description: Not authenticated
        "403":
          description: Caller is not an admin of the case's lab
        "404":
          description: Case not found
        "409":
          description: Case is not currently deleted
  /cases/deleted:
    get:
      operationId: listDeletedCases
      tags: [cases]
      summary: List soft-deleted cases for a lab (admin only)
      description: |
        Returns all soft-deleted canonical cases for the given lab, ordered by
        `deletedAt` descending. The caller must be an admin of the lab.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted cases list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      cases:
                        type: array
                        items:
                          type: object
                          required: [id, caseNumber, patientFirstName, patientLastName, doctorName, labOrganizationId, deletedAt, createdAt]
                          properties:
                            id: { type: string }
                            caseNumber: { type: string }
                            patientFirstName: { type: string }
                            patientLastName: { type: string }
                            doctorName: { type: string }
                            labOrganizationId: { type: string }
                            deletedAt: { type: string, format: date-time }
                            deletedByUserId: { type: string, nullable: true }
                            createdAt: { type: string, format: date-time }
        "400":
          description: labOrganizationId is required
        "401":
          description: Not authenticated
        "403":
          description: Caller is not an admin of the lab
  /cases/{caseId}/notes:
    post:
      operationId: addCaseNote
      tags: [cases]
      summary: Add a note to a case
      description: |
        Creates a case note. Lab members author internal or shared notes;
        provider members author notes attributed to their org. Visibility
        defaults to `internal_lab_only`.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCaseNoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller lacks access to the case
        "404":
          description: Case not found
  /cases/{caseId}/restorations:
    post:
      operationId: addCaseRestoration
      tags: [cases]
      summary: Add a restoration to a case
      description: |
        Adds a restoration line item (crown, pontic, etc.) to a case. Unit
        price is auto-resolved from pricing when `unitPrice` is omitted or 0.
        Only lab members may call this endpoint.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCaseRestorationInput"
      responses:
        "201":
          description: Restoration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRestorationResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case not found
  /cases/{caseId}/tooth-chart:
    patch:
      operationId: saveCaseToothChart
      tags: [cases]
      summary: Save staged tooth assignments and the case invoice atomically
      description: |
        Requires lab billing permission. Missing is a nonbillable tooth status.
        Refuses paid, finalized or reviewed invoices without committing chart changes.
        The chart, connector graph and invoice rebuild commit together or roll back.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToothChartCommitInput" }
      responses:
        "200":
          description: Chart and invoice committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothChartCommitResult" }
        "400": { description: Invalid assignments or no configured catalog price }
        "403": { description: Billing permission required }
        "409": { description: Conflicting assignment or protected invoice; nothing committed }
  /cases/{caseId}/restorations/hierarchy:
    patch:
      operationId: updateCaseRestorationHierarchy
      tags: [cases]
      summary: Reconcile the case restoration set and clinical details
      description: |
        Atomically reconciles the case's restoration teeth, case type, subtype,
        material, shade, arch, and removable step. Surviving restoration rows
        retain their quantities, notes, and manual prices. Only lab members
        may call this endpoint; step changes are restricted to admins and owners.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRestorationHierarchyUpdateInput"
      responses:
        "200":
          description: Restoration reconciliation and invoice outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRestorationHierarchyUpdateResult"
        "400":
          description: Invalid hierarchy or required arch is missing
        "401":
          description: Not authenticated
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case not found
        "500":
          description: Clinical details were saved but invoice synchronization failed
  /cases/{caseId}/restorations/{restorationId}:
    patch:
      operationId: updateCaseRestoration
      tags: [cases]
      summary: Update a case restoration
      description: |
        Partially updates a restoration line item. All fields are optional.
        Setting `unitPrice` marks the price source as manual. Only lab
        members may call this endpoint.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
        - in: path
          name: restorationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRestorationInput"
      responses:
        "200":
          description: Restoration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRestorationResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case or restoration not found
    delete:
      operationId: deleteCaseRestoration
      tags: [cases]
      summary: Delete a case restoration
      description: |
        Removes a restoration line item and keeps the case invoice in sync.
        Only lab members may call this endpoint.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
        - in: path
          name: restorationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restoration deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller is not a member of the case's lab
        "404":
          description: Case or restoration not found
  /cases/{caseId}/attachments:
    post:
      operationId: uploadCaseAttachment
      tags: [cases]
      summary: Attach an uploaded file to a case
      description: |
        Records a case attachment for a file already uploaded to storage
        (referenced by `storageKey`). Only lab members may attach to a
        canonical case. Visibility defaults to `internal_lab_only`.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseAttachmentInput"
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseAttachmentResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller lacks access to the case
        "404":
          description: Case not found
  /cases/{caseId}/attachments/{attachmentId}:
    delete:
      operationId: deleteCaseAttachment
      tags: [cases]
      summary: Delete a case attachment
      description: |
        Soft-deletes a case attachment. Only lab members may call this
        endpoint.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
        - in: path
          name: attachmentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResult"
        "401":
          description: Not authenticated
        "403":
          description: Caller lacks access to the case
        "404":
          description: Attachment not found
  /pricing/resolve:
    get:
      operationId: resolveItemPrice
      tags: [invoices]
      summary: Resolve the canonical unit price for a case item
      description: |
        Checks per-doctor overrides, practice-level pricing tiers, and lab
        defaults in that priority order — the same logic used when generating
        invoices. Any active lab member may call this endpoint.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
          description: Lab organisation to resolve pricing for.
        - in: query
          name: doctorName
          required: false
          schema: { type: string }
          description: Doctor name for per-doctor override lookup.
        - in: query
          name: caseType
          required: false
          schema: { type: string }
          description: Case/restoration type (e.g. "Crown", "Appliance").
        - in: query
          name: material
          required: false
          schema: { type: string }
          description: Material or appliance subtype (e.g. "Zirconia", "Snore Guard").
      responses:
        "200":
          description: Resolved price for the item
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [price]
                    properties:
                      price:
                        type: number
                        nullable: true
                        description: Resolved unit price, or null when no price can be determined.
        "403":
          description: Caller is not a member of the specified lab.
  /pricing/item-labels:
    get:
      operationId: getItemLabels
      tags: [invoices]
      summary: Get admin-configured line item labels for the caller's lab
      description: |
        Returns the merged label map for the caller's lab: admin-configured
        labels where set, and static defaults for the rest. Every known price
        key is always included in the response. Any active lab member may call
        this endpoint.
      parameters:
        - in: query
          name: labOrganizationId
          required: false
          schema: { type: string }
          description: Lab org to fetch labels for. Defaults to the caller's first active lab.
      responses:
        "200":
          description: Label map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLabelsResult"
    put:
      operationId: updateItemLabels
      tags: [invoices]
      summary: Upsert admin-configured line item labels for the caller's lab
      description: |
        Saves the provided label map for the caller's lab. Each key in
        `labels` must be a known standard price key (unknown keys are
        silently ignored). Restricted to lab admins. Only keys present in the
        request body are updated; omitted keys are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemLabelsInput"
      responses:
        "200":
          description: Updated label map (merged with static defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLabelsResult"
        "403":
          description: Caller is not a lab administrator.
  /pricing/discount-items:
    get:
      operationId: getDiscountItems
      tags: [invoices]
      summary: Get the lab's fixed-amount discount items for invoice editing
      description: |
        Returns explicitly flagged discount catalog items with their positive
        default amount resolved from the case's effective pricing tier when a
        caseId is supplied, or the lab's Standard/oldest tier otherwise.
        Discount items are intentionally excluded from case/restoration pricing.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: caseId
          required: false
          schema: { type: string }
          description: Optional case used to resolve the applicable tier.
      responses:
        "200":
          description: Discount items available to invoice editors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCatalogItemsResult"
        "403":
          description: Caller is not a member of the specified lab.
        "404":
          description: Case not found in the specified lab.
  /pricing/add-item:
    post:
      operationId: addBillableItem
      tags: [invoices]
      summary: Define a custom billable item and apply it to pricing tiers
      description: |
        Creates a custom billable item (name, description, price) and writes
        its price into one or more existing pricing tiers in a single call.
        Generates a stable, deduped custom price key from the name, stores the
        label + description, and records a tier-update audit entry for each
        affected tier. Restricted to lab admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBillableItemInput"
      responses:
        "201":
          description: Item created and applied to the selected tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddBillableItemResult"
        "403":
          description: Caller is not a lab administrator.
        "404":
          description: One or more selected tiers were not found in this lab.
  /lab-orgs/{orgId}/statement-schedule:
    get:
      operationId: getStatementSchedule
      tags: [invoices]
      summary: Get or create the auto-send schedule for a lab
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Statement schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementScheduleResult"
    put:
      operationId: updateStatementSchedule
      tags: [invoices]
      summary: Update the auto-send schedule for a lab
      parameters:
        - in: path
          name: orgId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementScheduleInput"
      responses:
        "200":
          description: Updated statement schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementScheduleResult"
  /invoices/filter-facets:
    get:
      operationId: listInvoiceFilterFacets
      tags: [invoices]
      summary: List complete invoice practice and doctor filter options
      description: |
        Returns distinct practice and doctor filter options within the caller's
        authorized invoice scope without constructing invoice response rows.
      parameters:
        - name: labOrganizationId
          in: query
          schema: { type: string }
          description: Restrict facets to invoices for a specific lab org.
        - name: practiceId
          in: query
          schema: { type: string }
          description: Restrict facets to invoices for a specific provider org.
      responses:
        "200":
          description: Complete invoice filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFilterFacetsResult"
        "401":
          description: Not authenticated
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices visible to the authenticated user
      description: |
        Returns invoices for all organizations the caller is an active member
        of. Supports filtering by `caseId`, `practiceId`, `practiceIds`,
        `labOrganizationId`, status, search, date, overdue, and sorting filters.
        Status controls are normalized in this order: `view` takes precedence
        over `statuses`, and `statuses` takes precedence over legacy `status`.
        For sorting, legacy `sort` takes precedence over `sortBy` when both are
        supplied; `sortDir` is the legacy direction and `sortDirection` is
        used with `sortBy`. Each sorting parameter accepts one value.
        Invalid sort fields or directions return 400.
        When `view=outstanding`, aging parameters are ignored because that view
        already defines the overdue window.
      parameters:
        - name: caseId
          in: query
          schema: { type: string }
          description: Filter to invoices for a specific case.
        - name: practiceId
          in: query
          schema: { type: string }
          description: Filter to invoices for a specific provider org.
        - name: practiceIds
          in: query
          schema: { type: string }
          description: Comma-separated list of provider org IDs.
        - name: labOrganizationId
          in: query
          schema: { type: string }
          description: Filter to a specific lab org.
        - name: status
          in: query
          schema: { type: string }
          description: "Legacy status filter: 'open', 'all', 'overdue', or comma-separated values from open, partially_paid, paid, void, frozen, and zero_balance. Invalid values return 400. Ignored when view or statuses is supplied."
        - name: statuses
          in: query
          schema: { type: string }
          description: "Comma-separated status filters using open, partially_paid, paid, void, frozen, or zero_balance. Invalid values return 400. Ignored when view is supplied; otherwise takes precedence over status."
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
          description: "Return invoices issued at or after this date. Invalid values or a dateFrom later than dateTo return 400."
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
          description: "Return invoices issued at or before this date. Invalid values or a dateTo earlier than dateFrom return 400."
        - { name: search, in: query, schema: { type: string }, description: "Search invoice number, customer, patient, or doctor." }
        - { name: doctorName, in: query, schema: { type: string } }
        - { name: aiOnly, in: query, schema: { type: boolean } }
        - { name: overdueBucket, in: query, schema: { type: string, enum: [all, 0_30, 31_60, 61_90, 90_plus, custom] }, description: "Aging bucket. Invalid values return 400. Ignored when view=outstanding." }
        - { name: dueDateFrom, in: query, schema: { type: string, format: date }, description: "Custom aging start date. Invalid dates or a dueDateFrom later than dueDateTo return 400. Ignored when view=outstanding." }
        - { name: dueDateTo, in: query, schema: { type: string, format: date }, description: "Custom aging end date. Invalid dates or a dueDateTo earlier than dueDateFrom return 400. Ignored when view=outstanding." }
        - { name: issuedFrom, in: query, schema: { type: string, format: date-time }, description: "Inclusive lower bound for the issued-date range. Invalid values or an issuedFrom later than issuedTo return 400." }
        - { name: issuedTo, in: query, schema: { type: string, format: date-time }, description: "Exclusive upper bound for the issued-date range. Invalid values or an issuedTo earlier than issuedFrom return 400." }
        - { name: sort, in: query, deprecated: true, schema: { type: string, enum: [issued, due, practice] }, description: "Legacy sort field. Takes precedence over sortBy when both are supplied. Invalid values return 400." }
        - { name: sortDir, in: query, deprecated: true, schema: { type: string, enum: [asc, desc] }, description: "Legacy sort direction for sort. Invalid values return 400." }
        - { name: sortBy, in: query, schema: { type: string, enum: [issued, due, practice] }, description: "Current sort field. Ignored when sort is supplied. Invalid values return 400." }
        - { name: sortDirection, in: query, schema: { type: string, enum: [asc, desc] }, description: "Current sort direction for sortBy. Invalid values return 400." }
        - { name: view, in: query, schema: { type: string, enum: [open, outstanding] }, description: "Canonical invoice view. Takes precedence over status and statuses." }
        - { name: includeFacets, in: query, schema: { type: boolean }, description: Include complete practice and doctor filter options. }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResult"
        "400":
          description: Invalid invoice status, view, aging filter, date filter, date range order, sort field, or sort direction value
        "401":
          description: Not authenticated
  /invoices/{invoiceId}:
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice (status, line items, metadata)
      description: |
        Partially updates an invoice. Requires a billing role (owner, admin,
        or billing) on the invoice's lab. Replaces the entire `items` array
        when supplied. Returns the updated invoice with totals.
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetailResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role
        "404":
          description: Invoice not found
        "409":
          description: Invoice is frozen or likely shifted dates require the dedicated repair action
  /invoices/{invoiceId}/repair-dates:
    patch:
      operationId: repairInvoiceDates
      tags: [invoices]
      summary: Repair historical invoice dates
      description: |
        Corrects only the issue and due dates on an invoice. Requires an owner
        or admin role and records a dedicated audit event. Only non-midnight
        timestamps on invoices created before the date-only conversion fix are
        eligible.
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceDateRepairInput"
      responses:
        "200":
          description: Invoice with repaired dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetailResult"
        "400":
          description: Invalid or unchanged dates
        "403":
          description: Caller is not an owner or admin
        "404":
          description: Invoice not found
        "409":
          description: Invoice is frozen
  /invoices/cases/{caseId}/generate-invoice:
    post:
      operationId: generateInvoiceForCase
      tags: [invoices]
      summary: Generate an invoice for a canonical case
      description: |
        Creates a draft invoice for the specified case, pre-filling line items
        from the case's restorations and display metadata from the case fields.
        Idempotent — returns the existing invoice when one with the derived
        invoice number already exists. Requires a billing role on the case's lab.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                layoutPresetId:
                  type: string
                  nullable: true
                  description: Optional layout preset to apply to the generated invoice.
      responses:
        "201":
          description: Generated (or existing) invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetailResult"
        "403":
          description: Caller lacks a billing role on the case's lab
        "404":
          description: Case not found
  /invoices/preview-draft:
    post:
      operationId: previewDraftInvoice
      tags: [invoices]
      summary: Preview the draft invoice for a set of restorations (read-only)
      description: |
        Returns the line items and totals that WOULD be generated for a case
        with the supplied restorations, WITHOUT creating a case, invoice, or any
        database row. Pricing and line grouping reuse the exact same code paths
        as the real case-creation flow, so the preview matches the generated
        draft invoice line-for-line. Requires the caller to be an active member
        of `labOrganizationId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewDraftInvoiceInput"
      responses:
        "200":
          description: Draft invoice preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDraftInvoiceResult"
        "400":
          description: Validation error
        "403":
          description: Caller is not a member of the lab
  /pricing/pre-create-items:
    get:
      operationId: getPreCreateInvoiceItems
      tags: [pricing]
      summary: List active billable items with contextual pre-create pricing
      description: |
        Returns every active billable item for a lab with the effective unit
        price for the supplied practice and doctor. Pricing uses the same
        override, discount, tier, and default precedence as case invoice
        creation. Requires an owner or admin membership in the requested lab.
      parameters:
        - name: labOrganizationId
          in: query
          required: true
          schema: { type: string }
        - name: providerOrganizationId
          in: query
          required: false
          schema: { type: string }
        - name: doctorName
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Active billable items with effective contextual pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreCreateInvoiceItemsResult"
        "403":
          description: Caller is not an owner or admin of the requested lab
  /invoices/practice-statements:
    get:
      operationId: listPracticeStatements
      tags: [invoices]
      summary: List generated practice statements for an account
      description: |
        Requires `providerOrganizationId` or `labOrganizationId`. Returns the
        legacy statement array unless `limit` or `offset` is supplied; either
        parameter opts into `{rows,total,limit,offset,hasMore}`.
      parameters:
        - { name: providerOrganizationId, in: query, schema: { type: string } }
        - { name: labOrganizationId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Practice statement history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeStatementListResult"
        "400": { description: One account filter is required }
  /invoices/practice-statements/{statementId}/pdf:
    get:
      operationId: getPracticeStatementPdf
      tags: [invoices]
      summary: Open a persisted practice statement PDF
      parameters:
        - name: statementId
          in: path
          required: true
          schema: { type: string }
        - name: attachmentIndex
          in: query
          required: false
          description: Select an issued bundle PDF; omitted selects the original single-PDF statement.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Persisted statement PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { description: Authentication required }
        "404": { description: Statement or attachment not found }
  /invoices/open:
    get:
      operationId: listOpenInvoices
      tags: [invoices]
      summary: List open invoices for a provider/practice (Receive Payments)
      description: |
        Returns the open (issued or partially-paid) invoices the lab can
        currently receive payments against. Requires the caller to have a
        billing role (owner, admin, or billing) in `labOrganizationId`.
      parameters:
        - name: labOrganizationId
          in: query
          required: true
          schema: { type: string }
          description: Lab organization to scope the invoices to.
        - name: providerOrganizationId
          in: query
          required: true
          schema: { type: string }
          description: Provider/practice to filter open invoices for.
      responses:
        "200":
          description: Open-invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenInvoiceListResult"
        "403":
          description: Caller lacks a billing role on the lab.
  /admin/backup/restore:
    post:
      operationId: restoreBackup
      tags: [backup]
      summary: Restore a backup from an uploaded .zip.enc file
      description: |
        Upload a LabTrax `.zip.enc` backup file. The server validates the file,
        decrypts it, and restores the database and media files asynchronously.
        Returns 202 immediately; poll `/admin/backup/restore/status` for progress.
        Requires the `X-Platform-Admin-Secret` header. Only one restore can run
        at a time (returns 409 if another is already in progress).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  description: |
                    The encrypted .zip.enc backup file (max 2 GB). Represented as
                    `type: string` (not `format: binary`) so the generated client
                    does not depend on the DOM `File` global. Pass a Blob/File at runtime.
      responses:
        "202":
          description: Restore started — poll /admin/backup/restore/status for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStartResult"
        "400":
          description: No file uploaded or invalid file
        "403":
          description: Admin access required
  /finance/register-analytics:
    get:
      operationId: getRegisterAnalytics
      tags: [finance]
      summary: Selected account activity across the complete calendar-date period
      description: Independent of register filters and paging. Posted money excludes transfers and active deposit children. Status counts include transfers.
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: bankAccountId, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: dateFrom, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: dateTo, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Whole-account period analytics, using UTC calendar transaction dates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterAnalytics" }
        "400": { description: Invalid date range (maximum 366 calendar days) }
        "403": { description: Lab billing access required }
        "404": { description: Account not found in selected lab }
  /finance/transactions:
    get:
      operationId: listFinanceTransactions
      tags: [finance]
      summary: List finance register transactions
      description: |
        Lists transactions visible in the selected lab's finance register.
        The response is the legacy array unless `limit` or `offset` is
        supplied; either parameter opts into `{rows,total,limit,offset,hasMore}`.
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string } }
        - { name: bankAccountId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [all, posted, projected, void, uncleared, unreconciled] } }
        - { name: payee, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: amountMin, in: query, schema: { type: number } }
        - { name: amountMax, in: query, schema: { type: number } }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Finance transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTransactionListResult"
  /finance/undeposited-funds:
    get:
      operationId: listUndepositedFunds
      tags: [finance]
      summary: List posted transactions in Undeposited Funds
      description: |
        Without `summary=1`, returns the legacy transaction array unless
        `limit` or `offset` opts into a paged result. `summary=1` continues to
        return the count/total summary object. `selection=ids` (ignored when
        `summary=1` is present) returns the id and amount of every transaction
        matching the filters, disregarding `limit`/`offset`, so a paged client
        can select the whole filtered set.
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string } }
        - { name: summary, in: query, schema: { type: string, enum: ["1"] } }
        - { name: selection, in: query, schema: { type: string, enum: ["ids"] } }
        - { name: practiceId, in: query, schema: { type: string } }
        - { name: doctorKey, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Undeposited funds transactions or summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndepositedFundsListResult"
  /finance/deposit-batches:
    get:
      operationId: listDepositBatches
      tags: [finance]
      summary: List deposit batch history
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Deposit batch history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositBatchHistoryResult"
  /finance/reconciliation/history:
    get:
      operationId: listReconciliationHistory
      tags: [finance]
      summary: List reconciliation history
      description: |
        Returns reconciliation history as the legacy array by default. Supplying
        either paging parameter opts into a `{rows,total,limit,offset,hasMore}`
        result.
      parameters:
        - { name: bankAccountId, in: query, schema: { type: string } }
        - { name: organizationId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/PagingLimit" }
        - { $ref: "#/components/parameters/PagingOffset" }
      responses:
        "200":
          description: Reconciliation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationHistoryListResult"
        "409":
          description: Another restore is already in progress
  /finance/bills:
    get:
      operationId: listBills
      tags: [finance]
      summary: List vendor bills for a lab
      description: |
        Bills ordered by due date. `lines` is always empty here — fetch a
        single bill for its lines, payment history, and events. Requires a
        billing role in the lab.
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: vendorId
          schema: { type: string, minLength: 1 }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/BillStatusFilter"
          description: Defaults to `open` — unvoided bills that still carry a balance.
        - in: query
          name: dueBefore
          schema: { type: string }
          description: Only bills due on or before this date.
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
          description: Matches bill number, memo, or vendor name.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
          description: Defaults to 200.
      responses:
        "200":
          description: Bill list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBillListResult"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "403":
          description: Caller lacks a billing role in this lab
    post:
      operationId: createBill
      tags: [finance]
      summary: Enter a vendor bill
      description: |
        Recognizes the expense and raises accounts payable. It never touches a
        bank account. Re-using a bill number the vendor already has returns
        409 `duplicate_bill_reference`; re-submit with
        `acknowledgeDuplicateReference` to save it anyway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillInput"
      responses:
        "201":
          description: Created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBillResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Vendor not found in this lab
        "409":
          description: The vendor already has an open bill with this reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateBillReferenceError"
  /finance/bills/{id}:
    get:
      operationId: getBill
      tags: [finance]
      summary: Get one vendor bill with its lines, payments, and history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBillDetailResult"
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Bill not found
    patch:
      operationId: updateBill
      tags: [finance]
      summary: Edit a vendor bill
      description: |
        Every field is optional; supplying `lines` replaces the whole set. A
        voided bill cannot be edited.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillInput"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBillResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Bill not found
        "409":
          description: The bill is void, or the vendor already has this reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateBillReferenceError"
  /finance/bills/{id}/void:
    post:
      operationId: voidBill
      tags: [finance]
      summary: Void a vendor bill
      description: |
        Keeps the record and its history. Live payment allocations must be
        reversed first, so the cash side and the liability side cannot
        disagree. The returned bill carries no vendor name or lines.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidReasonInput"
      responses:
        "200":
          description: Voided bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBillResult"
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Bill not found
        "409":
          description: Already void, or the bill still carries live payments
  /finance/vendor-credits:
    get:
      operationId: listVendorCredits
      tags: [finance]
      summary: List vendor credits for a lab
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: vendorId
          schema: { type: string, minLength: 1 }
        - in: query
          name: openOnly
          schema: { type: string, enum: ["true", "false"] }
          description: Defaults to `true` — unvoided credits with something left.
      responses:
        "200":
          description: Vendor credit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorCreditListResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
    post:
      operationId: createVendorCredit
      tags: [finance]
      summary: Record a vendor credit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorCreditInput"
      responses:
        "201":
          description: Created vendor credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorCreditResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Vendor not found in this lab
  /finance/vendor-credits/{id}/void:
    post:
      operationId: voidVendorCredit
      tags: [finance]
      summary: Void a vendor credit
      description: |
        Payments that consumed this credit must be reversed first.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidReasonInput"
      responses:
        "200":
          description: Voided vendor credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorCreditResult"
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Vendor credit not found
        "409":
          description: Already void, or the credit is still applied to a payment
  /finance/vendors/{vendorId}/ap-summary:
    get:
      operationId: getVendorApSummary
      tags: [finance]
      summary: One vendor's payables as of a date
      description: |
        Bills, credits, payments, amount due, and overdue for a single vendor.
        Figures are reconstructed for the as-of date rather than read off the
        live balances, so a past-dated request answers with what the vendor was
        owed then. Unapplied credit is reported separately and never netted
        into the payable.
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string }
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: asOf
          schema: { type: string }
          description: |
            A bare `YYYY-MM-DD` means the whole of that day and resolves to the
            end of the day in `timeZone`. Defaults to now.
        - in: query
          name: timeZone
          schema: { type: string, maxLength: 64 }
          description: IANA zone used to resolve a bare `asOf` date.
      responses:
        "200":
          description: Vendor AP summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorApSummaryResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Vendor not found in this lab
  /finance/pay-bills:
    get:
      operationId: getPayBills
      tags: [finance]
      summary: Outstanding bills grouped by vendor, with available credit
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: vendorId
          schema: { type: string, minLength: 1 }
        - in: query
          name: dueBefore
          schema: { type: string }
          description: Only bills due on or before this date, unless `showAll` is true.
        - in: query
          name: showAll
          schema: { type: string, enum: ["true", "false"] }
          description: Ignore `dueBefore` and return every open bill.
      responses:
        "200":
          description: Payable bills by vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayBillsResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
  /finance/bill-payments:
    get:
      operationId: listBillPayments
      tags: [finance]
      summary: List vendor payments with their allocations
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: vendorId
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
          description: Defaults to 200.
      responses:
        "200":
          description: Vendor payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPaymentListResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
    post:
      operationId: createBillPayment
      tags: [finance]
      summary: Pay bills
      description: |
        Atomically reduces each selected bill's balance, consumes any applied
        vendor credit, and posts exactly one bank withdrawal per vendor for the
        cash portion. A payment funded entirely by credit posts no withdrawal.
        Replaying the same `idempotencyKey` with the same request returns the
        original run's payments with `replayed: true` and a 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentInput"
      responses:
        "201":
          description: Payments posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentResult"
        "200":
          description: Replay of an already-posted run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: A vendor, bill, credit, or bank account was not found
        "409":
          description: The same idempotency key was reused with a different request
  /finance/bill-payments/{id}/void:
    post:
      operationId: voidBillPayment
      tags: [finance]
      summary: Void a vendor payment
      description: |
        Reverses the allocations, restores the bill and credit balances, and
        voids the bank withdrawal in one transaction.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidReasonInput"
      responses:
        "200":
          description: Voided vendor payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPaymentResult"
        "403":
          description: Caller lacks a billing role in this lab
        "404":
          description: Vendor payment not found
        "409":
          description: The payment is already void
  /finance/reports/ap-aging:
    get:
      operationId: getApAgingReport
      tags: [finance]
      summary: A/P aging as of a date
      description: |
        Bills bucketed by how far past due they were on the as-of date.
        Balances are replayed from dated snapshots, so editing an old bill
        today cannot change what this report says about an earlier date.
        Unapplied credit is listed alongside, never netted into the payable.
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: asOf
          schema: { type: string }
          description: |
            A bare `YYYY-MM-DD` resolves to the end of that day in `timeZone`.
            Defaults to now.
        - in: query
          name: timeZone
          schema: { type: string, maxLength: 64 }
          description: IANA zone used to resolve a bare `asOf` date.
        - in: query
          name: detail
          schema: { type: string, enum: ["true", "false"] }
          description: Include the per-bill breakdown on each row.
      responses:
        "200":
          description: A/P aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApAgingReportResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
  /finance/reports/ar-aging:
    get:
      operationId: getArAgingReport
      tags: [finance]
      summary: A/R aging as of a date
      description: |
        Invoices bucketed by how far past due they were on the as-of date.
        Invoice payment rows carry a payment date but no reversal date, so an
        as-of date earlier than a reversal cannot see the payment that existed
        at the time. Rather than manufacture certainty, the affected accounts
        are reported in `limitations`.
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: asOf
          schema: { type: string }
          description: |
            A bare `YYYY-MM-DD` resolves to the end of that day in `timeZone`.
            Defaults to now.
        - in: query
          name: timeZone
          schema: { type: string, maxLength: 64 }
          description: IANA zone used to resolve a bare `asOf` date.
        - in: query
          name: detail
          schema: { type: string, enum: ["true", "false"] }
          description: Include the per-invoice breakdown on each row.
      responses:
        "200":
          description: A/R aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingReportResult"
        "400":
          description: Validation error
        "403":
          description: Caller lacks a billing role in this lab
  /admin/backup/restore/status:
    get:
      operationId: getRestoreStatus
      tags: [backup]
      summary: Get current restore phase and progress
      description: |
        Returns the current restore state for polling. The `phase` field cycles
        through `idle → uploading → validating → decrypting → restoring_db →
        restoring_media → done | error`. Requires the `X-Platform-Admin-Secret`
        header.
      responses:
        "200":
          description: Current restore state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStatusResult"
        "403":
          description: Admin access required
  /admin/backup/restore/from-onedrive:
    post:
      operationId: restoreBackupFromOneDrive
      tags: [backup]
      summary: Restore the most-recent backup from OneDrive
      description: |
        The server lists the configured OneDrive backup folder, downloads the
        most-recently-modified `.zip.enc` file, and runs the same restore
        pipeline as `POST /admin/backup/restore`. Returns 202 immediately.
        Requires the `X-Platform-Admin-Secret` header. Returns 409 if a
        restore is already in progress.
      responses:
        "202":
          description: Restore from OneDrive started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreStartResult"
        "403":
          description: Admin access required
        "409":
          description: Another restore is already in progress
  /admin/backup/audited-organization-recovery:
    post:
      operationId: recoverAuditedOrganizations
      tags: [backup]
      summary: Recover the owner-approved, rehearsed missing organization cohort
      description: |
        Operator-only action requiring X-Platform-Admin-Secret. A lab role,
        shared admin PIN, and admin session alone are not sufficient.
        Defaults to a dry run. Inserts only the fixed 24 audit-proven parents
        approved on October 12, 2026; changed evidence or dependencies refuse
        the whole operation. It does not retire records or verify a full restore.
        Repeated requests return the immutable receipt without overwriting later edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditedOrganizationRecoveryInput"
      responses:
        "200":
          description: Dry-run assessment or committed/replayed recovery receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditedOrganizationRecoveryResult"
        "400":
          description: Invalid input or missing exact live confirmation
        "403":
          description: Authenticated platform automation access required
        "409":
          description: Scope, evidence, dependency, or transaction conflict
  /lab/backup/generate:
    get:
      operationId: downloadLabScopedBackup
      tags: [backup]
      summary: Download an encrypted backup scoped to an administered lab
      description: |
        Requires an authenticated active owner or admin membership. The server
        resolves the permitted lab from the caller's memberships; the optional
        labOrganizationId selects among those memberships and is never trusted
        as authorization by itself. The archive includes only the selected
        lab's records and referenced media. Recovery is for a new, isolated
        database; this endpoint does not grant access to platform-wide backups
        or restore operations.
      parameters:
        - in: query
          name: labOrganizationId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Streamed encrypted lab-scoped backup archive
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: A lab selection is required when multiple eligible labs exist
        "401":
          description: Authentication required
        "403":
          description: No active owner/admin membership for the selected lab
        "500":
          description: The archive could not be generated
  /admin/backup/run:
    post:
      operationId: runBackupNow
      tags: [backup]
      summary: Run an immediate full backup
      description: |
        Triggers an immediate full backup (all cases, invoices, media, etc.)
        to the chosen destination. Requires the X-Platform-Admin-Secret header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRunRequest"
      responses:
        "202":
          description: Cloud backup accepted when respondAsync is true; poll the exact runId until a verified terminal result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRunResult"
        "200":
          description: Backup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRunResult"
        "400":
          description: Invalid destination or missing path
        "403":
          description: Admin access required
  /admin/backup/status/{runId}:
    get:
      operationId: getBackupRunStatus
      tags: [backup]
      summary: Get shared phase and exact terminal result for one backup run
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shared live status, with the matching history result after verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupJobStatus"
        "404":
          description: No live status is available for this run
  /admin/backup/schedule:
    get:
      operationId: getBackupSchedule
      tags: [backup]
      summary: Get the current backup schedule configuration
      description: |
        Returns the recurring backup schedule stored in system settings.
        Requires the X-Platform-Admin-Secret header.
      responses:
        "200":
          description: Current schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupScheduleResult"
        "403":
          description: Admin access required
    put:
      operationId: saveBackupSchedule
      tags: [backup]
      summary: Save the recurring backup schedule
      description: |
        Persists the schedule configuration to system settings and restarts
        the in-process recurring backup job. Requires the
        X-Platform-Admin-Secret header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupScheduleInput"
      responses:
        "200":
          description: Schedule saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupScheduleResult"
        "400":
          description: Invalid interval or destination
        "403":
          description: Admin access required
    delete:
      operationId: disableBackupSchedule
      tags: [backup]
      summary: Disable the recurring backup schedule
      description: |
        Sets the schedule to disabled in system settings and stops the
        in-process interval job. Requires the X-Platform-Admin-Secret header.
      responses:
        "200":
          description: Schedule disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  enabled: { type: boolean }
        "403":
          description: Admin access required
  /admin/backup/database-retention:
    put:
      operationId: saveDatabaseProtectionRetention
      tags: [backup]
      summary: Save the approved production database retention policy
      description: |
        Updates the dependency-aware retention policy for production database
        recovery points. Enabling cleanup requires explicit owner approval.
        The retention policy is disabled by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseProtectionRetentionInput"
      responses:
        "200":
          description: Retention policy saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseProtectionRetentionResult"
        "400":
          description: Invalid policy, missing explicit owner approval, or active database protection
        "403":
          description: Platform administrator access required
  /admin/backup/onedrive-status:
    get:
      operationId: getOneDriveBackupStatus
      tags: [backup]
      summary: Check whether a OneDrive account is connected for backups
      description: |
        Reports whether the Replit-managed Microsoft OneDrive integration is
        connected and usable for server-side backups, including the connected
        account name/email and the target backup folder. Requires the
        X-Platform-Admin-Secret header.
      responses:
        "200":
          description: OneDrive connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneDriveBackupStatusResult"
        "403":
          description: Admin access required
  /admin/backup/google-drive-status:
    get:
      operationId: getGoogleDriveBackupStatus
      tags: [backup]
      summary: Check whether a Google Drive account is connected for backups
      description: |
        Reports whether the Replit-managed Google Drive integration is
        connected and usable for server-side backups, including the connected
        account name/email and the target LabTrax backup folder. Credentials
        are never returned. Requires the X-Platform-Admin-Secret header.
      responses:
        "200":
          description: Google Drive connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleDriveBackupStatusResult"
        "403":
          description: Admin access required
  /admin/backup/desktop-run-report:
    post:
      operationId: reportDesktopBackupRun
      tags: [backup]
      summary: Record a local-folder backup run executed by the desktop app
      description: |
        Local-folder schedules are executed by the LabTrax Desktop app while it
        is open — it downloads the backup, writes it to the chosen folder, then
        reports the outcome here so the run lands in backup history and a
        success updates the backup-staleness watermark. Requires the
        X-Platform-Admin-Secret header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopBackupRunReportInput"
      responses:
        "200":
          description: Run recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopBackupRunReportResult"
        "400":
          description: Invalid report payload
        "403":
          description: Admin access required
  /rx-practice-aliases:
    get:
      operationId: getRxPracticeAlias
      tags: [cases]
      summary: Look up a saved Rx-name → practice alias for a lab
      description: |
        Returns the saved provider organization ID for the given
        (labOrganizationId, rxName) pair if one exists. The rxName is
        matched case-insensitively (normalized to lowercase). Returns
        `found: false` when no alias is stored. Lab-member auth required.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: rxName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alias lookup result (found or not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RxPracticeAliasResult"
        "400":
          description: Missing required query parameters
        "403":
          description: Caller is not a member of the lab
    post:
      operationId: upsertRxPracticeAlias
      tags: [cases]
      summary: Save or update an Rx-name → practice alias for a lab
      description: |
        Upserts an alias that maps a normalized Rx doctor/practice name to a
        specific provider organization for the given lab. On conflict
        (same lab + rxName) the providerOrganizationId is updated in place.
        Lab-member auth required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RxPracticeAliasInput"
      responses:
        "200":
          description: Alias saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RxPracticeAliasResult"
        "400":
          description: Missing or invalid fields
        "403":
          description: Caller is not a member of the lab
  /rx-doctor-practice-memory:
    get:
      operationId: getRxDoctorPracticeMemory
      tags: [cases]
      summary: Look up or list remembered doctor practices in a lab
      description: |
        With doctorName, returns the provider organization remembered for the
        given (labOrganizationId, doctorName) pair. The doctor name is
        normalized with the same comparison rules the duplicate-doctor logic
        uses, so casing, extra whitespace, and "Dr." title variants all
        collapse to one key. Returns found: false when nothing is remembered.

        Without doctorName, returns every remembered mapping for the lab.
        Listing mappings requires an owner or admin membership.

        This is the DOCTOR-keyed counterpart to `/rx-practice-aliases`, and the
        higher-priority one during AI intake: a doctor's practice is stable,
        the practice text printed on a prescription is not.
        Lab-member auth required.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: doctorName
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Memory lookup result (found or not found)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RxDoctorPracticeMemoryResult"
                  - $ref: "#/components/schemas/RxDoctorPracticeMemoryListResult"
        "400":
          description: Missing or invalid query parameters
        "403":
          description: Caller is not a member of the lab, or listing is not allowed
        "500":
          description: Lookup failed (e.g. the backing table has not been applied)
    post:
      operationId: upsertRxDoctorPracticeMemory
      tags: [cases]
      summary: Remember which practice a doctor belongs to
      description: |
        Upserts a doctor → practice mapping for the given lab. On conflict
        (same lab + normalized doctor name) the providerOrganizationId is
        updated in place, so re-confirming a doctor's practice overwrites the
        previous answer rather than erroring.

        The provider organization must be an active practice owned by
        `labOrganizationId` — lab membership alone is not sufficient, since the
        stored id is auto-selected for the lab later. Lab-member auth required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RxDoctorPracticeMemoryInput"
      responses:
        "200":
          description: Mapping saved
          content:
            application/json:
              schema:
