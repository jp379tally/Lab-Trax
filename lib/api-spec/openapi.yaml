                  ok: { type: boolean }
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
        "404":
          description: Not found
  /catalog/tree:
    get:
      operationId: getCatalogTree
      tags: [catalog]
      summary: Get a lab's effective Case Type → Subtype → Material tree (any active member)
      description: |
        Merges the static `@workspace/case-taxonomy` defaults with this lab's
        `lab_catalog_entries` customizations at read time — nothing is
        backfilled per lab, so a lab with zero customizations sees exactly
        today's built-in tree. Case types themselves (Restorative, Removable,
        Ortho) are fixed and never carry an id/isCustom/isActive — they are
        not independently editable rows.
      parameters:
        - in: query
          name: labOrganizationId
          required: true
          schema: { type: string }
        - in: query
          name: includeInactive
          required: false
          description: Defaults to true (matches every value except the literal string "false").
          schema: { type: string }
      responses:
        "200":
          description: Effective catalog tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTreeResult"
        "400":
          description: Missing labOrganizationId
        "403":
          description: Not a lab member
  /catalog/entries:
    post:
      operationId: createCatalogEntry
      tags: [catalog]
      summary: Add a custom subtype or material to a lab's catalog (admin only)
      description: |
        `entryType` only accepts `subtype` or `material` — case types are
        fixed and cannot be created. A subtype must omit `parentKey`; a
        material must set it to either a built-in subtype key or another
        custom subtype's `custom:<id>` key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryResult"
        "400":
          description: Invalid case type, parentKey misuse, blank label, or invalid priceKeyOverride
        "403":
          description: Not a lab admin
        "404":
          description: Custom parentKey not found
  /catalog/entries/{id}:
    patch:
      operationId: updateCatalogEntry
      tags: [catalog]
      summary: Rename, reorder, or toggle a custom catalog entry (admin only)
      description: |
        Only works on lab-added custom entries. Built-in entries must go
        through `PATCH /catalog/builtin-overrides` instead (400 here).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogEntryInput"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryResult"
        "400":
          description: Target is a built-in entry, blank label, or invalid priceKeyOverride
        "403":
          description: Not a lab admin
        "404":
          description: Not found
    delete:
      operationId: deleteCatalogEntry
      tags: [catalog]
      summary: Delete a custom catalog entry (admin only, usage-guarded)
      description: |
        Blocked with 409 when the entry (or, for a subtype, any of its
        custom material children) is referenced by an existing
        `case_restorations` row, mirroring the `lab_vocabulary` delete
        guard. Pass `force=true` to delete anyway. Deleting a custom
        subtype cascades to delete its custom material children.
        Built-in entries can never be deleted (400) — disable them instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: force
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCatalogEntryResult"
        "400":
          description: Target is a built-in entry
        "403":
          description: Not a lab admin
        "404":
          description: Not found
        "409":
          description: Blocked — entry is in use (see usageCount); retry with force=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryDeleteBlockedResult"
  /catalog/builtin-overrides:
    patch:
      operationId: upsertCatalogBuiltinOverride
      tags: [catalog]
      summary: Disable, reorder, or price-override a built-in subtype/material (admin only)
      description: |
        Upserts by natural key (lab + entryType + caseType + parentKey + key)
        — safe to call repeatedly, and a partial update never resets a
        previously-set field. `label` is not accepted: built-in labels are
        always the static taxonomy label. `entryType` only accepts `subtype`
        or `material` — case types can never be targeted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCatalogBuiltinOverrideInput"
      responses:
        "200":
          description: Upserted override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryResult"
        "400":
          description: Invalid case type, unknown built-in key, or invalid priceKeyOverride
        "403":
          description: Not a lab admin
