    DoctorMergeSource:
      type: object
      required:
        - doctorName
      properties:
        doctorName: { type: string }
        providerOrganizationId:
          type: string
          nullable: true
          description: |
            May be `null` for legacy cases that were created without a
            practice attached.
    DoctorMergeRequest:
      type: object
      required:
        - sources
        - targetDoctorName
        - labOrganizationId
      properties:
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DoctorMergeSource"
        targetDoctorName: { type: string }
        targetProviderOrganizationId:
          type: string
          nullable: true
          description: |
            Practice that will own the target doctor's cases. Must be
            supplied — even if the target had no cases before the merge —
            so the merge can resolve practice-less targets in one call.
        labOrganizationId: { type: string }
        includeSoftDeleted:
          type: boolean
          default: false
          description: |
            When true, soft-deleted cases under each source group are
            also remapped to the target.
    DoctorMergeAuditEntry:
      type: object
      properties:
        auditLogId: { type: string }
        sourceDoctorName: { type: string }
        sourceProviderOrganizationId:
          type: string
          nullable: true
        casesMoved: { type: integer }
        overridesMoved: { type: integer }
        overridesCollapsed: { type: integer }
    DoctorMergeResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            casesMoved: { type: integer }
            overridesMoved: { type: integer }
            overridesCollapsed: { type: integer }
            targetDoctorName: { type: string }
            targetProviderOrganizationId:
              type: string
              nullable: true
            undoWindowMs:
              type: integer
              description: |
                How many milliseconds the undo button should remain
                actionable, mirroring the server's configured window
                (`DOCTOR_MERGE_UNDO_WINDOW_MINUTES`).
            entries:
              type: array
              items:
                $ref: "#/components/schemas/DoctorMergeAuditEntry"
    DoctorMergePreviewSource:
      type: object
      properties:
        doctorName: { type: string }
        providerOrganizationId:
          type: string
          nullable: true
        practiceName:
          type: string
          nullable: true
        totalCases: { type: integer }
        firstCaseAt:
          type: string
          nullable: true
        lastCaseAt:
          type: string
          nullable: true
        recentCaseNumbers:
          type: array
          items: { type: string }
        overridesCount: { type: integer }
    DoctorMergePreview:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            totalCases: { type: integer }
            totalOverrides: { type: integer }
            sources:
              type: array
              items:
                $ref: "#/components/schemas/DoctorMergePreviewSource"
            targetExists: { type: boolean }
            targetCases: { type: integer }
    DoctorMergeUndoResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            casesReverted: { type: integer }
            overridesReverted: { type: integer }
            sourceDoctorName: { type: string }
            sourceProviderOrganizationId:
              type: string
              nullable: true
    LegacyDoctorDirectoryEntry:
      type: object
      properties:
        doctorName: { type: string }
        labOrganizationId: { type: string }
        totalCases: { type: integer }
    DoctorSearchEntry:
      type: object
      properties:
        doctorName: { type: string }
        providerOrganizationId:
          type: string
          nullable: true
        practiceName:
          type: string
          nullable: true
        practiceAccountNumber:
          type: string
          nullable: true
          description: |
            Lab-scoped account number of the doctor's practice
            (from organizations.account_number). Null when the doctor
            has no associated provider organization or the practice has
            no account number set.
        platformAccountNumber:
          type: string
          nullable: true
          description: |
            The provider account number this doctor ALREADY has, when the
            name resolves to a provider account at one of this lab's
            practices. Null for a name-only doctor who has no account.
            Reassign/merge tooling shows it so an admin can see that cases
            fold onto an existing account instead of producing another one.
        totalCases: { type: integer }
        similarity:
          type: number
          description: |
            0..1 similarity to the `like` query parameter, or 0 when
            `like` was not supplied.
    DoctorSearchResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            entries:
              type: array
              items:
                $ref: "#/components/schemas/DoctorSearchEntry"
            total: { type: integer }
            offset: { type: integer }
            limit: { type: integer }
    DoctorDuplicateEntry:
      type: object
      properties:
        doctorName: { type: string }
        providerOrganizationId:
          type: string
          nullable: true
        practiceName:
          type: string
          nullable: true
        totalCases: { type: integer }
        accountCount:
          type: integer
          description: |
            How many live provider *accounts* carry this exact name in this
            practice. Greater than 1 means the row is itself a duplicate-account
            cluster, even when `totalCases` is 0.
        platformAccountNumber:
          type: string
          nullable: true
          description: |
            The provider account number this doctor ALREADY has, so the merge
            UI can name the account the kept doctor keeps. Null for a name-only
            doctor with no provider account. When the row carries several
            duplicate accounts this is the one consolidation would keep (the
            oldest account number). Looked up in one batched pass per lab
            alongside the duplicate scan, so the badge endpoint stays fast.
    DoctorDuplicateCluster:
      type: object
      properties:
        labOrganizationId: { type: string }
        labName:
          type: string
          nullable: true
        topScore:
          type: number
          description: Highest pairwise similarity within the cluster (0..1).
        clusterKey:
          type: string
          description: Stable key for this cluster, used for dismiss/restore.
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/DoctorDuplicateEntry"
        kind:
          type: string
          enum: [name, account]
          description: |
            `name` — duplicate doctor names found on cases (the original scan).
            `account` — duplicate provider accounts for one person, which may
            have no cases at all.
        conflictReason:
          type: string
          nullable: true
          description: |
            Why an account cluster was not consolidated automatically
            (conflicting emails or phone numbers). Null when there is no
            conflict.
        survivingAccountNumber:
          type: string
          nullable: true
          description: |
            For `account` clusters: the one account number that survives
            consolidating this whole cluster (the oldest across every member,
            the same survivor the consolidation endpoint picks). Every other
            account in the cluster is retired onto it, so a UI beside the
            consolidate action must call only this one "kept". Null for `name`
            clusters — merging names retires no account, each doctor keeps the
            account they already have — and null when no member has a number.
    DoctorDismissedCluster:
      type: object
      properties:
        labOrganizationId: { type: string }
        clusterKey: { type: string }
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/DoctorDuplicateEntry"
        dismissedAt: { type: string }
    DoctorDuplicateClusterDismissInput:
      type: object
      required: [labOrganizationId, clusterKey, doctors]
      properties:
        labOrganizationId: { type: string }
        clusterKey: { type: string }
        doctors:
          type: array
          items:
            $ref: "#/components/schemas/DoctorDuplicateEntry"
    DoctorDuplicateClusterRestoreInput:
      type: object
      required: [labOrganizationId, clusterKey]
      properties:
        labOrganizationId: { type: string }
        clusterKey: { type: string }
    DoctorDuplicateClustersResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            totalGroups:
              type: integer
              description: Number of duplicate clusters — the nav badge count.
            totalDoctors:
              type: integer
              description: Total doctor entries across all clusters.
            clusters:
              type: array
              items:
                $ref: "#/components/schemas/DoctorDuplicateCluster"
            dismissedClusters:
              type: array
              description: Server-persisted "Do not merge" dismissals for this caller's labs.
              items:
                $ref: "#/components/schemas/DoctorDismissedCluster"
    DoctorAccountConsolidationInput:
      type: object
      required: [labOrganizationId, doctors]
      properties:
        labOrganizationId: { type: string }
        doctors:
          type: array
          minItems: 1
          maxItems: 100
          description: The duplicate rows to consolidate, as shown in the panel.
          items:
            type: object
            required: [doctorName]
            properties:
              doctorName: { type: string }
              providerOrganizationId:
                type: string
                nullable: true
        force:
          type: boolean
          description: |
            Consolidate even when the cluster's identity signals conflict
            (different emails or phone numbers). Defaults to false.
    DoctorAccountConsolidationEntry:
      type: object
      properties:
        auditLogId:
          type: string
          nullable: true
          description: Audit record for this consolidation; pass it to the undo endpoint.
        survivorUserId: { type: string }
        survivorName: { type: string }
        survivorAccountNumber:
          type: string
          nullable: true
        retiredUserIds:
          type: array
          items: { type: string }
        retiredAccountNumbers:
          type: array
          items: { type: string }
        referencesMoved:
          type: integer
          description: Total rows repointed at the surviving account.
    DoctorAccountConsolidationResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            consolidations:
              type: array
              items:
                $ref: "#/components/schemas/DoctorAccountConsolidationEntry"
            accountsRetired: { type: integer }
            undoWindowMs:
              type: integer
              description: How long the consolidation stays reversible.
    DoctorAccountConsolidationUndoResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            undone: { type: boolean }
            survivorUserId: { type: string }
            restoredUserIds:
              type: array
              items: { type: string }
    RemoveDoctorFromPracticeInput:
      type: object
      required: [existingCases]
      properties:
        userId:
          type: string
          nullable: true
          description: |
            Real provider user id. Omit (or null) for a virtual (name-only)
            doctor — the server resolves them to their existing account when
            they have one, and otherwise records the removal by name.
            Removing a doctor never creates an account.
        doctorName:
          type: string
          description: |
            The doctor's display name used to match their cases/invoices.
            Required for virtual doctors; an optional override for real ones
            (defaults to the user's own doctorName).
        destinationOrganizationId:
          type: string
          nullable: true
          description: |
            When supplied, the doctor is reassigned to this practice instead of
            being sent to the Unassigned holding area. Must be a sibling
            practice under the same lab.
        existingCases:
          type: string
          enum: [leave, move]
          default: leave
          description: |
            What to do with the doctor's existing cases + invoices. `move` is
            only honoured when a destination is supplied.
    RemoveDoctorFromPracticeResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            userId:
              type: string
              nullable: true
              description: |
                The doctor's existing account, when they have one. Null for a
                name-only doctor — removal never creates an account.
            promotedFromVirtual:
              type: boolean
              description: |
                Deprecated, always false. Removal no longer promotes a
                name-only doctor into a new account.
            reusedExistingAccount:
              type: boolean
              description: |
                True when a name-only doctor was matched to the account they
                already have instead of a new one being created.
            matchedOn:
              type: string
              nullable: true
              enum: [email, phone, name]
              description: Which identity signal matched the existing account.
            platformAccountNumber:
              type: string
              nullable: true
              description: Account number of the reused account, when there is one.
            doctorName:
              type: string
              nullable: true
            destinationPracticeId:
              type: string
              nullable: true
            casesMoved: { type: integer }
            invoicesMoved: { type: integer }
            unassigned: { type: boolean }
    UnassignedDoctorEntry:
      type: object
      properties:
        id: { type: string }
        userId:
          type: string
          nullable: true
          description: |
            Null for a name-only entry — a doctor removed from a practice who
            has no provider account (removal never creates one).
        hasAccount:
          type: boolean
          description: Whether this entry is backed by a provider account.
        username:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        doctorName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        platformAccountNumber:
          type: string
          nullable: true
        removedFromOrganizationId: { type: string }
        removedFromPracticeName:
          type: string
          nullable: true
        removedAt:
          type: string
          nullable: true
    UnassignedDoctorsResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/UnassignedDoctorEntry"
    ReassignUnassignedDoctorInput:
      type: object
      required:
        - labOrganizationId
        - destinationOrganizationId
        - existingCases
      properties:
        labOrganizationId: { type: string }
        userId:
          type: string
          nullable: true
          description: |
            Account-backed entry. Omit for a name-only entry and supply
            `doctorName` instead; a name-only doctor's cases move to the
            destination practice rather than an account being created.
        doctorName:
          type: string
          description: Required for a name-only entry; identifies the holding row.
        destinationOrganizationId: { type: string }
        existingCases:
          type: string
          enum: [leave, move]
          default: leave
    ReassignUnassignedDoctorResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            userId:
              type: string
              nullable: true
            doctorName:
              type: string
              nullable: true
            destinationPracticeId: { type: string }
            casesMoved: { type: integer }
            invoicesMoved: { type: integer }
    LabProvider:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        displayName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
        platformAccountNumber:
          type: string
          nullable: true
    LabProviderList:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            providers:
              type: array
              items:
                $ref: "#/components/schemas/LabProvider"
    UpdateCaseInput:
      type: object
      properties:
        status:
          type: string
          enum: [received, in_design, scan, in_milling, post_mill, sintering_furnace, model_room, in_porcelain, qc, complete, shipped, delivered, on_hold, remake, cancelled]
        priority:
          type: string
          enum: [normal, rush]
        labLocationId:
          type: string
          nullable: true
          description: >
            Lab station where the case is physically located. Null clears the
            stored station without changing the case status.
        receivedAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >
            Calendar date the case was received. Updating this field also
            updates the Issued date of every invoice linked to the case.
        dueDate: { type: string, format: date-time, nullable: true }
        dueTime:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Optional literal wall-clock time of day for the due date, in HH:MM format. Null clears it.
        doctorName: { type: string }
        patientFirstName: { type: string }
        patientLastName: { type: string }
        providerOrganizationId:
          type: string
          description: |
            Re-assign the case to a different provider organization.
            Must be an active provider org that belongs to the same lab
            as the case (validated server-side).
        clearSuggestion:
          type: boolean
          description: |
            When `true`, clears the AI-generated `suggestedDoctorName` and
            `suggestedProviderOrgId` fields without affecting any other
            case fields. Used by the "Keep as-is" action in the desktop
            review banner.
        bridgeConnectors:
          type: string
          description: |
            Comma-separated bridge-connector tooth-pair string controlling
            which adjacent restorations form a bridge span. An empty string
            clears all connectors on the case.
        expectedDeliveryDate:
          type: string
          format: date-time
          nullable: true
          description: Expected delivery date; `null` clears it.
        casePanBarcode:
          type: string
          description: |
            Physical tray (pan) barcode assigned to this case. An empty
            string or omitted value leaves the existing barcode unchanged.
            Trimmed server-side.
        caseNumber:
          type: string
          description: |
            New case number. Admin/owner members only. Must be non-empty and
            unique across all cases. Returns 409 if already in use.
        rxNotes:
          type: string
          nullable: true
          description: Freeform Rx/case notes visible to the lab.
        gingivialShade:
          type: string
          nullable: true
          description: >
            Gingival / tissue shade for Removable cases (e.g. "Light Pink").
            Null clears it. Ignored for non-Removable cases.
        remakeReasonKey:
          type: string
          # BEGIN GENERATED REMAKE REASON KEYS
          enum: [fit_contacts, fit_occlusion, fit_margins, shade_wrong, wrong_material_doctor, wrong_material_lab, crown_broke, bridge_broke, denture_broke, partial_broke, denture_fit_occlusion, denture_fit_intaglio, partial_fit_occlusion, partial_fit_intaglio, denture_tissue_color, partial_tissue_color, denture_material_wrong, partial_material_wrong, other]
          # END GENERATED REMAKE REASON KEYS
          description: Controlled remake-reason key (replaces free-text remakeReason). When set to `other`, remakeReason must contain the trimmed custom explanation.
        remakeReason:
          type: string
          maxLength: 2000
          description: Human-readable remake reason text (legacy / display fallback).
        remakeCharged:
          type: boolean
          nullable: true
          description: Whether this remake is charged to the provider.
        remakeShadeLightness:
          type: string
          enum: [light, dark]
          nullable: true
          description: Direction of shade correction needed.
        remakeShadePrescribed:
          type: string
          nullable: true
          description: Shade that was originally prescribed.
        remakeShadeProvided:
          type: string
          nullable: true
          description: Shade that was actually delivered (caused the remake).
        remakeMaterialPrescribed:
          type: string
          nullable: true
          description: Material that was originally prescribed.
        remakeMaterialProvided:
          type: string
          nullable: true
          description: Material that was actually delivered (caused the remake).
        remakeReturnedToLab:
          type: boolean
          nullable: true
          description: Whether the original case was physically returned to the lab.
        remakeCategory:
          type: string
          enum: [crown_bridge, removable]
          nullable: true
          description: |
            High-level category for the remake. Auto-inferred server-side
            from `remakeReasonKey` when omitted.
    IteroImportResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            deduped: { type: boolean }
            caseId: { type: string, nullable: true }
            caseNumber: { type: string, nullable: true }
            needsAiReview: { type: boolean }
            attachmentId: { type: string, nullable: true }
            iteroOrderId: { type: string }
            suggestedDoctorName:
              type: string
              nullable: true
              description: |
                Present when the AI-extracted doctor name closely matches
                (but does not exactly equal) an existing doctor on file.
                Shown as a "Did you mean?" prompt in the desktop review
                banner. Cleared via `PATCH /cases/{caseId}` with
                `clearSuggestion: true`.
            suggestedProviderOrgId:
              type: string
              nullable: true
              description: Provider org id of the suggested match doctor.
            suggestedPracticeName:
              type: string
              nullable: true
              description: |
                Display name of the suggested provider org, resolved
                server-side so the desktop banner needs no extra round-trip.
    IteroImportHistoryResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [sessions, total, limit, offset]
          properties:
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
            sessions:
              type: array
              items:
                type: object
                required: [batchId, importedAt, createdCount, dedupedCount, erroredCount, totalCount, caseIds]
                properties:
                  batchId: { type: string }
                  importedAt: { type: string, format: date-time }
                  importedByUserId: { type: string, nullable: true }
                  importedByUsername: { type: string, nullable: true }
                  importedByName: { type: string, nullable: true }
                  createdCount: { type: integer }
                  dedupedCount: { type: integer }
                  erroredCount: { type: integer }
                  totalCount: { type: integer }
                  caseIds:
                    type: array
                    items: { type: string }
    IteroZipBatchImportResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                type: object
                required: [filename, status]
                properties:
                  filename: { type: string }
                  status:
                    type: string
                    enum: [created, deduped, error]
                  caseId: { type: string, nullable: true }
                  caseNumber: { type: string, nullable: true }
                  iteroOrderId: { type: string, nullable: true }
                  extraFilesAttached: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
    IteroZipImportResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            deduped: { type: boolean }
            caseId: { type: string, nullable: true }
            caseNumber: { type: string, nullable: true }
            needsAiReview: { type: boolean }
            attachmentId: { type: string, nullable: true }
            iteroOrderId: { type: string }
            extraFilesAttached:
              type: integer
              description: Number of non-Rx files from the ZIP that were attached to the case.
            extraFilesFailed:
              type: integer
              description: Number of non-Rx files that could not be attached (partial-failure indicator).
            suggestedDoctorName:
              type: string
              nullable: true
            suggestedProviderOrgId:
              type: string
              nullable: true
    InvoiceLineItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        id: { type: string }
        toothNumber: { type: integer, nullable: true }
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        lineTotal: { type: number }
        isDiscount:
          type: boolean
          description: True for invoice discount lines; discount unitPrice and lineTotal are negative.
        sortOrder: { type: integer }
        parentLineItemId: { type: string, nullable: true, description: "ID of the parent line item; null for top-level items" }
        subItems:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLineItem" }
          description: "Nested sub-items (one level only). Present only on top-level items in GET responses."
    PatchInvoiceItem:
      type: object
      required: [description, quantity, unitPrice]
      properties:
        toothNumber: { type: integer, nullable: true }
        description: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        isDiscount:
          type: boolean
          description: True for invoice discount lines; send a negative unitPrice.
        sortOrder: { type: integer }
        subItems:
          type: array
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              toothNumber: { type: integer, nullable: true }
              description: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }
              isDiscount:
                type: boolean
                description: True for invoice discount lines; send a negative unitPrice.
              sortOrder: { type: integer }
    OpenInvoice:
      type: object
      required:
        - id
        - invoiceNumber
        - status
        - total
        - balanceDue
        - labOrganizationId
        - providerOrganizationId
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        status: { type: string, description: "open | partially_paid | overdue" }
        total: { type: string, description: "Decimal string" }
        balanceDue: { type: string, description: "Decimal string" }
        issuedAt: { type: string, format: date-time, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        ageDays: { type: integer, nullable: true }
        labOrganizationId: { type: string }
        providerOrganizationId: { type: string }
    OpenInvoiceListResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/OpenInvoice" }
    AccountGeneratedStatementsListResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountGeneratedStatementsPage"
            - type: array
              items: { $ref: "#/components/schemas/AccountGeneratedStatementRow" }
    AccountGeneratedStatementsPage:
      type: object
      required: [providerOrganizationId, rows, total, limit, offset, hasMore]
      properties:
        providerOrganizationId: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AccountGeneratedStatementRow" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    AccountGeneratedStatementRow:
      type: object
      description: >
        Generated statement with its invoice ids. `totalBilled` is the issued
        snapshot; the settlement figures are derived live from the statement's
        current invoice balances.
      additionalProperties: true
      properties:
        id: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        invoiceCount: { type: integer, minimum: 0 }
        totalBilled:
          type: string
          description: Amount billed, as captured on the issued statement.
        totalPaid:
          type: string
          description: Live settled amount across the statement's invoices.
        currentTotalPaid:
          type: string
          description: Explicit alias of the live settled amount.
        balanceDue:
          type: string
          description: Live outstanding amount across the statement's invoices.
        currentBalanceDue:
          type: string
          description: Explicit alias of the live outstanding amount.
        savedBalanceDue:
          type: string
          description: Live outstanding amount; retained for existing callers.
        snapshotTotalPaid:
          type: string
          description: Amount paid as frozen when the statement was generated.
        snapshotBalanceDue:
          type: string
          description: Balance due as frozen when the statement was generated.
        invoiceIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    StatementPaymentContextResult:
      type: object
      properties:
        ok: { type: boolean }
        data: { $ref: "#/components/schemas/StatementPaymentContext" }
    StatementPaymentContext:
      type: object
      description: >
        One generated statement prepared for payment review. `totalBilled`,
        the invoice identities, and the `snapshot*` figures are the immutable
        issued record; the paid and balance-due figures are derived live from
        the statement's current invoice balances so the same statement cannot
        read as settled in one place and unpaid in another.
      additionalProperties: true
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        providerOrganizationId: { type: string }
        periodStart: { type: string, format: date-time, nullable: true }
        periodEnd: { type: string, format: date-time, nullable: true }
        invoiceCount: { type: integer, minimum: 0 }
        totalBilled: { type: string }
        totalPaid:
          type: string
          description: Live settled amount across the statement's invoices.
        currentTotalPaid:
          type: string
          description: Explicit alias of the live settled amount.
        balanceDue:
          type: string
          description: Live outstanding amount across the statement's invoices.
        currentBalanceDue:
          type: string
          description: Explicit alias of the live outstanding amount.
        savedBalanceDue:
          type: string
          description: Live outstanding amount; retained for existing callers.
        snapshotTotalPaid:
          type: string
          description: Amount paid as frozen when the statement was generated.
        snapshotBalanceDue:
          type: string
          description: Balance due as frozen when the statement was generated.
        hasInvoiceDetailSnapshots:
          type: boolean
          description: False when this legacy statement predates trustworthy invoice-detail snapshots.
        detailProvenance:
          type: string
          enum: [snapshot, live, mixed]
          description: Whether invoice display details are guaranteed issued snapshots or reconstructed from current invoices.
        invoices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              invoiceNumber: { type: string }
              patientName: { type: string, nullable: true }
              billTo: { type: string, nullable: true }
              status: { type: string }
              issuedAt: { type: string, format: date-time, nullable: true }
              dueAt: { type: string, format: date-time, nullable: true }
              total: { type: string }
              currentBalanceDue: { type: string }
              eligibleForPayment: { type: boolean }
              detailProvenance:
                type: string
                enum: [snapshot, live, unavailable]
                description: Snapshot details, current/live reconstruction, or unavailable because the legacy invoice was soft-deleted.
    StatementChargesResult:
      type: object
      description: >
        Legacy data is the existing providerOrganizationId/rows/endingBalance
        object. Paging is opt-in and adds page metadata plus both ledger
        boundary balances.
      properties:
        ok: { type: boolean }
        data:
          oneOf:
            - $ref: "#/components/schemas/StatementChargesPage"
            - $ref: "#/components/schemas/StatementChargesLegacyData"
    StatementChargesLegacyData:
      type: object
      required: [providerOrganizationId, rows, endingBalance]
      additionalProperties: false
      properties:
        providerOrganizationId: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/StatementChargeRow" }
        endingBalance: { type: string }
    StatementChargesPage:
      type: object
      required: [providerOrganizationId, rows, total, limit, offset, hasMore, openingBalance, endingBalance]
      properties:
        providerOrganizationId: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/StatementChargeRow" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        openingBalance:
          type: string
          description: Balance immediately before the oldest row returned in this page.
        endingBalance:
          type: string
          description: Balance immediately after the newest row returned in this page.
    StatementChargeRow:
      type: object
      description: >
        Invoice, statement, payment, credit, or credit-application ledger
        event. One payment received from a practice is a single event even
        when it settled several invoices: it carries the full amount received
        on its payment date and identifies itself by method, receipt
        reference, and applied statement rather than borrowing the number,
        doctor, and patient of one invoice. A payment recorded directly
        against a single invoice keeps that invoice's details.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable event key, unique across the whole ledger.
        date: { type: string, format: date-time }
        type:
          type: string
          description: invoice, statement, payment, credit_application, or customer_credit.
        rowType: { type: string }
        typeLabel:
          type: string
          description: Reader-facing label, e.g. "Payment (3 invoices)".
        invoiceNumber: { type: string, nullable: true }
        invoiceCount:
          type: integer
          nullable: true
          description: Invoices settled by a payment event.
        doctorIdentity: { type: string, nullable: true }
        doctorName: { type: string, nullable: true }
        patientName: { type: string, nullable: true }
        invoiceAmount: { type: string, nullable: true }
        paymentAmount: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        referenceNumber:
          type: string
          nullable: true
          description: Receipt number of the payment, or the payment's own reference.
        statementId: { type: string, nullable: true }
        statementLabel:
          type: string
          nullable: true
          description: Period of the related statement, formatted MM-YYYY.
        paymentSessionId: { type: string, nullable: true }
        creditApplicationId: { type: string, nullable: true }
        openBalance: { type: string }
        balance: { type: string }
    StatementAccountSummaryListResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/StatementAccountSummary" }
