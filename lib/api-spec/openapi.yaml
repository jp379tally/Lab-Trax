  /cases/overview:
    get:
      operationId: getCasesOverview
      tags: [cases]
      summary: Complete authorized Cases workbench counts
      description: |
        Counts non-deleted canonical and legacy cases with the same organization
        authorization and canonical ownership rules as the worklist. Independent
        of search, filters and pagination. Conflicts counts active cases sharing
        a non-empty barcode in the same lab, not collision groups.
        Due today uses the due date, falling back to expected delivery date,
        excludes closed cases and passed due times, and compares the stored
        calendar day to the viewer's local date and clock.
        Processing includes design, scan, milling, porcelain, quality-control,
        on-hold, and remake statuses. In transit counts shipped cases; completed
        counts complete and delivered cases. Overdue uses the viewer's local
        calendar day and excludes complete, delivered, and cancelled cases.
      parameters:
        - name: organizationId
          in: query
          schema: { type: string }
        - name: localDate
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: localTime
          in: query
          required: true
          schema: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
      responses:
        "200":
          description: Complete authorized counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CasesOverviewStats"
        "400":
          description: Invalid local calendar date or time
        "401":
          description: Not authenticated
        "403":
          description: Organization not authorized
