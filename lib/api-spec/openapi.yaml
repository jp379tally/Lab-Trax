    InvoiceDetailResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          description: Invoice row with line items and totals
          additionalProperties: true
          properties:
            frozen:
              type: boolean
              description: True when the invoice is permanently frozen because the linked case was deleted.
            caseDeletedAt:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of case deletion that triggered the freeze.
            caseDeletedByUserId:
              type: string
              nullable: true
              description: User ID of the actor who deleted the linked case.
            caseDeletedNote:
              type: string
              nullable: true
              description: "Permanent note stamped on freeze, e.g. 'Case Deleted by JW'."
            linkedCaseIsDeleted:
              type: boolean
              nullable: true
              description: >
                True if the linked case is still soft-deleted, false if it has since been restored,
                null if no canonical case record could be found (e.g. legacy invoice with no caseId).
                Only meaningful when `frozen` is true.
            linkedCaseNumber:
              type: string
              nullable: true
              description: >
                Case number of the linked canonical case (e.g. "A-1042"). Included on frozen invoices
                so the banner can display and link directly to the case without a separate fetch.
    PreviewDraftInvoiceInput:
      type: object
      required: [labOrganizationId, restorations]
      properties:
        labOrganizationId:
          type: string
          description: Lab org the caller must be an active member of.
        providerOrganizationId:
          type: string
          nullable: true
          description: Provider/practice org used to resolve practice-tier pricing.
        doctorName:
          type: string
          nullable: true
          description: Doctor name used to resolve per-doctor price overrides.
        bridgeConnectors:
          type: string
          nullable: true
          description: >
            Comma-separated connector pairs ("13-14,14-15"). When present, adjacent
            pontic+crown spans collapse into a single bridge line item.
        restorations:
          type: array
          maxItems: 64
          items:
            type: object
            required: [restorationType]
            properties:
              toothNumber:
                type: string
                description: Tooth number ("8") or empty string for non-tooth items.
              restorationType:
                type: string
                description: Restoration type (e.g. "Crown", "Pontic").
              material:
                type: string
                nullable: true
              shade:
                type: string
                nullable: true
              quantity:
                type: integer
                minimum: 1
                maximum: 99
                default: 1
    PreviewDraftInvoiceResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            lineItems:
              type: array
              items:
                type: object
                properties:
                  description: { type: string }
                  toothNumber:
                    type: integer
                    nullable: true
                  toothLabel:
                    type: string
                    nullable: true
                  quantity: { type: integer }
                  unitPrice:
                    type: string
                    description: Per-unit price as a fixed-2 decimal string.
                  lineTotal:
                    type: string
                    description: Line total as a fixed-2 decimal string.
                  priceSource:
                    type: string
                    nullable: true
                    description: "Where the price came from: default, tier, override, discount, or null when unpriced."
                  priceKey:
                    type: string
                    nullable: true
                  priced:
                    type: boolean
                    description: False when no price could be resolved (renders as "not priced").
                  restorationIndices:
                    type: array
                    items:
                      type: integer
                    description: >
                      Indices (into the request `restorations` array) of every
                      source restoration collapsed into this line. The desktop
                      preview uses these to map a user's inline price edit back
                      to the exact restorations and thread the override into
                      case creation.
            subtotal:
              type: string
              description: Sum of all line totals as a fixed-2 decimal string.
            total:
              type: string
              description: Invoice total (equals subtotal; preview applies no tax/discount).
    UpdateInvoiceInput:
      type: object
      properties:
        status:
          type: string
          enum: [open, partially_paid, paid, void]
          nullable: true
        tax:
          type: number
          minimum: 0
          nullable: true
        discount:
          type: number
          minimum: 0
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        issuedAt:
          type: string
          format: date-time
          nullable: true
        invoiceNumber:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          description: Invoice notes; provider-facing reads and invoice outputs show these only when shareNotesWithProvider is true.
        shareNotesWithProvider:
          type: boolean
          description: Explicitly share invoice notes with the linked provider. Unset legacy values are private.
        providerOrganizationId:
          type: string
          nullable: true
        items:
          type: array
          nullable: true
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              id: { type: string }
              toothNumber: { type: integer, nullable: true }
              toothLabel: { type: string, nullable: true }
              description: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }
              isDiscount:
                type: boolean
                description: True only for a fixed-amount discount line; its unitPrice is negative.
              sortOrder: { type: integer }
              subItems:
                type: array
                items:
                  type: object
                  required: [description, quantity, unitPrice]
                  properties:
                    id: { type: string }
                    toothNumber: { type: integer, nullable: true }
                    description: { type: string }
                    quantity: { type: number }
                    unitPrice: { type: number }
                    isDiscount:
                      type: boolean
                      description: True only for a fixed-amount discount line; its unitPrice is negative.
                    sortOrder: { type: integer }
        displayMetadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Free-form invoice presentation metadata (teeth, shade, patientName,
            billTo, caseNotes, credits, lineItems). Server merges/overwrites
            displayMetadataJson; credits drive total. Spread existing metadata
            before writing to avoid clobbering desktop-authored fields.
        layoutPresetId:
          type: string
          nullable: true
