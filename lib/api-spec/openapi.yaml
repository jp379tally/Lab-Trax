        runId: { type: string, format: uuid }
        state: { type: string, enum: [running, awaiting_verification, completed, failed, stale] }
        phase: { type: string }
        elapsedMs: { type: integer }
        metrics:
          type: object
          additionalProperties: { type: number }
        error: { type: string }
        result:
          $ref: "#/components/schemas/BackupRunResult"
    BackupScheduleInput:
      type: object
      required: [interval, unit, destination, enabled]
      properties:
        interval:
          type: integer
          description: "Number of interval units between backups (e.g. 15 minutes, 1 hour)"
        unit:
          type: string
          enum: [minutes, hours]
          description: "Unit for the interval value"
        destination:
          type: string
          enum: [onedrive, google-drive, local, network]
        path:
          type: string
          nullable: true
        enabled:
          type: boolean
    BackupScheduleResult:
      type: object
      properties:
        offsite:
          type: object
          additionalProperties: true
          properties:
            enabled: { type: boolean }
            running: { type: boolean }
            intervalMinutes: { type: integer }
            lastVerifiedAt: { type: string, nullable: true }
            databaseProtection:
              $ref: "#/components/schemas/DatabaseProtectionStatus"
        sourceEnvironment:
          type: string
          enum: [development, production]
          description: The connected server's immutable backup source. Use the development app or published app to select a source; this field does not rebind a database.
        ok: { type: boolean }
        interval:
          type: integer
          nullable: true
          description: "Number of interval units (null if no schedule is set)"
        unit:
          type: string
          nullable: true
          enum: [minutes, hours]
          description: "Unit for the interval value"
        destination:
          type: string
          nullable: true
          enum: [onedrive, google-drive, local, network]
        path:
          type: string
          nullable: true
        databaseRetention:
          $ref: "#/components/schemas/DatabaseProtectionRetentionSchedule"
        enabled: { type: boolean }
    DatabaseProtectionStatus:
      type: object
      description: Production database and readable media in encrypted content-addressed storage. Fresh database exports; reusable media chunks, not WAL/PITR. Missing originals mean partial coverage.
      properties:
        mode: { type: string, enum: [incremental-storage-fresh-export, incremental-records-and-media] }
        scope: { type: string, enum: [production-database-and-media] }
        coverage: { type: string, enum: [complete, partial] }
        mediaFiles: { type: integer }
        mediaBytes: { type: number }
        missingFiles: { type: integer }
        state: { type: string, enum: [not_started, running, verified, skipped_busy, failed] }
        stage: { type: string }
        lastAttemptAt: { type: string, nullable: true }
        lastVerifiedAt: { type: string, nullable: true }
        recoveryPointAt: { type: string, nullable: true }
        lastDestinationCheckAt: { type: string, nullable: true }
        point: { type: string, nullable: true }
        dumpBytes: { type: number }
        newChunks: { type: number }
        newBytes: { type: number, description: Encrypted new chunk bytes, excluding small point/marker metadata. }
        reusedChunks: { type: number }
        error: { type: string, nullable: true }
    DatabaseProtectionRetentionInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        confirmation:
          type: string
          enum: [APPROVE_DATABASE_RETENTION]
          description: Required when enabling destructive cleanup.
        keepAllWithinHours: { type: integer, minimum: 1, maximum: 2160 }
        keepHourlyWithinDays: { type: integer, minimum: 1, maximum: 365 }
        keepDailyWithinDays: { type: integer, minimum: 1, maximum: 3650 }
        safetyGraceHours: { type: integer, minimum: 48, maximum: 720 }
    DatabaseProtectionRetentionConfig:
      type: object
      required:
        - enabled
        - keepAllWithinHours
        - keepHourlyWithinDays
        - keepDailyWithinDays
        - safetyGraceHours
        - approvedAt
        - approvedBy
      properties:
        enabled: { type: boolean }
        keepAllWithinHours: { type: integer }
        keepHourlyWithinDays: { type: integer }
        keepDailyWithinDays: { type: integer }
        safetyGraceHours: { type: integer }
        approvedAt: { type: [string, "null"], format: date-time }
        approvedBy: { type: [string, "null"] }
    DatabaseProtectionRetentionStatus:
      type: object
      required: [state, pendingObjects, deletedObjects, lastUpdatedAt, error]
      properties:
        state:
          type: string
          enum: [planned, deleting, complete, paused, failed, disabled, not_started]
        pendingObjects: { type: integer }
        deletedObjects: { type: integer }
        lastUpdatedAt: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
    DatabaseProtectionRetentionSchedule:
      allOf:
        - $ref: "#/components/schemas/DatabaseProtectionRetentionConfig"
        - type: object
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/DatabaseProtectionRetentionStatus"
    DatabaseProtectionRetentionResult:
      allOf:
        - $ref: "#/components/schemas/DatabaseProtectionRetentionConfig"
        - type: object
          required: [ok]
          properties:
            ok: { type: boolean }
    OneDriveBackupStatusResult:
