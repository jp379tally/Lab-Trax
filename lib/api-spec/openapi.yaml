      required: [id, key, label, isCustom, isActive, sortOrder, priceKey]
      properties:
        id:
          type: string
          nullable: true
          description: Catalog row id for a custom entry or a built-in that has an override row; null for an un-overridden built-in.
        key: { type: string }
        label: { type: string }
        isCustom: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        priceKey:
          type: string
          nullable: true
          description: priceKeyOverride if set, else the static taxonomy pricing key for this material.
    EffectiveSubtypeNode:
      type: object
      required: [id, key, label, isCustom, isActive, sortOrder, priceKey, materials]
      properties:
        id:
          type: string
          nullable: true
          description: Catalog row id for a custom entry or a built-in that has an override row; null for an un-overridden built-in.
        key: { type: string }
        label: { type: string }
        isCustom: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        priceKey:
          type: string
          nullable: true
          description: Only meaningful for flat subtypes with no material children (e.g. retainers, sports_guards).
        materials:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveMaterialNode"
    EffectiveCaseTypeNode:
      type: object
      required: [key, label, subtypes]
      description: Case types are fixed — no id/isCustom/isActive — they are not independently editable rows.
      properties:
        key:
          type: string
          enum: [restorative, removable, ortho]
        label: { type: string }
        subtypes:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveSubtypeNode"
    EffectiveCatalogTree:
      type: object
      required: [labOrganizationId, caseTypes]
      properties:
        labOrganizationId: { type: string }
        caseTypes:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveCaseTypeNode"
    CatalogTreeResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/EffectiveCatalogTree"
    CatalogEntry:
      type: object
      required:
        [
          id,
          labOrganizationId,
          entryType,
          caseType,
          parentKey,
          key,
          label,
          isCustom,
          isActive,
          sortOrder,
          priceKeyOverride,
          createdByUserId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        labOrganizationId: { type: string }
        entryType:
          type: string
          enum: [subtype, material]
        caseType:
          type: string
          enum: [restorative, removable, ortho]
        parentKey:
          type: string
          description: '"" for a subtype (no parent); a built-in subtype key or another custom subtype''s key for a material.'
        key:
          type: string
          description: Literal taxonomy key for a built-in override row, or `custom:<own id>` for a custom entry.
        label: { type: string }
        isCustom: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        priceKeyOverride: { type: string, nullable: true }
        createdByUserId: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    CatalogEntryResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          $ref: "#/components/schemas/CatalogEntry"
    CreateCatalogEntryInput:
      type: object
      required: [labOrganizationId, entryType, caseType, label]
      properties:
        labOrganizationId: { type: string }
        entryType:
          type: string
          enum: [subtype, material]
        caseType: { type: string }
        parentKey:
          type: string
          description: Required for a material (a built-in subtype key or another custom subtype's key); not allowed for a subtype.
        label: { type: string }
        isActive: { type: boolean }
        sortOrder:
          type: integer
          description: Defaults to the end of the current sibling list when omitted.
        priceKeyOverride: { type: string, nullable: true }
    UpdateCatalogEntryInput:
      type: object
      description: All fields optional; only works on custom entries (built-ins return 400 — use PATCH /catalog/builtin-overrides).
      properties:
        label: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        priceKeyOverride: { type: string, nullable: true }
    UpsertCatalogBuiltinOverrideInput:
      type: object
      required: [labOrganizationId, entryType, caseType, key]
      properties:
        labOrganizationId: { type: string }
        entryType:
          type: string
          enum: [subtype, material]
        caseType: { type: string }
        parentKey:
          type: string
          description: Required for a material override (must be a built-in subtype key of caseType); not allowed for a subtype override.
        key:
          type: string
          description: The built-in taxonomy key being overridden.
        isActive: { type: boolean }
        sortOrder: { type: integer }
        priceKeyOverride: { type: string, nullable: true }
    DeleteCatalogEntryResult:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [deleted, usageCount, cascadedMaterialCount]
          properties:
