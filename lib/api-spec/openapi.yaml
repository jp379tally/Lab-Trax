        labOrganizationId: { type: string }
        rxName: { type: string }
        providerOrganizationId: { type: string }
    RxDoctorPracticeMemoryResult:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            found: { type: boolean }
            providerOrganizationId:
              type: string
              nullable: true
    RxDoctorPracticeMemoryMapping:
      type: object
