    delete:
      operationId: removeMembership
      tags: [organizations]
      summary: Remove a membership (admin only)
      parameters:
        - in: path
          name: membershipId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /organizations/{organizationId}/doctors/remove:
    post:
      operationId: removeDoctorFromPractice
      tags: [organizations]
      summary: Remove (detach) a doctor from a practice; optionally reassign
      description: |
        Detaches a doctor from the given practice without deleting the user
        account. The doctor either moves to another practice (when
        `destinationOrganizationId` is supplied) or lands in the per-lab
        "Unassigned doctors" holding area. The `existingCases` choice decides
        whether the doctor's existing cases + invoices stay with the old
        practice (`leave`) or follow the doctor (`move`); `move` is only
        honoured when a destination is supplied — sending to Unassigned always
        leaves cases behind. Virtual (name-only) doctors are promoted to a real
        provider account first. Lab-admin only.
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveDoctorFromPracticeInput"
      responses:
        "200":
          description: Doctor removed or reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveDoctorFromPracticeResult"
  /organizations/{labId}/unassigned-doctors:
    get:
      operationId: listUnassignedDoctors
      tags: [organizations]
      summary: List the per-lab Unassigned doctors holding area (admin only)
      parameters:
        - in: path
          name: labId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unassigned doctors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnassignedDoctorsResult"
  /organizations/unassigned-doctors/reassign:
    post:
      operationId: reassignUnassignedDoctor
      tags: [organizations]
      summary: Reassign an unassigned doctor to a practice (admin only)
      description: |
        Moves a doctor out of the per-lab Unassigned holding area and attaches
        them to a destination practice. The `existingCases` choice decides
        whether the doctor's cases + invoices at the practice they were removed
        from follow them (`move`) or stay put (`leave`). Lab-admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignUnassignedDoctorInput"
      responses:
        "200":
          description: Doctor reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignUnassignedDoctorResult"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit-log entries for an organization (admin only). Contract for Phase 2 implementation.
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: before
          description: ISO timestamp cursor — return entries created before this time
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Audit-log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResult"
        "403":
          description: Insufficient role
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Summary analytics metrics for a lab with previous-period comparison
      description: |
        Read-only aggregate metrics for the Stats dashboard: total cases
        (canonical + legacy), invoiced revenue, average case value, most
        common case category, busiest weekday, and comparison against the
        immediately preceding period of equal length. Revenue comes from
        non-void `invoices.total` only; legacy blob invoices are excluded.
        All metrics follow the active category/material filters. Requires
        owner/admin/billing role on the lab.
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - $ref: "#/components/parameters/StatsDateFrom"
        - $ref: "#/components/parameters/StatsDateTo"
        - $ref: "#/components/parameters/StatsTimeZone"
        - $ref: "#/components/parameters/StatsCategory"
        - $ref: "#/components/parameters/StatsMaterial"
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummaryResult"
        "403":
          description: Insufficient role
  /stats/case-categories:
    get:
      operationId: getStatsCaseCategories
      tags: [stats]
      summary: Case counts by analytics category plus material breakdown
      description: |
        Case counts grouped by analytics category (implants, zirconia,
        crown & bridge, removable, other, uncategorized/legacy) for the
        window, including how many in each bucket are legacy `lab_cases`.
        Also returns a normalized material breakdown (canonical
        restorations only). Both breakdowns follow the active
        category/material filters. Requires owner/admin/billing role on
        the lab.
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - $ref: "#/components/parameters/StatsDateFrom"
        - $ref: "#/components/parameters/StatsDateTo"
        - $ref: "#/components/parameters/StatsTimeZone"
        - $ref: "#/components/parameters/StatsCategory"
        - $ref: "#/components/parameters/StatsMaterial"
      responses:
        "200":
          description: Category and material counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsCaseCategoriesResult"
        "403":
          description: Insufficient role
  /stats/revenue-series:
    get:
      operationId: getStatsRevenueSeries
      tags: [stats]
      summary: Invoiced revenue bucketed by day, week, month, or year
      description: |
        Revenue series from non-void, non-deleted `invoices.total` keyed on
        COALESCE(issuedAt, createdAt), bucketed in the requested timezone
        (weeks anchor to Monday). Optional category/material filters
        attribute an invoice via its linked case's category and materials;
        caseless invoices are excluded when filtering. Requires
        owner/admin/billing role.
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - $ref: "#/components/parameters/StatsDateFrom"
        - $ref: "#/components/parameters/StatsDateTo"
        - $ref: "#/components/parameters/StatsTimeZone"
        - $ref: "#/components/parameters/StatsCategory"
        - $ref: "#/components/parameters/StatsMaterial"
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        "200":
          description: Revenue series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsRevenueSeriesResult"
        "403":
          description: Insufficient role
  /stats/weekday-volume:
    get:
      operationId: getStatsWeekdayVolume
      tags: [stats]
      summary: Case volume by weekday of receipt, split by category
      description: |
        Case counts per weekday (0 = Monday … 6 = Sunday, computed in the
        requested timezone) with a per-category split, for canonical +
        legacy cases. Follows the active category/material filters.
        Requires owner/admin/billing role on the lab.
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - $ref: "#/components/parameters/StatsDateFrom"
        - $ref: "#/components/parameters/StatsDateTo"
        - $ref: "#/components/parameters/StatsTimeZone"
        - $ref: "#/components/parameters/StatsCategory"
        - $ref: "#/components/parameters/StatsMaterial"
      responses:
        "200":
          description: Weekday volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsWeekdayVolumeResult"
        "403":
          description: Insufficient role
  /stats/sales-forecast:
    get:
      operationId: getStatsSalesForecast
      tags: [stats]
      summary: Owner-only sales pace forecast for the current week/month/year
      description: |
        Projects total sales for the current week, month, and year from the
        pace so far, using Monday–Friday business days only:
        `forecast = periodToDateSales / elapsedBusinessDays * totalBusinessDays`.
        Elapsed business days run from the period start through today
        (inclusive) in the lab timezone; a weekend "today" is never counted as
        a worked day, and sales are summed only up to now (never the future).
        All arithmetic is performed server-side. Requires the **owner** role on
        the lab (stricter than the other stats endpoints).
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - $ref: "#/components/parameters/StatsTimeZone"
      responses:
        "200":
          description: Sales forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSalesForecastResult"
        "403":
          description: Insufficient role (owner required)
  /stats/remakes:
    get:
      operationId: getStatsRemakes
      tags: [stats]
      summary: Remake totals, recharge split, reason breakdown, time series, and records for a lab
      description: |
        Owner/admin-only remake analytics for the window: total remakes
        (canonical `cases.remakeOfCaseId` set + legacy `lab_cases` blobs
        flagged as remakes), a recharge split (recharged vs not), a
        remake-reason breakdown, a time-series trend, and a full records list
        (newest first). All optional filter params apply to the summary,
        time series, and records simultaneously. Permission is intentionally
        narrower than the other stats endpoints: owner/admin ONLY, NOT billing.
      parameters:
        - $ref: "#/components/parameters/StatsOrganizationId"
        - in: query
          name: dateFrom
          required: false
          schema: { type: string }
          description: |
            Window start (ISO date or datetime, inclusive). Omit together
            with dateTo to include all remakes regardless of date (the "All
            remakes" preset).
        - in: query
          name: dateTo
          required: false
          schema: { type: string }
          description: |
            Window end (ISO date or datetime, inclusive). Omit together with
            dateFrom to include all remakes regardless of date (the "All
            remakes" preset).
        - $ref: "#/components/parameters/StatsTimeZone"
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [week, month]
          description: Time-series bucket size (default week).
        - in: query
          name: reasonKey
          schema: { type: string }
          description: Filter to a single structured remake reason key.
        - in: query
          name: recharged
          schema:
            type: string
            enum: ["yes", "no"]
          description: Filter by recharge status.
        - in: query
          name: returnedToLab
          schema:
            type: string
            enum: ["yes", "no"]
          description: Filter by whether the original case was returned to the lab.
        - in: query
          name: remakeCategory
          schema:
            type: string
            enum: [crown_bridge, removable, implant]
          description: Filter by remake category.
        - in: query
          name: doctorName
          schema: { type: string }
          description: |
            Filter to a single doctor (exact match against the name used in
            the `byDoctor` breakdown). Pass "Unknown" to match remakes with a
            blank or missing doctor name.
      responses:
        "200":
          description: Remake totals, reason breakdown, trend, and records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsRemakesResult"
        "403":
          description: Insufficient role (owner/admin required)

  # ── Vacation / Employee Hours ─────────────────────────────────────────────

  /api/vacation/requests:
