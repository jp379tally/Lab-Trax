name: Repair iOS 344 dependency lock

on:
  push:
    branches:
      - release/ios-344-2026-10-29
    paths:
      - .github/workflows/ios-344-dependency-repair.yml

permissions:
  contents: write

concurrency:
  group: labtrax-ios-344-dependency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Verify exact release branch and apply the narrow security override
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/ios-344-2026-10-29
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          app = json.loads(Path('artifacts/labtrax/app.json').read_text())['expo']
          assert app['ios']['bundleIdentifier'] == 'app.replit.labtrax'
          assert app['ios']['buildNumber'] == '344'
          path = Path('pnpm-workspace.yaml')
          text = path.read_text()
          old = '"decode-uri-component": "0.5.0"'
          new = '"decode-uri-component": "0.5.1"'
          if old not in text:
              assert text.count(new) == 1, 'Unexpected URI decoder override'
          else:
              assert text.count(old) == 1
              path.write_text(text.replace(old, new))
          assert 'minimumReleaseAge: 1440' in path.read_text()
          PY
      - name: Regenerate the lockfile with the same pnpm version as CI
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Verify decoder fix and bounded malformed-input handling
        run: |
          timeout 15 node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const base = resolve('node_modules/.pnpm/decode-uri-component@0.5.1/node_modules/decode-uri-component');
          const pkg = JSON.parse(readFileSync(`${base}/package.json`, 'utf8'));
          assert.equal(pkg.version, '0.5.1');
          const { default: decode } = await import(pathToFileURL(`${base}/index.js`).href);
          assert.equal(decode('hello%20world'), 'hello world');
          assert.equal(decode('%41%42%43'), 'ABC');
          let payload = '';
          for (let i = 0; i < 32000; i++) {
            payload += `%${Math.floor(i / 256).toString(16).padStart(2, '0')}%${(i % 256).toString(16).padStart(2, '0')}x`;
          }
          const start = performance.now();
          assert.equal(typeof decode(payload + '%zz'), 'string');
          assert.ok(performance.now() - start < 8000, 'URI decoder exceeded the safety budget');
          console.log('decode-uri-component 0.5.1 normal-input and malformed-input regressions passed.');
          JS
      - name: Run existing dependency-security regressions and audit
        run: |
          pnpm run test:dependency-security
          node scripts/check-dependency-audit.cjs
      - name: Commit only the verified dependency files without overwriting newer work
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= {'pnpm-workspace.yaml', 'pnpm-lock.yaml'}, changed
          PY
          if git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then
            echo 'The targeted repair is already present; no commit needed.'
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/release/ios-344-2026-10-29 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m 'Fix decode-uri-component advisory for iOS 344 [skip desktop-release]'
          git push origin HEAD:refs/heads/release/ios-344-2026-10-29
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
