name: Release

# Manually triggered, but anchored to an existing version tag rather than to
# whatever branch it is dispatched from. Without the required `tag` input, a
# dispatch from the default branch (main) would name the release "LabTrax main"
# and build whatever happens to be on main — not a specific vX.Y.Z. The build
# jobs check out the tag, so the packaged version and the release name always
# match the tag the operator selected.
#
# Two entry points, both anchored to a `tag` input:
#  • workflow_call  — the normal path. "Auto-tag Desktop release on merge to
#    main" creates the vX.Y.Z tag and then calls this workflow with it, so a
#    desktop-relevant merge produces a signed, published installer with no
#    manual step. The caller must pass `secrets: inherit` (signing,
#    notarization, and publish secrets are all read from `secrets.*` below).
#  • workflow_dispatch — the manual escape hatch. Run this workflow from the
#    Actions tab and enter an existing tag to rebuild/republish it.
#
# Both paths read the tag from `inputs.tag`, so every job below is identical
# regardless of how the run started. validate-tag applies the same format +
# existence checks either way.
on:
  workflow_call:
    inputs:
      tag:
        description: "Existing version tag to build and release (e.g. v1.0.5)."
        required: true
        type: string
      include_store_package:
        description: "Also build and attach the separately validated Microsoft Store MSIX"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and release (e.g. v1.0.5)."
        required: true
        type: string
      include_store_package:
        description: "Also build and attach the separately validated Microsoft Store MSIX"
        required: false
        default: false
        type: boolean

jobs:
  # ── Tag validation ────────────────────────────────────────────────────────────
  # Fail fast — before any build minutes are spent — if the operator supplied a
  # ref that is not a proper vX.Y.Z tag, or a tag that does not exist on origin.
  # This is what stops a dispatch from ever publishing a release named "main" or
  # building an unintended version.
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Input '$TAG' is not a valid version tag. Expected vMAJOR.MINOR.PATCH (e.g. v1.0.5), optionally with a prerelease suffix (e.g. v1.0.5-rc.1)."
            exit 1
          fi
          echo "::notice::Tag input format OK: $TAG"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag exists on origin
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist on origin. Run the auto-tag workflow first (or push the tag) before releasing."
            exit 1
          fi
          echo "::notice::Tag ${TAG} exists on origin — proceeding."

  # ── Provider isolation browser gate ──────────────────────────────────────────
  # Exercise the tagged desktop renderer before allocating build numbers or
  # packaging installers. The API process is started as well so this gate keeps
  # matching the two-service release topology, even though the focused browser
  # regression intercepts API responses to deterministically simulate two
  # practices and delayed stale responses.
  provider-isolation-browser:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/labtrax_e2e

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: labtrax_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d labtrax_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply isolated browser-test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Start API and desktop services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-service-logs

          PORT=4174 \
          NODE_ENV=test \
          JWT_SECRET=provider-isolation-browser-test \
          SESSION_SECRET=provider-isolation-browser-test \
            pnpm --filter @workspace/api-server run dev \
            >playwright-service-logs/api.log 2>&1 &
          echo "$!" > playwright-service-logs/api.pid

          PORT=4173 \
          BASE_PATH=/desktop/ \
          VITE_API_BASE_URL=http://127.0.0.1:4174 \
            pnpm --filter @workspace/labtrax-desktop run dev \
            >playwright-service-logs/desktop.log 2>&1 &
          echo "$!" > playwright-service-logs/desktop.pid

          for _attempt in {1..90}; do
            api_ready=false
            desktop_ready=false
            curl --fail --silent --output /dev/null http://127.0.0.1:4174/api/healthz && api_ready=true || true
            curl --fail --silent --output /dev/null http://127.0.0.1:4173/desktop/ && desktop_ready=true || true
            if [[ "$api_ready" == true && "$desktop_ready" == true ]]; then
              exit 0
            fi
            if ! kill -0 "$(cat playwright-service-logs/api.pid)" 2>/dev/null; then
              echo "::error::API service exited before becoming ready"
              cat playwright-service-logs/api.log
              exit 1
            fi
            if ! kill -0 "$(cat playwright-service-logs/desktop.pid)" 2>/dev/null; then
              echo "::error::Desktop service exited before becoming ready"
              cat playwright-service-logs/desktop.log
              exit 1
            fi
            sleep 1
          done

          echo "::error::Timed out waiting for API and desktop services"
          cat playwright-service-logs/api.log
          cat playwright-service-logs/desktop.log
          exit 1

      - name: Run provider practice isolation browser check
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: pnpm run test:e2e:provider-isolation

      - name: Stop API and desktop services
        if: always()
        shell: bash
        run: |
          for pid_file in playwright-service-logs/api.pid playwright-service-logs/desktop.pid; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-isolation-playwright-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            playwright-service-logs/

  # ── Approved Stripe authentication browser check ───────────────────────────
  # This job is deliberately separate from the ordinary e2e suite. It runs in
  # the protected stripe-test environment so repository/environment protection
  # rules can require explicit approval before a test-mode payment is created.
  # An incomplete configuration is a successful, explicitly skipped check; a
  # complete configuration makes failures block build-number allocation.
  stripe-authentication-browser:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    environment: stripe-test
    env:
      PLAYWRIGHT_STRIPE_RELEASE_VALIDATION: "1"
      PLAYWRIGHT_STRIPE_LIVE: ${{ secrets.PLAYWRIGHT_STRIPE_LIVE }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_STRIPE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_STRIPE_ACCESS_TOKEN }}
      PLAYWRIGHT_STRIPE_TEST_SECRET_KEY: ${{ secrets.PLAYWRIGHT_STRIPE_TEST_SECRET_KEY }}
      PLAYWRIGHT_STRIPE_LAB_ORGANIZATION_ID: ${{ secrets.PLAYWRIGHT_STRIPE_LAB_ORGANIZATION_ID }}
      PLAYWRIGHT_STRIPE_CANCEL_CARD_NUMBER: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_CARD_NUMBER }}
      PLAYWRIGHT_STRIPE_CANCEL_CARD_EXPIRY: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_CARD_EXPIRY }}
      PLAYWRIGHT_STRIPE_CANCEL_CARD_CVC: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_CARD_CVC }}
      PLAYWRIGHT_STRIPE_SUCCESS_CARD_NUMBER: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_CARD_NUMBER }}
      PLAYWRIGHT_STRIPE_SUCCESS_CARD_EXPIRY: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_CARD_EXPIRY }}
      PLAYWRIGHT_STRIPE_SUCCESS_CARD_CVC: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_CARD_CVC }}
      PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_PROVIDER_NAME: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_PROVIDER_NAME }}
      PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_INVOICE_NUMBER: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_INVOICE_NUMBER }}
      PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_AMOUNT: ${{ secrets.PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_AMOUNT }}
      PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_PROVIDER_NAME: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_PROVIDER_NAME }}
      PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_INVOICE_NUMBER: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_INVOICE_NUMBER }}
      PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_AMOUNT: ${{ secrets.PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_AMOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check approved Stripe test-mode configuration
        id: stripe-preflight
        shell: bash
        run: |
          set -euo pipefail

          required=(
            PLAYWRIGHT_STRIPE_LIVE
            PLAYWRIGHT_BASE_URL
            PLAYWRIGHT_STRIPE_ACCESS_TOKEN
            PLAYWRIGHT_STRIPE_TEST_SECRET_KEY
            PLAYWRIGHT_STRIPE_LAB_ORGANIZATION_ID
            PLAYWRIGHT_STRIPE_CANCEL_CARD_NUMBER
            PLAYWRIGHT_STRIPE_CANCEL_CARD_EXPIRY
            PLAYWRIGHT_STRIPE_CANCEL_CARD_CVC
            PLAYWRIGHT_STRIPE_SUCCESS_CARD_NUMBER
            PLAYWRIGHT_STRIPE_SUCCESS_CARD_EXPIRY
            PLAYWRIGHT_STRIPE_SUCCESS_CARD_CVC
            PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_PROVIDER_NAME
            PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_INVOICE_NUMBER
            PLAYWRIGHT_STRIPE_CANCEL_FIXTURE_AMOUNT
            PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_PROVIDER_NAME
            PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_INVOICE_NUMBER
            PLAYWRIGHT_STRIPE_SUCCESS_FIXTURE_AMOUNT
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::notice::Stripe authentication browser check skipped: approved configuration is incomplete (${#missing[@]} required values are unset)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # These checks intentionally inspect only mode/transport prefixes.
          # Never print the secret values, card values, or fixture values.
          if [[ "$PLAYWRIGHT_STRIPE_LIVE" != "1" ]]; then
            echo "::notice::Stripe authentication browser check skipped: explicit test-mode opt-in is not enabled."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PLAYWRIGHT_BASE_URL" != https://* ]]; then
            echo "::notice::Stripe authentication browser check skipped: target is not HTTPS."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PLAYWRIGHT_STRIPE_TEST_SECRET_KEY" != sk_test_* ]]; then
            echo "::notice::Stripe authentication browser check skipped: Stripe secret is not a test-mode key."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Approved Stripe test-mode configuration is complete; running the protected authentication check."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Chromium and system dependencies
        if: steps.stripe-preflight.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run protected Stripe authentication check
        if: steps.stripe-preflight.outputs.enabled == 'true'
        run: pnpm exec playwright test e2e/stripe-receive-payments-live.spec.ts --reporter=line

      - name: Record safe Stripe authentication results
        if: success() && steps.stripe-preflight.outputs.enabled == 'true'
        run: |
          echo "::notice::Stripe authentication cancellation passed: the payment stayed in its draft and accounting was unchanged."
          echo "::notice::Stripe authentication success passed: only the confirmed payment was recorded."

  # ── Build-number allocation ───────────────────────────────────────────────────
  # Runs first, before any platform build job. Reads the current build counter
  # from the tag, claims two consecutive numbers (one per platform), commits the
  # new high-water mark (N+2) to main, and exposes both numbers as job outputs.
  #
  # This serialisation replaces the old per-platform commit-back race: previously
  # Windows and macOS both started from the same tag (buildNumber = N), each
  # computed N+1 independently, and the second arrival silently treated the file
  # as already-bumped — so both shipped with the same build number. Now a single
  # atomic commit determines the allocation before either build begins.
  bump-build-number:
    needs: [provider-isolation-browser, stripe-authentication-browser]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      windows: ${{ steps.bump.outputs.windows }}
      macos: ${{ steps.bump.outputs.macos }}

    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD_BOT_TOKEN must have "bypass branch protection" rights so the
          # commit-back push succeeds on repos with PR-required or status-check
          # branch protection rules. Falls back to github.token on open repos.
          token: ${{ secrets.BUILD_BOT_TOKEN || github.token }}

      - name: Allocate build numbers and commit to main
        id: bump
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read the current counter from the tag working tree.
          CURRENT=$(node -p "require('./artifacts/labtrax-desktop/build-number.json').buildNumber")
          WINDOWS_NUM=$(( CURRENT + 1 ))
          MACOS_NUM=$(( CURRENT + 2 ))

          echo "windows=${WINDOWS_NUM}" >> "$GITHUB_OUTPUT"
          echo "macos=${MACOS_NUM}"    >> "$GITHUB_OUTPUT"
          echo "Allocated: Windows=${WINDOWS_NUM}, macOS=${MACOS_NUM} (was ${CURRENT})"

          # The checked-out ref depends on how this run started (a tag for a
          # manual dispatch, the caller's branch for a workflow_call). Switch to
          # main so the updated counter is always committed to the branch.
          git fetch origin main
          git checkout -B main origin/main

          # Write the high-water mark (macOS number, the larger of the two).
          node -e "
            const fs = require('fs'), p = 'artifacts/labtrax-desktop/build-number.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            d.buildNumber = ${MACOS_NUM};
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n', 'utf8');
          "
          git add artifacts/labtrax-desktop/build-number.json
          if git diff --cached --quiet; then
            echo "build-number.json already at ${MACOS_NUM} on main — nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump desktop build number to ${MACOS_NUM} (Windows=${WINDOWS_NUM}) [skip ci]"

          # Push with fetch+rebase retry in case another concurrent workflow
          # (e.g. a re-run) races this step.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "::warning::Push attempt ${attempt} failed — retrying in ${attempt}s…"
            git fetch origin main
            git rebase origin/main
            if git diff origin/main --quiet -- artifacts/labtrax-desktop/build-number.json; then
              echo "build-number.json already at ${MACOS_NUM} on origin/main — no push needed."
              pushed=true
              break
            fi
            sleep "$attempt"
          done
          if [[ "$pushed" != "true" ]]; then
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::All push attempts failed — build numbers were NOT persisted. Platform builds will still run using the allocated numbers; download the build-counter-fallback workflow artifact and apply it manually (see docs/build-counter-recovery.md)."
          fi

      - name: Upload build counter fallback artifact
        if: always() && steps.bump.outputs.push_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-counter-fallback
          path: artifacts/labtrax-desktop/build-number.json

      # Alert admins when the build-number commit fails to push.
      # Uses the same opt-in gating as the publish-failure alert: both secrets
      # must be set, otherwise the step skips without error.
      - name: Notify admins on build-number push failure
        if: always() && steps.bump.outputs.push_failed == 'true'
        shell: bash
        env:
          PLATFORM_ADMIN_SECRET: ${{ secrets.PLATFORM_ADMIN_SECRET }}
          PUBLISH_API_BASE_URL: ${{ secrets.PUBLISH_API_BASE_URL }}
        run: |
          if [[ -z "$PLATFORM_ADMIN_SECRET" || -z "$PUBLISH_API_BASE_URL" ]]; then
            echo "::notice::Skipping build-number push failure alert — PLATFORM_ADMIN_SECRET or PUBLISH_API_BASE_URL not set."
            exit 0
          fi
          BASE_URL="${PUBLISH_API_BASE_URL%/}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BUILD_NUM_FOR_ALERT=$(node -p "require('./artifacts/labtrax-desktop/build-number.json').buildNumber" 2>/dev/null || echo "")
          PAYLOAD=$(jq -n \
            --arg workflowName "${GITHUB_WORKFLOW}" \
            --arg runUrl "$RUN_URL" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg commitSha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg stage "build-number-commit" \
            --arg errorMessage "All 3 push attempts to persist build-number.json to main failed. The build number counter may not be correctly persisted — check branch protection rules or network connectivity." \
            --argjson attemptedBuildNumber "${BUILD_NUM_FOR_ALERT:-null}" \
            '{workflowName:$workflowName, runUrl:$runUrl, runId:$runId, commitSha:$commitSha, ref:$ref, stage:$stage, errorMessage:$errorMessage, attemptedBuildNumber:$attemptedBuildNumber}')
          echo "Reporting build-number push failure to $BASE_URL/api/admin/desktop-installer/publish-failure"
          NOTIFY_BODY=$(mktemp)
          NOTIFY_STATUS=$(curl --silent --show-error --output "$NOTIFY_BODY" --write-out '%{http_code}' \
            -X POST \
            -H "X-Platform-Admin-Secret: $PLATFORM_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$BASE_URL/api/admin/desktop-installer/publish-failure") || true
          NOTIFY_STATUS="${NOTIFY_STATUS:-000}"
          cat "$NOTIFY_BODY"; echo
          if [[ ! "$NOTIFY_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            BODY_TRUNC=$(head -c 500 "$NOTIFY_BODY")
            echo "::warning::Failed to deliver build-number push failure alert (HTTP $NOTIFY_STATUS): $BODY_TRUNC — admins will not receive an email for this run."
          fi

  # ── Windows build ────────────────────────────────────────────────────────────
  build-windows:
    needs: [bump-build-number]
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # Check out the exact tag being released so the packaged version comes
      # from the tag's tree, not from whatever branch the workflow was
      # dispatched against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require signing secrets
        shell: bash
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "::error::WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets must be set for tagged release builds. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Inject assigned build number
        # Write the number allocated by bump-build-number before electron-builder
        # reads build-number.json. This guarantees Windows and macOS always get
        # distinct values even when the jobs run in parallel.
        shell: bash
        run: |
          ASSIGNED=${{ needs.bump-build-number.outputs.windows }}
          node -e "
            const fs = require('fs'), p = 'artifacts/labtrax-desktop/build-number.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            d.buildNumber = ${ASSIGNED};
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n', 'utf8');
          "
          echo "::notice::Windows build number set to ${ASSIGNED}"

      - name: Build and package Windows installer
        # GH_TOKEN is intentionally omitted — electron-builder would otherwise
        # try to publish directly to a GitHub Release, creating a partial release
        # before the macOS build finishes. The publish-release job handles
        # creating the single unified release after both builds succeed.
        #
        # Without GH_TOKEN, electron-builder still writes all output files
        # (installer, latest.yml, blockmap) to electron-dist locally — we
        # capture them via upload-artifact below.
        run: pnpm --filter @workspace/labtrax-desktop run electron:build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build and validate Microsoft Store package
        if: ${{ inputs.include_store_package }}
        run: pnpm --filter @workspace/labtrax-desktop run electron:store-package
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ vars.STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PACKAGE_PUBLISHER: ${{ vars.STORE_PACKAGE_PUBLISHER }}
          STORE_PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PACKAGE_PUBLISHER_DISPLAY_NAME }}

      - name: Revalidate Microsoft Store package before publishing release assets
        if: ${{ inputs.include_store_package }}
        run: pnpm --filter @workspace/labtrax-desktop run electron:store-package:validate
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ vars.STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PACKAGE_PUBLISHER: ${{ vars.STORE_PACKAGE_PUBLISHER }}
          STORE_PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PACKAGE_PUBLISHER_DISPLAY_NAME }}

      - name: Verify installer signature
        if: env.CSC_LINK != ''
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $installers = Get-ChildItem -Path "artifacts/labtrax-desktop/electron-dist" -Filter "*.exe" -ErrorAction Stop
          if ($installers.Count -eq 0) {
            Write-Host "::error::No .exe installer found in artifacts/labtrax-desktop/electron-dist."
            exit 1
          }
          $failed = $false
          foreach ($installer in $installers) {
            Write-Host "Verifying signature: $($installer.Name)"
            signtool verify /pa /v "$($installer.FullName)"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Signature verification FAILED for $($installer.Name)."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All installers passed signature verification."

      # Auto-publish the freshly built installer to the live download page so
      # admins don't have to download → upload → update URL by hand. Gated by
      # the PLATFORM_ADMIN_SECRET and PUBLISH_API_BASE_URL secrets — if either
      # is unset, this step logs a notice and exits 0 (safe to disable).
      - name: Publish installer to live download page
        id: publish
        if: success()
        shell: bash
        env:
          PLATFORM_ADMIN_SECRET: ${{ secrets.PLATFORM_ADMIN_SECRET }}
          PUBLISH_API_BASE_URL: ${{ secrets.PUBLISH_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          if [[ -z "$PLATFORM_ADMIN_SECRET" || -z "$PUBLISH_API_BASE_URL" ]]; then
            # Publishing to /downloads/ is the whole point of this job — a
            # missing secret is a misconfiguration, not a benign opt-out.
            # (When called from auto-tag, the caller must use `secrets: inherit`.)
            echo "::error::PLATFORM_ADMIN_SECRET and PUBLISH_API_BASE_URL must both be set so the freshly built installer can be published to /downloads/. Add them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          BASE_URL="${PUBLISH_API_BASE_URL%/}"
          # electron-builder is configured to emit a stable filename
          # (electron-builder.yml → nsis.artifactName: LabTrax-Setup.exe), so
          # select it explicitly rather than globbing — avoids ambiguity if
          # additional .exe artifacts ever land in electron-dist.
          INSTALLER_PATH="artifacts/labtrax-desktop/electron-dist/LabTrax-Setup.exe"
          # Expose context for the on-failure notify step (see the next step).
          echo "stage=unknown" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$INSTALLER_PATH" ]]; then
            echo "stage=upload" >> "$GITHUB_OUTPUT"
            echo "error_message=Installer not found at $INSTALLER_PATH" >> "$GITHUB_OUTPUT"
            echo "::error::Installer not found at $INSTALLER_PATH; cannot publish."
            exit 1
          fi
          VERSION=$(node -p "require('./artifacts/labtrax-desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES=$(node scripts/src/lib/parse-release-notes.mjs \
            artifacts/labtrax-desktop/RELEASE_NOTES.md "v${VERSION}")
          if [[ -z "$NOTES" ]]; then
            NOTES="Released from GitHub Actions (event ${GITHUB_EVENT_NAME}, run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA})."
            echo "::notice::No entry for v${VERSION} found in RELEASE_NOTES.md — using generic notes."
          else
            echo "::notice::Using release notes for v${VERSION} from RELEASE_NOTES.md."
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Atomic publish (Task #749): one multipart call does upload +
          # settings + changelog in a single DB transaction, and the server
          # dispatches a deduped admin alert on failure. See
          # docs/desktop-publish-pipeline.md ("Why /publish exists").
          echo "Publishing $INSTALLER_PATH (v$VERSION) to $BASE_URL/api/admin/desktop-installer/publish"
          PUBLISH_BODY=$(mktemp)
          PUBLISH_STATUS=$(curl --silent --show-error --output "$PUBLISH_BODY" --write-out '%{http_code}' \
            -H "X-Platform-Admin-Secret: $PLATFORM_ADMIN_SECRET" \
            -F "file=@${INSTALLER_PATH};type=application/vnd.microsoft.portable-executable" \
            -F "version=${VERSION}" \
            -F "downloadUrl=/downloads/LabTrax-Setup.exe" \
            -F "releaseNotes=${NOTES}" \
            -F "workflowName=${GITHUB_WORKFLOW}" \
            -F "runUrl=${RUN_URL}" \
            -F "runId=${GITHUB_RUN_ID}" \
            -F "commitSha=${GITHUB_SHA}" \
            -F "ref=${RELEASE_TAG}" \
            "$BASE_URL/api/admin/desktop-installer/publish") || true
          PUBLISH_STATUS="${PUBLISH_STATUS:-000}"
          cat "$PUBLISH_BODY"; echo
          if [[ ! "$PUBLISH_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            BODY_TRUNC=$(head -c 1500 "$PUBLISH_BODY")
            STAGE_PARSED=$(jq -r '.stage // "unknown"' "$PUBLISH_BODY" 2>/dev/null || echo "unknown")
            echo "::error::Atomic publish failed (HTTP $PUBLISH_STATUS, stage=$STAGE_PARSED): $BODY_TRUNC"
            echo "::notice::Server-side dedup'd admin alert was dispatched by /publish — no follow-up notify needed."
            exit 1
          fi
          echo "::notice::Published LabTrax-Setup.exe v$VERSION to $BASE_URL (atomic /publish call)."

      - name: Upload Windows release assets
        # Upload the installer, auto-update manifest (latest.yml), and blockmap.
        # latest.yml is required by electron-updater to discover and verify new
        # versions — without it, auto-update silently fails for existing installs.
        uses: actions/upload-artifact@v4
        with:
          name: LabTrax-Windows-Assets
          path: |
            artifacts/labtrax-desktop/electron-dist/*.exe
            artifacts/labtrax-desktop/electron-dist/*.exe.blockmap
            artifacts/labtrax-desktop/electron-dist/latest.yml
          if-no-files-found: error

      - name: Upload Microsoft Store package as a separate workflow artifact
        if: ${{ inputs.include_store_package }}
        uses: actions/upload-artifact@v4
        with:
          name: LabTrax-Windows-Store-MSIX
          path: artifacts/labtrax-desktop/electron-dist/LabTrax-Store.msix
          if-no-files-found: error

  # ── macOS build ──────────────────────────────────────────────────────────────
  build-macos:
    needs: [bump-build-number]
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # Check out the exact tag being released so the packaged version comes
      # from the tag's tree, not from whatever branch the workflow was
      # dispatched against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require signing and notarization secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$CSC_LINK" ]]                    && missing+=("MACOS_CERTIFICATE")
          [[ -z "$CSC_KEY_PASSWORD" ]]            && missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -z "$APPLE_ID" ]]                    && missing+=("APPLE_ID")
          [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]] && missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [[ -z "$APPLE_TEAM_ID" ]]               && missing+=("APPLE_TEAM_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::The following GitHub Actions secrets must be set for tagged release builds:"
            for s in "${missing[@]}"; do echo "  • $s"; done
            echo ""
            echo "Add them in Settings → Secrets and variables → Actions."
            echo ""
            echo "Required secrets:"
            echo "  MACOS_CERTIFICATE             — base64-encoded .p12 Developer ID Application certificate"
            printf '%s\n' "                                  (encode with: base64 -i certificate.p12 | tr -d '\\n')"
            echo "  MACOS_CERTIFICATE_PASSWORD    — password protecting the .p12 file"
            echo "  APPLE_ID                      — Apple ID email (App Store Connect account)"
            echo "  APPLE_APP_SPECIFIC_PASSWORD   — app-specific password for the Apple ID"
            echo "                                  (generate at appleid.apple.com → Sign-In and Security)"
            echo "  APPLE_TEAM_ID                 — 10-character Team ID from developer.apple.com/account"
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Inject assigned build number
        # Write the number allocated by bump-build-number before electron-builder
        # reads build-number.json. This guarantees Windows and macOS always get
        # distinct values even when the jobs run in parallel.
        shell: bash
        run: |
          ASSIGNED=${{ needs.bump-build-number.outputs.macos }}
          node -e "
            const fs = require('fs'), p = 'artifacts/labtrax-desktop/build-number.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            d.buildNumber = ${ASSIGNED};
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n', 'utf8');
          "
          echo "::notice::macOS build number set to ${ASSIGNED}"

      - name: Build and notarize macOS DMG
        # GH_TOKEN is intentionally omitted — see the Windows build job for the
        # rationale. The zip targets are built alongside the DMG because
        # electron-updater uses them as the auto-update payload on macOS.
        run: pnpm --filter @workspace/labtrax-desktop run electron:build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ELECTRON_PLATFORM: mac
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Auto-publish the freshly built DMG to the live download page so
      # admins don't have to download → upload → update URL by hand. Mirrors
      # the Windows build job's publish step. Gated by the same secrets — if
      # either is unset, this step logs a notice and exits 0 (safe to disable).
      - name: Publish DMG to live download page
        if: success()
        shell: bash
        env:
          PLATFORM_ADMIN_SECRET: ${{ secrets.PLATFORM_ADMIN_SECRET }}
          PUBLISH_API_BASE_URL: ${{ secrets.PUBLISH_API_BASE_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$PLATFORM_ADMIN_SECRET" || -z "$PUBLISH_API_BASE_URL" ]]; then
            # Publishing to /downloads/ is the whole point of this job — a
            # missing secret is a misconfiguration, not a benign opt-out.
            # (When called from auto-tag, the caller must use `secrets: inherit`.)
            echo "::error::PLATFORM_ADMIN_SECRET and PUBLISH_API_BASE_URL must both be set so the freshly built DMG can be published to /downloads/. Add them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          BASE_URL="${PUBLISH_API_BASE_URL%/}"
          # electron-builder produces one DMG per arch (arm64 + x64), plus a
          # universal DMG if configured. The live download page exposes a
          # single /downloads/LabTrax.dmg slot, so we have to pick one for
          # broadest compatibility:
          #   1. universal — runs natively on both chips, ideal if present
          #   2. x64      — runs natively on Intel and via Rosetta 2 on
          #                 Apple Silicon (Rosetta translates x64→arm64,
          #                 NOT the reverse, so an arm64 DMG would be
          #                 unusable on Intel Macs)
          #   3. arm64    — last-resort fallback (Apple-Silicon-only)
          # nullglob keeps unmatched globs from leaving literal patterns
          # in the array (which would otherwise trip the [[ -f ]] check).
          shopt -s nullglob
          DIST_DIR="artifacts/labtrax-desktop/electron-dist"
          UNIVERSAL=( "$DIST_DIR"/*universal*.dmg )
          X64=( "$DIST_DIR"/*x64*.dmg )
          ARM64=( "$DIST_DIR"/*arm64*.dmg )
          ANY=( "$DIST_DIR"/*.dmg )
          shopt -u nullglob
          INSTALLER_PATH=""
          if   (( ${#UNIVERSAL[@]} > 0 )); then INSTALLER_PATH="${UNIVERSAL[0]}"
          elif (( ${#X64[@]} > 0 ));       then INSTALLER_PATH="${X64[0]}"
          elif (( ${#ARM64[@]} > 0 ));     then INSTALLER_PATH="${ARM64[0]}"
          elif (( ${#ANY[@]} > 0 ));       then INSTALLER_PATH="${ANY[0]}"
          fi
          if [[ -z "$INSTALLER_PATH" || ! -f "$INSTALLER_PATH" ]]; then
            echo "::error::No DMG found in $DIST_DIR; cannot publish."
            exit 1
          fi
          VERSION=$(node -p "require('./artifacts/labtrax-desktop/package.json').version")
          NOTES=$(node scripts/src/lib/parse-release-notes.mjs \
            artifacts/labtrax-desktop/RELEASE_NOTES.md "v${VERSION}")
          if [[ -z "$NOTES" ]]; then
            NOTES="Released from GitHub Actions (event ${GITHUB_EVENT_NAME}, run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA})."
            echo "::notice::No entry for v${VERSION} found in RELEASE_NOTES.md — using generic notes."
          else
            echo "::notice::Using release notes for v${VERSION} from RELEASE_NOTES.md."
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Atomic publish (Task #749): single multipart call to /publish
          # uploads the DMG AND updates system_settings + changelog in one
          # transaction. The API normalises the stored filename to LabTrax.dmg
          # so we don't need to rename here. See
          # docs/desktop-publish-pipeline.md ("Why /publish exists").
          echo "Publishing $INSTALLER_PATH (v$VERSION) to $BASE_URL/api/admin/desktop-installer/publish"
          curl --fail-with-body --show-error --silent \
            -H "X-Platform-Admin-Secret: $PLATFORM_ADMIN_SECRET" \
            -F "file=@${INSTALLER_PATH};type=application/x-apple-diskimage;filename=LabTrax.dmg" \
            -F "version=${VERSION}" \
            -F "downloadUrl=/downloads/LabTrax.dmg" \
            -F "releaseNotes=${NOTES}" \
            -F "workflowName=${GITHUB_WORKFLOW}" \
            -F "runUrl=${RUN_URL}" \
            -F "runId=${GITHUB_RUN_ID}" \
            -F "commitSha=${GITHUB_SHA}" \
            -F "ref=${RELEASE_TAG}" \
            "$BASE_URL/api/admin/desktop-installer/publish"
          echo
          echo "::notice::Published LabTrax.dmg v$VERSION to $BASE_URL (atomic /publish call)."

      - name: Upload macOS release assets
        # Upload DMGs (user download), zip archives (auto-updater payload),
        # blockmaps (integrity verification), and latest-mac.yml (version
        # manifest required by electron-updater for macOS auto-update).
        uses: actions/upload-artifact@v4
        with:
          name: LabTrax-macOS-Assets
          path: |
            artifacts/labtrax-desktop/electron-dist/*.dmg
            artifacts/labtrax-desktop/electron-dist/*.dmg.blockmap
            artifacts/labtrax-desktop/electron-dist/*.zip
            artifacts/labtrax-desktop/electron-dist/*.zip.blockmap
            artifacts/labtrax-desktop/electron-dist/latest-mac.yml
          if-no-files-found: error

  # ── Unified release ──────────────────────────────────────────────────────────
  # Runs only after both platform builds succeed. Downloads all release assets
  # from both platform build jobs and attaches them to a single GitHub Release.
  #
  # Auto-update manifest files (latest.yml, latest-mac.yml) are produced by
  # electron-builder locally during each platform build (GH_TOKEN is intentionally
  # omitted from those steps to prevent premature partial releases). The manifests
  # are captured via upload-artifact and attached here so that electron-updater
  # in existing installs can discover the new version on next launch.
  #
  # Required files for each platform's auto-updater:
  #   Windows  — latest.yml, *.exe, *.exe.blockmap
  #   macOS    — latest-mac.yml, *.zip, *.zip.blockmap (DMG is the user download,
  #              not the updater payload)
  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: LabTrax-Windows-Assets
          path: dist/windows

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: LabTrax-macOS-Assets
          path: dist/macos

      - name: Download Microsoft Store package
        if: ${{ inputs.include_store_package }}
        uses: actions/download-artifact@v4
        with:
          name: LabTrax-Windows-Store-MSIX
          path: dist/store

      - name: Verify expected release files are present
        # Fail fast if any required asset is missing before touching the release.
        # Auto-update manifests (latest.yml, latest-mac.yml) and their matching
        # payloads (*.exe + blockmap for Windows; *.zip + blockmap for macOS) must
        # all be present — a missing manifest means existing installs can't detect
        # the new version; a missing payload or blockmap breaks the download/verify
        # step inside electron-updater.
        shell: bash
        run: |
          failed=false
          check_file() {
            if compgen -G "$1" > /dev/null; then
              echo "✓ Found: $1"
            else
              echo "::error::Missing expected release file: $1"
              failed=true
            fi
          }
          # Windows: installer, auto-update manifest, and blockmap
          check_file "dist/windows/*.exe"
          check_file "dist/windows/*.exe.blockmap"
          check_file "dist/windows/latest.yml"
          # macOS: DMG (user download), zip + blockmap (auto-updater payload), manifest
          check_file "dist/macos/*.dmg"
          check_file "dist/macos/*.zip"
          check_file "dist/macos/*.zip.blockmap"
          check_file "dist/macos/latest-mac.yml"
          if [[ "${{ inputs.include_store_package }}" == "true" ]]; then
            check_file "dist/store/LabTrax-Store.msix"
          fi
          if [[ "$failed" == "true" ]]; then exit 1; fi

      - name: Create unified GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: LabTrax ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          body: |
            ## LabTrax ${{ inputs.tag }}

            > **This release is a draft.** All installers have been built and attached.
            > A team member should verify the attached files and edit these release notes
            > before publishing. To publish, run the **Publish Draft Release** workflow
            > from the Actions tab and enter `${{ inputs.tag }}` as the tag.

            ---

            Download the installer for your platform from the **Assets** section below.

            ---

            ### Windows

            1. Download the **LabTrax Setup \*.exe** file.
            2. Run the installer and follow the setup wizard (Next → Next → Finish).
            3. A desktop shortcut and Start Menu entry are created automatically.
            4. To uninstall, use **Add or Remove Programs** in Windows Settings.

            **Auto-update:** Existing installs are notified on next launch and can update with one click — no manual download needed.

            > The installer is code-signed, which reduces or eliminates Windows SmartScreen prompts.

            ${{ inputs.include_store_package && 'A separate `LabTrax-Store.msix` package is also attached for Microsoft Store submission. It does not replace the standalone EXE.' || '' }}

            ---

            ### macOS

            1. Download the **LabTrax-\*.dmg** file matching your chip:
               - **Apple Silicon (M1/M2/M3):** download the `arm64` DMG
               - **Intel Mac:** download the `x64` DMG
               - If a universal build is provided it runs natively on both.
            2. Open the DMG and drag **LabTrax** into your **Applications** folder.
            3. Launch LabTrax from Applications or Spotlight.

            **Auto-update:** Existing installs check for updates on launch.

            > The app is signed with a Developer ID certificate and notarized by Apple — macOS will open it without any security warning.

            ---

            The app connects to your lab's LabTrax server. Make sure your server URL is reachable before launching.
          files: |
            dist/windows/*.exe
            dist/windows/*.exe.blockmap
            dist/windows/latest.yml
            dist/macos/*.dmg
            dist/macos/*.dmg.blockmap
            dist/macos/*.zip
            dist/macos/*.zip.blockmap
            dist/macos/latest-mac.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Microsoft Store package to the draft release
        if: ${{ inputs.include_store_package }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/store/LabTrax-Store.msix --clobber
